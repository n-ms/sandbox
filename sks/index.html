t hat ein eigenes Ziel – das macht die Prüfungsantwort leicht merkbar. Nach der Bergung an Unterkühlung denken: die Person möglichst waagerecht halten und langsam wärmen."},{"id":"S113","cat":"Seemannschaft","nr":113,"bogen":10,"q":"Mit welchen Hilfsmitteln können Sie den Bezugspunkt (internationaler Begriff: Datum) für die Suche nach einem Überbordgefallenen sichern?","a":"1. Markierungsblitzboje,\n2. MOB-Taste eines GPS Geräts","e":"„Datum“ ist der Bezugspunkt, von dem aus gesucht wird. Die Blitzboje treibt mit der Person im Strom mit – oft besser als die feste GPS-Position."},{"id":"S114","cat":"Seemannschaft","nr":114,"bogen":12,"q":"Was gehört u. a. zur Sicherheitsausrüstung z. B. einer 10-m-Yacht? Nennen Sie mindestens 6 Ausrüstungsgegenstände.","a":"Lenzpumpen, Feuerlöscher, Seenotsignalmittel, Radarreflektor, Anker, Erste-Hilfe-Ausrüstung, Rettungsmittel, Handlampen, Funkeinrichtung, Werkzeuge und Ersatzteile, Pützen, und Lecksicherungsmaterial","e":"Denk in Notfällen: Wasser (Pumpen, Pützen, Lecksicherung), Feuer (Löscher), Verletzung (Erste Hilfe), gesehen werden (Radarreflektor, Signalmittel, Lampen), Kommunikation (Funk)."},{"id":"S115","cat":"Seemannschaft","nr":115,"bogen":8,"q":"Was gehört zur Sicherheitsausrüstung der Besatzung in der Küstenfahrt?","a":"1. Rettungsweste und Sicherheitsgurt (Lifebelt)\n2. Rettungsinsel,\n3. Rettungskragen mit Tag- und Nachtsignal\n4. Erste-Hilfe-Ausrüstung mit Anleitung.","e":"Rettungsweste hält über Wasser, Lifebelt verhindert das Überbordgehen – beides ergänzt sich. Der Rettungskragen mit Licht ist das, was man einer Person zuwirft."},{"id":"S116","cat":"Seemannschaft","nr":116,"bogen":13,"q":"Wie erhalten Sie Kenntnis über das nächste Wartungsdatum eines Rettungsfloßes?","a":"Die runde, auf der Insel klebende farbige Serviceplakette oder das bei der letzten Wartung mitgelieferte Zertifikat geben Auskunft über den nächsten Wartungstermin.","e":"Eine nicht gewartete Rettungsinsel kann im Ernstfall versagen, z. B. weil die Gasflasche leer ist. Die Plakette zeigt den nächsten Termin auf einen Blick."},{"id":"S117","cat":"Seemannschaft","nr":117,"bogen":14,"q":"Worauf müssen Sie bei Ihren Automatikrettungswesten hinsichtlich der Funktionssicherheit achten?","a":"Auf regelmäßige Wartung. Wartungsfälligkeit erkennbar an der farbigen Serviceplakette.","e":"Bei Automatikwesten kann die Salztablette oder Patrone versagen. Vor jedem Törn kurz prüfen: grüne Anzeige am Auslöser, Patrone fest, Plakette gültig."},{"id":"S118","cat":"Seemannschaft","nr":118,"bogen":15,"q":"Was ist auf Deck einer Yacht ein Strecktau (auch Laufleine genannt) und wozu dient es?","a":"Ein neben der Fußreling verlaufender Draht, Gurt oder eine starke Leine zwischen Cockpit und Vorschiff straff gespannt zum Einpicken der Sicherheitsleine (Lifebelt).","e":"Mit dem Strecktau kann man vom Cockpit bis zum Bug gehen, ohne sich auszupicken. Es wird auf der Luvseite genutzt, damit man bei einem Sturz an Deck bleibt."},{"id":"S119","cat":"Seemannschaft","nr":119,"bogen":1,"q":"Welche Seenotsignalmittel sollten Sie an Bord haben? Nennen Sie mindestens 6 Beispiele.","a":"Signallampe, Signalflaggen N und C, Signalpistole mit Munition, Rote Handraketen, Rote Handfackeln, Orange Rauchfackeln, Seenotfunkboje, Seewasserfärber.","e":"Rote Signale bedeuten Seenot, orangefarbener Rauch ist am Tag gut sichtbar. Merke: Signalmittel haben ein Verfallsdatum."},{"id":"S120","cat":"Seemannschaft","nr":120,"bogen":3,"q":"Welche Feuerlöscheinrichtungen sollten an Bord vorhanden sein?","a":"1. Feuerlöscher (ABC-Pulverlöscher und eventuell CO2 -Löscher),\n2. Pütz zum Löschen von Bränden fester Stoffe,\n3. Feuerlöschdecke,\n4. Löschdurchlass für geschlossene Motorräume, der das Löschen von Bränden mit CO 2 - Löschern ohne Sauerstoffzutritt ermöglicht.","e":"ABC-Pulver löscht feste Stoffe, Flüssigkeiten und Gase. Die Löschdecke erstickt einen Fettbrand in der Pantry am besten."},{"id":"S121","cat":"Seemannschaft","nr":121,"bogen":2,"q":"Welche Feuerlöscharten sind für Sportboote geeignet? Wie und wo sind sie an Bord unterzubringen?","a":"1. Der ABC-Pulverlöscher, für geschlossene Motorräume der CO2 -Löscher\n2. WIE? gebrauchsfertig und leicht erreichbar\n3. WO? In der Nähe der Maschinenräume, der Koch- oder Heizstelle. CO 2 -Löscher nicht im Schiffsinneren.","e":"CO₂ verdrängt Sauerstoff und kann in der Kajüte Menschen gefährden, deshalb nur für abgeschlossene Motorräume. Löscher gehören dorthin, wo es brennen kann: Motor und Kocher."},{"id":"S122","cat":"Seemannschaft","nr":122,"bogen":11,"q":"Wie wird die ständige Funktionssicherheit eines Feuerlöschers sichergestellt?","a":"1. Durch Einhaltung des vorgeschriebenen Prüftermins, ersichtlich aus der Prüfplakette.\n2. Der Feuerlöscher muss vor Feuchtigkeit und Korrosion geschützt werden.","e":"Feuerlöscher werden alle zwei Jahre geprüft. Salzluft und Feuchtigkeit können Ventile korrodieren lassen und Pulver verklumpen."},{"id":"S123","cat":"Seemannschaft","nr":123,"bogen":10,"q":"Wie wird ein Brand an Bord wirksam bekämpft?","a":"1. Alle Öffnungen schließen,\n2. Brennstoffzufuhr (Hauptschalter) unterbrechen,\n3. Feuerlöscher erst am Brandherd betätigen,\n4. Feuer von unten und von vorn bekämpfen,\n5. Löschdecke einsetzen,\n6. Flüssigkeitsbrände nicht mit Wasser bekämpfen.","e":"Feuer braucht Brennstoff, Sauerstoff und Wärme. Luken schließen nimmt Sauerstoff, Hauptschalter und Gasventil nehmen Brennstoff – gelöscht wird kurz und gezielt von unten."},{"id":"S124","cat":"Seemannschaft","nr":124,"bogen":9,"q":"Was ist vor Reisebeginn beim Seeklarmachen zu überprüfen und zu beachten? Nennen Sie mindestens 6 Beispiele.","a":"1. Seetüchtigkeit der Yacht,\n2. Zahl und Zustand der Segel,\n3. Treibstoffvorrat,\n4. Navigationsunterlagen,\n5. Sicherheitseinweisung der Besatzung,\n6. Rettungsmittel,\n7. Seenotsignale,\n8. Trinkwasser- und Proviantvorräte,\n9. Funktionsfähigkeit Motor,\n10. Funktionsfähigkeit elektronische Navigationsgeräte,\n11. Lenzeinrichtungen,\n12. Feuerlöscher,\n13. Boots- und Personalpapiere,\n14. Betriebsfähigkeit der UKW-Seefunkanlage.","e":"Denk an: Boot (Rumpf, Rigg, Segel, Motor), Vorräte (Treibstoff, Wasser, Proviant), Sicherheit (Rettungsmittel, Signale, Löscher, Pumpen), Navigation und Papiere."},{"id":"S125","cat":"Seemannschaft","nr":125,"bogen":1,"q":"Was gehört zur Sicherheitseinweisung der gesamten Besatzung vor Reisebeginn? Nennen Sie mindestens 6 Beispiele.","a":"Einweisung in Gebrauch und Bedienung\n1. Rettungswesten / Sicherheitsgurte,\n2. Rettungsinsel\n3. Signalmittel,\n4. Lenzpumpen,\n5. Seeventile und des Bord-WC,\n6. Kocheinrichtung,\n7. Feuerlöscher,\n8. Motoranlage,\n9. Elektroanlage,\n10. Rundfunkgerätes und der UKW-Seefunkanlage,\n11. Verhalten bei \"Mensch-über-Bord\",\n12. Verhalten bei Seekrankheit.","e":"Der Skipper kann selbst über Bord gehen oder ausfallen. Dann muss die Crew die Ausrüstung selbstständig bedienen können."},{"id":"S126","cat":"Seemannschaft","nr":126,"bogen":8,"q":"In welche technischen Einrichtungen/Ausrüstungen muss der Schiffsführer die Besatzung vor Reiseantritt unbedingt einweisen? Nennen Sie mindestens 6 Beispiele.","a":"1. Ankergeschirr,\n2. Lenzeinrichtung,\n3. Feuerlöscheinrichtungen,\n4. Motoranlage,\n5. Notrudereinrichtung.\n6. Seenotsignalmittel,\n7. MOB-Taste im GPS Gerät,\n8. UKW-Seefunkanlage,\n9. Seeventile,","e":"Hier geht es um die Technik: Anker, Pumpen, Löscher, Motor, Notruder, Seeventile, Funk. Das Notruder zu kennen wird oft vergessen."},{"id":"S127","cat":"Seemannschaft","nr":127,"bogen":2,"q":"Welche Sicherheitsmaßnahmen sind vor jedem Auslaufen durchzuführen? Nennen Sie mindestens 6 Beispiele.","a":"1. Kontrolle von: a. Sicherheitseinrichtung, b. Motor und Schaltung, c. nautischen Geräten, d. Bilge, e Wasser- und Kraftstoffvorrat, f. Schall- und Lichtsignal-Einrichtung, g. Navigationslichter,\n2. Wetterbericht einholen,\n3. Bereitlegen der aktuellen Seekarten und nautischen Veröffentlichungen.","e":"Vor jedem Auslaufen kurz prüfen, nicht nur vor dem Törn. Der Wetterbericht gehört immer dazu."},{"id":"S129","cat":"Seemannschaft","nr":129,"bogen":13,"q":"Warum sollte die Crew in die Funktion des Bord- WC eingewiesen werden?","a":"Weil durch unsachgemäße Bedienung Wasser ins Bootsinnere gelangen kann.","e":"Offene Seeventile oder falsches Pumpen können das Becken überlaufen lassen. Bei Krängung kann sogar Wasser über den Zulauf ins Boot laufen."},{"id":"S130","cat":"Seemannschaft","nr":130,"bogen":13,"q":"Warum sollte die Crew vor Reisebeginn in die Funktion des Ankergeschirrs und die Durchführung eines Ankermanövers eingewiesen werden?","a":"Damit jeder den Anker sicher ausbringen und einholen kann.","e":"Der Anker ist auch Notbremse, etwa bei Maschinenausfall vor einer Küste. Dann muss jeder wissen, wie er ihn schnell fallen lässt."},{"id":"S131","cat":"Seemannschaft","nr":131,"bogen":1,"q":"Wie verhalten Sie sich, wenn Ihr Schiff leckgeschlagen ist?","a":"1. Meldung abgeben.\n2. Fahrt aus dem Schiff nehmen.\n3. Lenzpumpen betätigen,\n4. Lecksuche, Leck abdichten. 4. Flaches Wasser ansteuern.\n5. Fahrzeug so trimmen, dass Leckstelle möglichst wenig unter Wasser ist.","e":"Zuerst die Crew informieren und Hilfe vorwarnen, dann Wasser raus und Leck finden. Fahrt wegnehmen verringert den Wasserdruck am Leck; mit Krängung oder Gewichtsverlagerung bringt man die Leckstelle möglichst über Wasser."},{"id":"S132","cat":"Seemannschaft","nr":132,"bogen":15,"q":"Was tun Sie, wenn Ihr Schiff leckgeschlagen ist und das Wasser im Schiff trotz aller Maßnahmen weiter steigt?","a":"1. Notzeichen geben,\n2. Funkmeldung abgeben\n3. Verlassen des Bootes vorbereiten, Rettungswesten anlegen, Rettungsinsel klarmachen.\n4. Wenn möglich ruhiges Flachwasser anlaufen und Schiff auf Grund setzen.","e":"Wenn die Pumpen nicht mehr mithalten, rechtzeitig Mayday geben – Rettung braucht Zeit. Ein kontrolliert auf Grund gesetztes Boot ist besser als ein gesunkenes."},{"id":"S134","cat":"Seemannschaft","nr":134,"bogen":4,"q":"Welche grundsätzliche Verhaltensweise sollte beachtet und welche Maßnahmen sollten ergriffen werden, wenn Ihr Schiff in Seenot kommt?","a":"1. Ruhe bewahren und überlegt handeln.\n2. Notalarm abgeben.\n3. Rettungsinsel klarmachen.\n4. Rettungsweste und Sicherheitsgurt anlegen.\n5. So lange wie möglich an Bord bleiben.\n6. Wärmende Kleidung anziehen.","e":"Panik führt zu Fehlern; ein klarer Ablauf gibt Sicherheit. Solange das Boot schwimmt, ist es das beste Rettungsmittel."},{"id":"S135","cat":"Seemannschaft","nr":135,"bogen":6,"q":"Welche Maßnahmen treffen Sie, bevor Sie von Ihrem Fahrzeug in ein Rettungsfloß übersteigen?","a":"1. Rettungsweste und Sicherheitsgurt anlegen.\n2. Wärmende Kleidung anziehen.\n3. Nach Möglichkeit reichlich warme Flüssigkeit trinken.\n4. Proviant, Wasser, Seenotsignalmittel und ggf. Seenotfunkbake, Radartransponder und UKW Handsprechfunkgeräte in das Rettungsfloß bringen.","e":"Im Floß wird es schnell kalt, und man wird seekrank. Wer vorher warm angezogen ist und getrunken hat, hält länger durch."},{"id":"S136","cat":"Seemannschaft","nr":136,"bogen":9,"q":"Warum sollte ein sinkendes Schiff im Notfall so spät wie möglich verlassen werden?","a":"1. Die Überlebensmöglichkeiten sind auf dem Schiff größer.\n2. Ein Schiff ist besser zu orten.\n3. Einstieg in die Rettungsinsel und Aufenthalt können sehr schwierig sein.","e":"Merksatz: „Step up into the liferaft“ – nur wenn das Schiff wirklich sinkt. Viele Boote wurden später noch schwimmend gefunden."},{"id":"S137","cat":"Seemannschaft","nr":137,"bogen":12,"q":"Erklären Sie die Handhabung der Hubschrauberrettungsschlinge im Einsatz!","a":"1. Bei offener Rettungsschlinge: Karabinerhaken einpicken.\n2. Mit Kopf und beiden Armen in Rettungsschlinge einsteigen.\n3. Arme nach unten gedrückt und Hände schließen.\n4. Windenseil muss frei hängen - darf nicht an Bord befestigt werden.","e":"Das Windenseil lädt sich statisch auf und darf nie am Boot festgemacht werden – sonst könnte der Hubschrauber mit dem Boot verbunden sein. Hände nach unten, damit man nicht aus der Schlinge rutscht."},{"id":"S138","cat":"Seemannschaft","nr":138,"bogen":3,"q":"Wann dürfen Notzeichen gegeben werden?","a":"1. Nach Feststellung des Notfalls auf Anordnung des Schiffsführers;\n2. Bei unmittelbarer Gefahr für Schiff oder Besatzung, die ohne fremde Hilfe nicht überwunden werden kann.","e":"Seenot bedeutet ernste Gefahr, die man allein nicht bewältigen kann. Bei weniger dringenden Fällen gibt es Dringlichkeitsmeldungen (Pan-Pan)."},{"id":"S140","cat":"Seemannschaft","nr":140,"bogen":2,"q":"Worauf ist zu achten, wenn Crew-Mitglieder seekrank sind?","a":"1. Aufenthalt im Cockpit beaufsichtigen und Crewmitglieder gegen Überbordfallen sichern,\n2. Flüssigkeitsverlust ausgleichen\n3. Crewmitglied anhalten, zur Küste oder zum Horizont zu schauen,\n4. mit Arbeiten beschäftigen.","e":"Seekrankheit macht apathisch – Betroffene sichern sich oft nicht mehr selbst. Frische Luft, Horizont und kleine Aufgaben helfen."},{"id":"S141","cat":"Seemannschaft","nr":141,"bogen":11,"q":"Wozu dient ein Reitgewicht (Gleitgewicht, Ankergewicht) beim Ankern?","a":"Es soll die Ankertrosse auf den Grund ziehen, damit der Anker nicht durch einen zu steilen Winkel aus dem Grund gebrochen wird. Es wirkt ruckdämpfend.","e":"Je flacher der Zug am Anker, desto besser gräbt er sich ein. Das Gewicht an der Leine dämpft zudem Rucke bei Seegang."},{"id":"S143","cat":"Seemannschaft","nr":143,"bogen":12,"q":"Welcher Ankergrund ist für die üblichen Leichtgewichtsanker\n1. gut geeignet?\n2. mäßig geeignet?\n3. ungeeignet?","a":"1. Sand, Schlick, weicher Ton /Lehm,\n2. harter Ton / Lehm,\n3. steinige, verkrautete und stark schlammige Böden.","e":"Leichtgewichtsanker brauchen Boden zum Eingraben. Auf Stein oder Kraut finden sie keinen Halt und rutschen."},{"id":"S144","cat":"Seemannschaft","nr":144,"bogen":9,"q":"Was müssen Sie bei der Auswahl eines Ankerplatzes beachten?","a":"1. Sollte Schutz vor Wind und Wellen bieten.\n2. Ausreichenden Platz zum Schwojen\n3. Winddrehungen einplanen.","e":"Wind und Strom drehen – das Boot schwojt um den Anker. Dabei darf es weder an Land noch an andere Boote kommen."},{"id":"S147","cat":"Seemannschaft","nr":147,"bogen":2,"q":"Sie ankern in einer Bucht. Wie können Sie bei zunehmendem Wind die Haltekraft Ihres Ankers verbessern?","a":"1. Mehr Trosse oder Kette stecken,\n2. Reitgewicht verwenden.","e":"Mehr Kettenlänge macht den Zugwinkel flacher und die Haltekraft größer. Faustregel: mindestens 3–5 × Wassertiefe bei Kette, mehr bei Leine."},{"id":"S150","cat":"Seemannschaft","nr":150,"bogen":14,"q":"Wie erkennen Sie, ob der Anker hält?","a":"1. Vibration von Kette oder Trosse prüfen,\n2. Einrucken des Ankers prüfen,\n3. durch wiederholte Peilungen und ggf. Schätzungen des Abstands zu anderen Schiffen oder zu Landmarken,\n4. Ankeralarmfunktion im GPS einschalten.","e":"Ein slippender Anker lässt die Kette rucken und vibrieren. Die Ankerpeilung zu zwei Landmarken zeigt, ob man sich bewegt."},{"id":"S152","cat":"Seemannschaft","nr":152,"bogen":15,"q":"Nennen Sie 3 Ankertypen, die vom Germanischen Lloyd als Anker mit hoher Haltekraft anerkannt sind","a":"Bruce-Anker, CQR-Anker, Danforth-Anker, D'Hone-Anker","e":"Anker mit hoher Haltekraft halten bei gleichem Gewicht deutlich mehr als z. B. ein Stockanker. Drei der vier Namen reichen in der Prüfung."},{"id":"S153","cat":"Seemannschaft","nr":153,"bogen":1,"q":"1. Welches sind die Vorteile einer Ankerkette gegenüber einer Ankerleine?\n2. Wie kombiniert man auf Yachten häufig die Systeme?","a":"1. Die Kette unterstützt das Eingraben, verkleinert den Schwojeraum, erhöht die Haltekraft des Ankers, wirkt ruckdämpfend, und kann nicht durchscheuern\n2. Zwischen Anker und Leine ein Kettenvorlauf von 3 bis 5 m.","e":"Das Kettengewicht bildet einen Durchhang (Kettenkurve), der Rucke dämpft und den Zug am Anker flach hält. Der Kettenvorlauf schützt die Leine vor dem Durchscheuern am Grund."},{"id":"S154","cat":"Seemannschaft","nr":154,"bogen":7,"q":"1. Warum soll eine Ankerleine nicht an den Anker geknotet werden?\n2. Warum muss die Ankerkette mit einem Taustropp am Schiff bzw. im Kettenkasten befestigt werden?","a":"1. Knoten reduzieren die Bruchlast einer Leine um bis zu 50 %.\n2. Damit die Kette im Notfall schnell gekappt werden kann.","e":"Statt eines Knotens verbindet man Leine und Anker mit Spleiß und Kausch oder Schäkel. Ist der Anker unlösbar festgesessen, kann man mit dem Taustropp die Kette schnell loswerfen."},{"id":"S155","cat":"Seemannschaft","nr":155,"bogen":5,"q":"Sie wollen in einer Bucht ankern, in der das (ausreichend tiefe) Wasser unterschiedliche Färbungen zeigt. Wo wählen Sie den Ankerplatz? (Begründung!)","a":"Ich ankere auf hellem Wasser. Begründung: Der Grund ist hier sandig, der Anker hält gut. Dunkler Grund weist auf Bewuchs hin, wo der Anker schlecht hält.","e":"In Sand gräbt sich der Anker gut ein. Seegras bildet eine Schicht, auf der der Anker nur „aufliegt“ und leicht slippt."},{"id":"S156","cat":"Seemannschaft","nr":156,"bogen":8,"q":"Warum darf der Anker nicht zusammen mit seiner Leine am Ankerplatz über Bord geworfen werden?","a":"Die Leine könnte mit dem Anker vertörnen und dadurch das Eingraben des Ankers verhindern. Der Anker würde dann nicht halten.","e":"Der Anker wird kontrolliert gefiert, bis er den Grund berührt. Dann steckt man beim Zurücktreiben Kette bzw. Leine nach, damit sie gestreckt am Grund liegt."},{"id":"S157","cat":"Seemannschaft","nr":157,"bogen":3,"q":"Was müssen Sie bedenken, wenn ein großes Schiff auf Ihr Sportboot zukommt?","a":"1. Andere Manövrierfähigkeit\n2. Eingeschränkte Sicht des anderen Fahrzeugs/ Möglichkeit des Übersehenwerdens,\n3. Beeinträchtigung durch Bugwellen\n4. Beeinträchtigung der Manövrierfähigkeit des eigenen Bootes durch Windabdeckung.","e":"Von der Brücke eines Frachters ist eine Yacht oft nur ein kleiner Punkt – oder gar nicht zu sehen. Als Sportboot weicht man deshalb frühzeitig und deutlich aus, auch wenn man Kurshalter wäre."},{"id":"S159","cat":"Seemannschaft","nr":159,"bogen":1,"q":"Was müssen Sie beim Passieren eines großen Schiffes bei dessen Kursänderungen, z. B. in einem kurvenreichen Fahrwasser, beachten?","a":"Bei einer Kursänderung schwenkt das Heck deutlich in die entgegengesetzte Richtung aus, also nach Backbord bei einer Kursänderung nach Steuerbord und umgekehrt.","e":"Ein großes Schiff dreht um einen Punkt im vorderen Drittel. Bei einer Kursänderung nach Steuerbord schwenkt das Heck deshalb nach Backbord – wer dort dicht passiert, gerät in Gefahr."},{"id":"S160","cat":"Seemannschaft","nr":160,"bogen":4,"q":"Mit welchen Stoppstrecken und Stoppzeiten müssen Sie bei großen Schiffen in voller Fahrt rechnen und wovon hängen sie ab?","a":"Abhängig von Schiffstyp und -größe, Beladungszustand und Ausgangsgeschwindigkeit ist mit der 8- bis 12fachen Schiffslänge und bis zu 8 bis 12 Minuten Dauer (z. B. ein 300 m langes Containerschiff voll abgeladen mit 24 kn: Stoppstrecke ca. 2 sm, Stoppzeit ca. 12 Minuten) zu rechnen.","e":"Stoppstrecke: 8–12 Schiffslängen, also bei großen Schiffen rund 2 sm. Für die Yacht heißt das: Ein Frachter kann dir praktisch nicht durch Bremsen ausweichen."},{"id":"S161","cat":"Seemannschaft","nr":161,"bogen":6,"q":"Wie reagiert ein großes Schiff, wenn bei ca. 20 kn Fahrt ein Ausweichmanöver durch Hartruderlage eingeleitet wird? Nach welcher Distanz verlässt es in etwa die alte Kurslinie?","a":"Der Steven bewegt sich in Richtung der Hartruderlage, das Heck schlägt relativ weit zur entgegengesetzten Richtung aus. Das Schiff verlässt mit seinem Heck erst nach mehreren Schiffslängen seine bisherige Kurslinie, bewegt sich also zunächst in der alten Kursrichtung fort. Diese Strecke kann bei 300 m langen Containerschiffen 1,5 bis 2,5 Schiffslängen, d. h. ca. 500 bis 600 m betragen.","e":"Das Schiff bewegt sich nach dem Ruderlegen erst noch mehrere Hundert Meter in alter Richtung weiter. Ein spätes Ausweichen des Frachters kommt deshalb oft zu spät."},{"id":"S162","cat":"Seemannschaft","nr":162,"bogen":5,"q":"Auf vielen großen Schiffen ist die Sicht nach vorne eingeschränkt. Welchen Abstand vor einem Schiff müssen Sie als nicht einsehbar mindestens berücksichtigen?","a":"Sichtbeschränkung nach voraus maximal 2 Schiffslängen oder 500 m.","e":"Hohe Container oder der Bug verdecken den Bereich direkt vor dem Schiff. Liegst du in diesem Bereich, kann dich niemand auf der Brücke sehen."},{"id":"S163","cat":"Seemannschaft","nr":163,"bogen":2,"q":"Wie können Sie die Wahrscheinlichkeit erhöhen, im Radar von anderen Fahrzeugen gesehen zu werden?","a":"Durch einen möglichst hoch und fest angebrachten passiven Radarreflektor bzw. durch einen \"aktiven\" Radarreflektor.","e":"Kleine GFK-Boote reflektieren Radarwellen kaum. Ein hoch montierter Reflektor oder ein aktiver Radartransponder macht sie sichtbar."},{"id":"W1","cat":"Wetter","nr":1,"bogen":9,"q":"Was ist Wind und wie entsteht er?","a":"Wind ist bewegte Luft. Die Bewegung entsteht durch die Druckunterschiede zwischen Hoch- und Tiefdruckgebieten.","e":"Luft strömt vom hohen zum tiefen Druck, um den Unterschied auszugleichen. Je größer der Druckunterschied auf kurzer Strecke, desto stärker der Wind."},{"id":"W2","cat":"Wetter","nr":2,"bogen":8,"q":"Was ist der Taupunkt?","a":"Die Temperatur, auf die Luft abgekühlt werden muss, damit sie mit Feuchtigkeit gesättigt ist. Es setzt Kondensation (Taubildung) ein.","e":"Warme Luft kann mehr Wasserdampf aufnehmen als kalte. Kühlt Luft bis zum Taupunkt ab, kondensiert der Überschuss – es entstehen Tau, Wolken oder Nebel."},{"id":"W4","cat":"Wetter","nr":4,"bogen":5,"q":"Nennen Sie mindestens 6 Parameter, aus denen sich eine Wetterbeobachtung an Bord zusammensetzt.","a":"Windrichtung, Windstärke, Luftdruck, Wolken, Seegang, Temperatur, Bedeckungsgrad, Strom, aktuelles Wetter und ggf. Luftfeuchte","e":"Denk an das, was du an Bord wahrnehmen oder messen kannst: Wind, Druck, Himmel, Wasser, Temperatur. Der Trend (z. B. Druckverlauf) ist oft wichtiger als der Einzelwert."},{"id":"W5","cat":"Wetter","nr":5,"bogen":11,"q":"1. In welcher Maßeinheit wird die Windstärke angegeben?\n2. In welchen Maßeinheiten wird die Windgeschwindigkeit angegeben?","a":"1. Nach der Beaufortskala (Bft).\n2. In kn, m/s und km/h.","e":"Beaufort ist eine Stärkeskala (0–12), keine Geschwindigkeit. Faustregel: Bft 4 ≈ 11–16 kn, Bft 6 ≈ 22–27 kn, Bft 8 ≈ 34–40 kn."},{"id":"W6","cat":"Wetter","nr":6,"bogen":10,"q":"1. Wie heißen die Linien gleichen Luftdrucks?\n2. In welcher Maßeinheit wird der Luftdruck angegeben?","a":"1. Isobaren.\n2. Hektopascal (hPa).","e":"Isobaren sind wie Höhenlinien auf einer Landkarte – nur für den Luftdruck. 1 hPa entspricht dem früheren Millibar."},{"id":"W7","cat":"Wetter","nr":7,"bogen":3,"q":"Welche Gefahren kann ein Gewitter mit sich bringen?","a":"1. Böen bis Orkanstärke,\n2. Plötzliche Winddrehungen,\n3. Regen- oder Hagelschauer mit z.T. starker Sichtminderung,\n4. Blitzschlag.","e":"Gewitterböen kommen oft plötzlich und aus anderer Richtung als der bisherige Wind. Dazu kann die Sicht im Starkregen fast auf null sinken."},{"id":"W8","cat":"Wetter","nr":8,"bogen":12,"q":"Wann entstehen besonders starke Gewitter?","a":"Besonders zum Ende einer hochsommerlichen Schönwetterperiode im Zusammenhang mit Kaltfronten.","e":"Nach Hitzetagen ist die Luft warm und feucht – viel Energie. Trifft eine Kaltfront darauf, wird sie gewaltsam gehoben und es entladen sich heftige Gewitter."},{"id":"W9","cat":"Wetter","nr":9,"bogen":13,"q":"Welche Skala wird verwendet für die Angabe der Windrichtung in Seewetterberichten bei\n1. den Vorhersagen und Aussichten,\n2. den Stationsmeldungen?","a":"1. Die 8-teilige mit Auflösung in 45°-Stufen.\n2. Die 16-teilige mit Auflösung in 22,5°-Stufen","e":"Vorhersagen sind unsicherer und nutzen deshalb grobe Richtungen (N, NE, E …). Stationsmeldungen sind gemessen und werden feiner angegeben (z. B. NNE)."},{"id":"W11","cat":"Wetter","nr":11,"bogen":1,"q":"1. Welche Skala wird für die Schätzung der Windstärke verwendet?\n2. Was verstehen Sie unter mäßigem Wind, was unter Starkwind?","a":"1. Die 12-teilige Beaufortskala. Mäßiger Wind: 4 Beaufort. Starkwind: 6 und 7 Beaufort.","e":"Beaufort reicht offiziell von 0 bis 12. „Mäßig“ (Bft 4) ist angenehmes Segelwetter, ab Bft 6 wird es für kleinere Yachten anspruchsvoll und reffen ist angesagt."},{"id":"W12","cat":"Wetter","nr":12,"bogen":2,"q":"Welche amtlichen Veröffentlichungen enthalten Sendezeiten und Frequenzen für Seewetterberichte\n1. für Europa,\n2. Europa und weltweit?","a":"1. \"Handbuch Nautischer Funkdienst\" und \"Jachtfunkdienst\".\n2. \"Admiralty List of Radio Signals\".","e":"Diese Handbücher sind die amtlichen Verzeichnisse aller Funkdienste. Heute nutzt man ergänzend Apps und Websites, in der Prüfung sind aber diese Titel gefragt."},{"id":"W13","cat":"Wetter","nr":13,"bogen":7,"q":"Nennen Sie 6 Möglichkeiten, um Wetterinformationen an Bord zu erhalten.","a":"Hörfunksender, Küstenfunkstellen, Online-Dienste, Wetterfax, Telefonabruf, NAVTEX, SafetyNet, Faxpolling, Verkehrszentralen, Törnberatung, Funkfernschreiben","e":"Wichtig ist, mehrere unabhängige Quellen zu haben. Auf See ohne Internet bleiben vor allem Funk, NAVTEX und Rundfunk."},{"id":"W14","cat":"Wetter","nr":14,"bogen":14,"q":"Welche Bedeutung für die Wetterentwicklung hat ein Halo um die Sonne und ein Hof um den Mond?","a":"Wolkenaufzug, meist Cirrostratus. Ggf. Niederschlag und Wetterverschlechterung.","e":"Halo entsteht durch Eiskristalle in hohen Schleierwolken (Cirrostratus). Diese laufen oft einer Warmfront voraus – Verschlechterung in 12–24 Stunden ist möglich."},{"id":"W15","cat":"Wetter","nr":15,"bogen":8,"q":"Bei welchen Wolkenformen müssen Sie mit erhöhter Böigkeit rechnen?","a":"Bei Haufenwolken, besonders beim Cumulonimbus (Schauer- und Gewitterwolke).","e":"Haufenwolken entstehen durch aufsteigende Luft (Konvektion). Die dabei entstehenden Auf- und Abwinde machen den Wind unter ihnen böig."},{"id":"W16","cat":"Wetter","nr":16,"bogen":1,"q":"1. Welche Formen von Wolken gibt es?\n2. Nennen Sie 6 der 10 Haupttypen!","a":"1. Es gibt Haufenwolken und Schichtwolken.\n2. Cirrus, Stratus, Cumulus, Cirrostratus, Cirrocumulus, Stratocumulus, Altostratus, Altocumulus, Nimbostratus, Cumulonimbus.","e":"Die Namen sind kombinierbar: Cirro- = hoch, Alto- = mittelhoch, Nimbo-/-nimbus = regnend, Cumulus = Haufen, Stratus = Schicht. Mit diesen Silben kann man sich alle zehn herleiten."},{"id":"W17","cat":"Wetter","nr":17,"bogen":2,"q":"1. Welche Höhen unterscheidet man bei Wolken?\n2. Welche Höhen haben sie etwa in den gemäßigten Breiten?","a":"Tiefe Wolken: 0 - 2 km, Mittelhohe Wolken: 2 - 7 km und Hohe Wolken: 7 -13 km.","e":"Merkhilfe: tief bis 2 km, mittel bis 7 km, hoch bis 13 km. Die Wolkenhöhe hilft abzuschätzen, wie weit eine Wetteränderung noch entfernt ist."},{"id":"W19","cat":"Wetter","nr":19,"bogen":15,"q":"Woran erkennt man bei Wolkenbildung eine kräftige Gewitterentwicklung?","a":"Am Cumulonimbus mit einen ambossförmigen Schirm","e":"Der Amboss entsteht, wenn die Wolke bis an die Tropopause wächst und dort seitlich auseinanderläuft. Ein Cb mit Amboss ist ein voll entwickeltes Gewitter."},{"id":"W20","cat":"Wetter","nr":20,"bogen":11,"q":"Welche Wolken kündigen oft schon vormittags kräftige Wärmegewitter an?","a":"Altocumulus castellanus (mittelhohe türmchenartige Haufenwolken).","e":"Türmchenförmige Altocumulus zeigen früh am Tag, dass die Luft in mittlerer Höhe instabil ist. Am Nachmittag können daraus Gewitter werden."},{"id":"W21","cat":"Wetter","nr":21,"bogen":12,"q":"Wie verhält sich der Wind in Bodennähe auf der Nordhalbkugel zwischen Hoch- und Tiefdruckgebieten?","a":"Er weht rechtsherum aus dem Hochdruckzentrum heraus und linksherum in den Tiefdruckkern hinein.","e":"Die Corioliskraft lenkt die Luft auf der Nordhalbkugel nach rechts ab. Daraus ergibt sich die Drehung: ums Hoch im Uhrzeigersinn, ums Tief dagegen."},{"id":"W22","cat":"Wetter","nr":22,"bogen":13,"q":"1. Was ist eine Front?\n2. Welche Fronten unterscheidet man im Allgemeinen?","a":"1. Front ist die vordere Grenze einer Luftmasse in Bewegungsrichtung.\n2. Warm-, Kalt- und Okklusionsfronten.","e":"Fronten sind Grenzen zwischen warmer und kalter Luft. Benannt werden sie nach der Luftmasse, die nachrückt: Kaltfront = Kaltluft kommt."},{"id":"W23","cat":"Wetter","nr":23,"bogen":2,"q":"Wie verhält sich typischerweise der Luftdruck\n1. vor,\n2. während und\n3. nach dem Durchzug einer Kaltfront?","a":"1. Gleichbleibend oder fällt nur wenig.\n2. Erreicht seinen tiefsten Wert.\n3. Steigt deutlich an.","e":"Vor der Kaltfront fällt der Druck noch leicht, beim Durchgang ist er am tiefsten, danach steigt er mit der schweren Kaltluft schnell an. Ein schneller Anstieg bedeutet oft böigen Wind."},{"id":"W24","cat":"Wetter","nr":24,"bogen":3,"q":"Was lässt sich aus der Darstellung der Isobaren in einer Wetterkarte erkennen?","a":"Windrichtung und Druckgefälle; je enger sie liegen, desto größer ist das Druckgefälle und desto stärker ist der Wind.","e":"Wie bei Höhenlinien gilt: Liegen die Isobaren dicht, ist das Gefälle steil – also viel Wind. Die Windrichtung folgt ungefähr den Isobaren."},{"id":"W25","cat":"Wetter","nr":25,"bogen":9,"q":"Warum weht der Wind nicht parallel zu den Isobaren? (Begründung)","a":"Durch die Bodenreibung ist der Wind rückgedreht (gegen den Uhrzeigersinn).","e":"In der Höhe weht der Wind parallel zu den Isobaren. In Bodennähe bremst die Reibung ihn ab, dadurch überwiegt der Druckgradient etwas und der Wind dreht zum Tief hin."},{"id":"W26","cat":"Wetter","nr":26,"bogen":7,"q":"1. Wie weht der Wind über See in Bodennähe um ein Tiefdruckgebiet?\n2. Mit wie viel Grad Änderung in der Windrichtung müssen Sie etwa rechnen?","a":"1. Der Wind ist rückgedreht und weht in das Tief hinein.\n2. 10° bis 20°.","e":"Über See ist die Reibung gering, daher nur 10–20° Ablenkung (über Land mehr). Der Wind strömt spiralförmig ins Tief hinein."},{"id":"W27","cat":"Wetter","nr":27,"bogen":14,"q":"1. Wie weht der Wind über See in Bodennähe um ein Hochdruckgebiet?\n2. Mit wie viel Grad Änderung in der Windrichtung müssen Sie etwa rechnen?","a":"1. Der Wind ist rückgedreht und weht aus dem Hoch hinaus.\n2. 10° bis 20°.","e":"Am Hoch gilt dasselbe: Reibung lenkt ab, der Wind weht spiralförmig heraus. Über See wieder nur 10–20°."},{"id":"W28","cat":"Wetter","nr":28,"bogen":4,"q":"Welche Verlagerungsgeschwindigkeiten haben Tiefdruckgebiete:\n1. schnelle,\n2. mittlere,\n3. langsame?","a":"1. Schnelle: 30–50 kn.\n2. Mittlere: 15–30 kn.\n3. Langsame: bis 15 kn.","e":"Achtung, auf der Karte steht vermutlich ein Tippfehler: Langsame Tiefs ziehen mit weniger als 15 kn, nicht mehr. Schnelle Tiefs mit 30–50 kn können in wenigen Stunden heranziehen."},{"id":"W29","cat":"Wetter","nr":29,"bogen":6,"q":"Wie entstehen Tiefdruckgebiete?","a":"Durch das Aufeinandertreffen von kalten Luftmassen aus hohen Breiten und subtropischen warmen Luftmassen.","e":"An der Grenze zwischen Polarluft und subtropischer Warmluft entstehen Wellen, die sich zu Tiefs einrollen. Deshalb ziehen in unseren Breiten so häufig Tiefs durch."},{"id":"W32","cat":"Wetter","nr":32,"bogen":10,"q":"Welche Sicht- und Wetterverhältnisse erwarten Sie typischerweise\n1. vor oder nahe der Warmfront,\n2. im Warmsektor,\n3. hinter der Kaltfront?","a":"1. Sichtverschlechterung durch Niederschlag, bedeckt, andauernder Regen.\n2. Diesig oder mäßige Sicht, Wolkenauflockerung, zeitweise Regen\n3. Sichtbesserung, meist gute Sicht. Schauer mit zum Teil kräftigen Böen.","e":"Vor der Warmfront: großflächiger Landregen. Im Warmsektor: feucht und diesig. Hinter der Kaltfront: klare Luft, aber Schauer und Böen."},{"id":"W33","cat":"Wetter","nr":33,"bogen":5,"q":"Welche Windrichtungen erwarten Sie an den Punkten 1, 2, 3, 4, 5 eines Tiefdruckgebiets auf der Nordhalbkugel?","a":"1. Nordost.\n2. Süd.\n3. Südwest.\n4. Nordwest.\n5. Umlaufender Wind.","e":"Das Tief dreht linksherum. Vorn (nördlich/vor der Warmfront) weht es aus Ost/Nordost, im Warmsektor aus Südwest, hinter der Kaltfront aus Nordwest – im Kern ist der Wind schwach und umlaufend.","qs":"w33"},{"id":"W34","cat":"Wetter","nr":34,"bogen":15,"q":"Um welche Arten von Fronten handelt es sich in der Abbildung, die mit 1, 2 und 3 bezeichnet sind?","a":"1. Okklusionsfront (Tiefausläufer).\n2. Warmfront.\n3. Kaltfront.","e":"Die Okklusion ist der Teil, in dem die Kaltfront die Warmfront bereits eingeholt hat. Sie verläuft vom Tiefkern bis zum Punkt, an dem sich Warm- und Kaltfront trennen.","qs":"w34"},{"id":"W35","cat":"Wetter","nr":35,"bogen":1,"q":"1. Was sind Luftmassengrenzen?\n2. Welche Luftmassengrenzen kennen Sie? Nennen Sie mindestens 2 Beispiele.","a":"1. Luftmassengrenzen sind Fronten. Sie trennen Luftmassen mit unterschiedlicher Temperatur und Luftfeuchtigkeit.\n2. Kaltfront, Warmfront, Okklusion.","e":"Eine Luftmassengrenze trennt Luft mit unterschiedlicher Temperatur und Feuchte. „Front“ ist nur ein anderes Wort dafür."},{"id":"W37","cat":"Wetter","nr":37,"bogen":2,"q":"Nennen Sie mindestens 3 regionale Windsysteme im Mittelmeer, die beim küstennahen Segeln im Mittelmeer besonders beachtet werden müssen.","a":"Meltemi. Mistral, Scirocco, Bora","e":"Mistral (Rhônetal) und Bora (Adria) sind kalte Fallwinde aus Nord, der Scirocco ein warmer Südwind aus Afrika. Der Meltemi weht im Sommer beständig aus Nord über die Ägäis."},{"id":"W39","cat":"Wetter","nr":39,"bogen":11,"q":"Mit welchem regionalen Windsystem muss in der Ägäis gerechnet werden?","a":"Meltemi.","e":"Der Meltemi weht im Sommer, oft tagelang mit Bft 6–7. Er ist nachmittags am stärksten."},{"id":"W40","cat":"Wetter","nr":40,"bogen":12,"q":"Wo bilden sich Tröge um ein Tiefdruckgebiet?","a":"Auf der Rückseite von Tiefdruckgebieten in hochreichender Kaltluft. Ein Trog folgt typischerweise einer Kaltfront.","e":"Ein Trog ist eine Rinne tiefen Drucks hinter der Kaltfront. Er bringt oft eine zweite Welle von Schauern und Böen."},{"id":"W42","cat":"Wetter","nr":42,"bogen":9,"q":"Wodurch und wie entsteht am Tage Seewind?","a":"Das Land erwärmt sich bei Sonneneinstrahlung tagsüber stärker als das Wasser. Über Land steigt die erwärmte Luft auf. Das dabei entstehende Bodentief wird durch Seewind (Wind von See) aufgefüllt.","e":"Land heizt sich schneller auf als Wasser. Die warme Luft steigt über Land auf, kühlere Seeluft strömt nach – der Seewind beginnt meist am späten Vormittag."},{"id":"W43","cat":"Wetter","nr":43,"bogen":1,"q":"Welche Wolkenform zeigt sich am späten Vormittag über Land am Himmel und kündigt Seewind an?","a":"Haufenwolke (Cumulus).","e":"Cumulus über Land zeigt, dass dort Luft aufsteigt (Thermik). Genau das treibt den Seewind an."},{"id":"W44","cat":"Wetter","nr":44,"bogen":13,"q":"Welche Windgeschwindigkeiten in Knoten oder Beaufort erreicht der Seewind etwa\n1. im Mittelmeer,\n2. in Nord- und Ostsee?","a":"1. Bis zu 25 kn oder Bft 6.\n2. Bis 15 kn, in Einzelfällen bis 20 kn oder Bft 4/5, in Einzelfällen Bft 5/6","e":"Im Mittelmeer ist die Temperaturdifferenz Land/See größer, deshalb ist der Seewind dort stärker. An Nord- und Ostsee bleibt er meist moderat."},{"id":"W47","cat":"Wetter","nr":47,"bogen":6,"q":"Wodurch und wie entsteht nachts Landwind?","a":"Das Land kühlt sich bei geringer Bewölkung stark ab. Das Wasser ändert seine Temperatur an der Oberfläche dagegen nur geringfügig. Über dem Wasser steigt daher erwärmte Luft auf. Das dabei entstehende Bodentief wird durch Landwind (Wind von Land) aufgefüllt.","e":"Nachts kehrt sich der Effekt um: Das Land kühlt ab, das Wasser bleibt warm. Der Landwind ist meist schwächer als der Seewind."},{"id":"W50","cat":"Wetter","nr":50,"bogen":7,"q":"Im Internet finden Sie auf einer \"Wetterseite\" eine Vorhersagekarte mit Windpfeilen. In welcher Höhe über dem Erdboden/der Wasseroberfläche gelten die vorhergesagten Windgeschwindigkeiten?","a":"Etwa 10 Meter über dem Erdboden/ der Wasseroberfläche.","e":"10 m ist die Standard-Messhöhe für Wind. Der Wind am Masttopp einer Yacht ist etwas stärker als am Wasser."},{"id":"W51","cat":"Wetter","nr":51,"bogen":14,"q":"Sie segeln mit Ihrer Yacht \"raumschots\". Nach der nächsten Tonne müssen Sie anluven. Wie wird sich die wahre Windgeschwindigkeit auf Ihrem Windmesser/Anemometer entwickeln?","a":"Sie bleibt unverändert.","e":"Der wahre Wind hängt nicht von deinem Kurs ab. Was sich ändert, ist der scheinbare Wind – beim Anluven nimmt er zu."},{"id":"W52","cat":"Wetter","nr":52,"bogen":8,"q":"Welche Windsituation ist mit der Formulierung \"Nordwest 6\" bezüglich\n1. der Schwankungsbreite in Windrichtung und\n2. der Schwankungsbreite in der Windstärke (Böen) verbunden?","a":"1. Windrichtung kann bis zu 45° um die Hauptwindrichtung betragen,\n2. Windstärke / Böen können etwa 1 - 2 Bft über dem Mittelwind liegen.","e":"Eine Windangabe ist immer ein Mittelwert. Richtung und Stärke schwanken in der Realität deutlich."},{"id":"W53","cat":"Wetter","nr":53,"bogen":15,"q":"Was ist mit dem Zusatz \"Schauerböen\" bei der Windvorhersage verbunden?","a":"Während der Passage und auf der Rückseite von Kaltfronten können in der näheren Umgebung von Schauern Böen auftreten, die den Mittelwind um 2 Bft überschreiten können.","e":"Bei Schauern können plötzlich Böen bis 2 Bft über dem Mittelwind einfallen. Deshalb früh reffen, wenn Schauer vorhergesagt sind."},{"id":"W55","cat":"Wetter","nr":55,"bogen":11,"q":"Wie ist der Aufbau von Seewetterberichten?","a":"1. Hinweise auf Starkwind oder Sturm,\n2. Wetterlage,\n3. Vorhersagen, Aussichten und\n4. Stationsmeldungen.","e":"Erst die Warnungen, dann die großräumige Lage, dann die Vorhersage für die Gebiete und zuletzt die gemessenen Werte. Wer den Aufbau kennt, findet schnell, was er braucht."},{"id":"W56","cat":"Wetter","nr":56,"bogen":3,"q":"Welche lokalen Effekte, die das vorherrschende Windfeld stark verändern, können in Seewetterberichten nur eingeschränkt berücksichtigt werden?","a":"Land-/Seewind-Zirkulation, Düsen- und Kapeffekte.","e":"Seewetterberichte decken große Gebiete ab. Lokale Effekte an Küsten, Kaps und Engstellen muss man selbst einschätzen – dort kann es deutlich mehr wehen als vorhergesagt."},{"id":"W57","cat":"Wetter","nr":57,"bogen":12,"q":"1. Wann werden Starkwindwarnungen verbreitet?\n2. Welche Bezeichnung hat die Starkwindwarnung im internationalen Sprachgebrauch?","a":"1. Bei erwarteten oder noch andauernden Windstärken zwischen 6 und 7 Bft.\n2. Near-gale warning.","e":"Starkwind heißt Bft 6–7, international „near gale“. Für viele Yachten beginnt hier das Reffen und die Überlegung, ob man überhaupt ausläuft."},{"id":"W58","cat":"Wetter","nr":58,"bogen":10,"q":"1. Wann werden Sturmwarnungen verbreitet?\n2. Welche Bezeichnung hat die Sturmwarnung im internationalen Sprachgebrauch?","a":"1. Bei zu erwartenden oder noch andauernden Windstärken von mindestens 8 Bft.\n2. Gale warning.","e":"Ab Bft 8 spricht man von Sturm („gale“), ab Bft 10 von schwerem Sturm („storm“). Bei einer Sturmwarnung gehört eine Yacht in den Hafen."},{"id":"W59","cat":"Wetter","nr":59,"bogen":4,"q":"Welche Wellenhöhe wird bei der Angabe des Seegangs in Seewetterberichten verwendet?","a":"Die kennzeichnende (charakteristische) Wellenhöhe.","e":"Die Wellenhöhe im Bericht ist ein statistischer Wert, keine Maximalhöhe. Bei der Törnplanung muss man einzelne deutlich höhere Wellen einkalkulieren."},{"id":"W60","cat":"Wetter","nr":60,"bogen":6,"q":"1. Wie ist die kennzeichnende (charakteristische) Wellenhöhe definiert?\n2. Womit müssen Sie rechnen?","a":"1. Mittlere Höhe der gut ausgeprägten Wellen.\n2. Einzelne Wellen können das 1,5 fache der kennzeichnenden Wellenhöhe erreichen.","e":"Die kennzeichnende Wellenhöhe ist etwa das, was ein Beobachter als typisch schätzt. Einzelne Wellen erreichen das 1,5-Fache, selten sogar das Doppelte."},{"id":"W61","cat":"Wetter","nr":61,"bogen":13,"q":"Was bedeutet rechtdrehender bzw. rückdrehender Wind?","a":"Rechtdrehend = Änderung der Windrichtung im Uhrzeigersinn. Rückdrehend = Änderung der Windrichtung gegen den Uhrzeigersinn um mindestens 45°.","e":"Rechtdrehend = mit dem Uhrzeigersinn (z. B. SW → W), rückdrehend = dagegen (z. B. W → SW). Wichtig für die Beurteilung, wie ein Tief vorbeizieht."},{"id":"W62","cat":"Wetter","nr":62,"bogen":3,"q":"Sie hören am Ende eines Seewetterberichts die Stationsmeldungen. Was sagen Windrichtung und Windgeschwindigkeit gegenüber den Verhältnissen auf See aus?","a":"Durch die Umgebung der Wetterstation kann die Windrichtung verfälscht werden. Die Windgeschwindigkeit ist meist reduziert, in Einzelfällen auch erhöht.","e":"Wetterstationen stehen oft an Land, auf Molen oder Leuchttürmen, und werden von Gebäuden oder Gelände beeinflusst. Zusammen gelesen zeigen sie aber gut, wie ein Wettersystem durchzieht."},{"id":"W64","cat":"Wetter","nr":64,"bogen":8,"q":"Seegebiete sind international festgelegt. In welchen amtlichen Veröffentlichungen können Sie nachlesen, wo sich das Seegebiet \"Fischer\" befindet?","a":"1.\"Handbuch Nautischer Funkdienst\", 2. \"Jachtfunkdienst für Nord- und Ostsee\" oder in der 3. \"Admiralty List of Radio Signals\".","e":"Die Seegebiete (z. B. Fischer, Deutsche Bucht) sind in den Funkdienst-Handbüchern mit Karten eingezeichnet. „Fischer“ liegt vor der Nordwestküste Dänemarks."},{"id":"W65","cat":"Wetter","nr":65,"bogen":14,"q":"Sie wollen einen Törn in einem für Sie fremden Küstenrevier fahren. Wie können Sie sich über mittlere Windverhältnisse für bestimmte Jahreszeiten oder Monate informieren?","a":"In den entsprechenden Hafen- und Revierführern. Außerdem z. B. in Monatskarten.","e":"Revierführer beschreiben die typischen Winde und ihre Jahreszeit. Monatskarten (Pilot Charts) zeigen statistisch Windrichtung und -stärke – ideal für die Törnplanung."},{"id":"W66","cat":"Wetter","nr":66,"bogen":5,"q":"1. Was für Wetter muss meistens erwartet werden, wenn der Luftdruck über einen Zeitraum von 3 Stunden um 10 hPa fällt?\n2. Was muss bei einem an Bord beobachteten starken Luftdruckfall beachtet werden?","a":"1. Schwerer Sturm.\n2. Kurs und Fahrt des Schiffes in Bezug auf das Tiefdruckgebiet.","e":"10 hPa in 3 Stunden ist ein sehr starker Druckfall – ein Alarmsignal. Dann gilt es, schnell einen sicheren Hafen oder freien Seeraum zu suchen."},{"id":"W68","cat":"Wetter","nr":68,"bogen":15,"q":"Mit welchen Windverhältnissen müssen Sie rechnen, wenn Sie im Hafen liegen und der Wind ablandig weht?","a":"Die im Hafen vorherrschenden Windgeschwindigkeiten entsprechen nicht den Verhältnissen auf der freien See.","e":"Bei ablandigem Wind liegt der Hafen im Windschatten. Draußen weht es oft 1–2 Bft stärker – man unterschätzt die Bedingungen leicht beim Auslaufen."},{"id":"W70","cat":"Wetter","nr":70,"bogen":7,"q":"Warum verstärkt sich der Wind in engen Durchfahrten?","a":"Durch den Düseneffekt (Trichtereffekt). Dabei wird die Luftströmung \"zusammengepresst\" und beschleunigt.","e":"Die gleiche Luftmenge muss durch einen engeren Querschnitt, also wird sie schneller. In Sunden und zwischen Inseln kann der Wind 1–2 Bft stärker sein als im Wetterbericht."},{"id":"W72","cat":"Wetter","nr":72,"bogen":4,"q":"Welche Windverhältnisse erwarten Sie in der Nähe von Steilküsten\n1. bei auflandigem und\n2. bei ablandigem Wind?","a":"1. Der Wind wird durch Küstenführung zum Teil beschleunigt\n2. Es muss mit umlaufenden Winden und Fallböen gerechnet werden.","e":"Auflandig wird der Wind entlang der Küste abgelenkt und beschleunigt. Ablandig bilden sich hinter der Steilküste Wirbel und kräftige Fallböen."},{"id":"W73","cat":"Wetter","nr":73,"bogen":1,"q":"Wie wird sich das Wetter wahrscheinlich entwickeln, wenn der Wind am Abend\n1. abflaut oder\n2. zunimmt?","a":"1. Abflauender Wind am Abend: Oft ein Zeichen für gutes Wetter.\n2. Zunehmender Wind am Abend: kündigt häufig Starkwind, Sturm und Regen an.","e":"Abends lässt die Thermik nach, der Wind wird normalerweise schwächer. Frischt er dagegen auf, steckt ein großräumiges Wettersystem dahinter – dann den Wetterbericht hören."},{"id":"W74","cat":"Wetter","nr":74,"bogen":2,"q":"1. Womit müssen Sie auf der Nordhalbkugel rechnen, wenn nach Durchzug einer Kaltfront der Wind rückdreht und der Luftdruck wieder fällt?\n2. Wie nennt man die Wetterlage?","a":"1. Meist deutliche Wetterverschlechterung mit erneut auffrischendem Wind bis Sturmstärke.\n2. Troglage.","e":"Normalerweise dreht der Wind nach der Kaltfront recht und der Druck steigt. Passiert das Gegenteil, folgt ein Trog mit erneuter Verschlechterung."},{"id":"W75","cat":"Wetter","nr":75,"bogen":10,"q":"Welche Windverhältnisse erwarten Sie auf der Nordhalbkugel während der unmittelbaren Passage eines markanten Troges?","a":"Der Wind dreht recht, meist über 60 bis 90°. Winde bis Orkanstärke besonders auf der Rückseite eines Troges.","e":"Beim Trogdurchgang dreht der Wind kräftig recht. Die stärksten Böen kommen oft auf der Rückseite."},{"id":"W76","cat":"Wetter","nr":76,"bogen":11,"q":"Wie entsteht Nebel?","a":"1. Zufuhr von Feuchte,\n2. Mischung von Luftmassen mit hoher Feuchtigkeit und verschiedener Temperatur,\n3. Abkühlung der Luftmasse.","e":"Nebel ist eine Wolke am Boden. Entweder wird feuchte Luft abgekühlt (über kaltem Wasser oder nachts) oder es kommt so viel Feuchte hinzu, dass der Taupunkt erreicht wird."},{"id":"W78","cat":"Wetter","nr":78,"bogen":10,"q":"1. Wie entsteht Kaltwassernebel?\n2. Zu welcher Jahreszeit tritt diese Nebelart in europäischen Gewässern bevorzugt auf?","a":"1. Warme und feuchte Luftmassen werden durch den kalten Untergrund (Meer) unter den Taupunkt abgekühlt.\n2. Frühjahr","e":"Im Frühjahr ist das Meer noch kalt, die Luft schon warm. Warme, feuchte Luft über kaltem Wasser kühlt ab und bildet Nebel – typisch für Nord- und Ostsee."},{"id":"W79","cat":"Wetter","nr":79,"bogen":3,"q":"1. Wie entsteht Warmwassernebel?\n2. Zu welcher Jahreszeit tritt diese Nebelart in europäischen Gewässern bevorzugt auf?","a":"1. Kalte Luft strömt über warmes Wasser. Durch Verdunstung an der Wasseroberfläche kommt es bei hoher Differenz zwischen der Luft- und Wassertemperatur zur Feuchtesättigung.\n2. Herbst","e":"Im Herbst ist das Wasser noch warm, die Luft schon kalt. Das Wasser „dampft“ – wie über einem heißen Bad."},{"id":"W80","cat":"Wetter","nr":80,"bogen":12,"q":"1. Wie entsteht Strahlungsnebel?\n2. Wo ist diese Nebelart anzutreffen?","a":"1. Nach Sonnenuntergang kühlt sich bei klarem Himmel die bodennahe Luftschicht über Land unter den Taupunkt ab.\n2. Besonders auf Flüssen und engen Durchfahrten, außerdem durch seewärtige Windverdriftung in Küstennähe.","e":"Strahlungsnebel entsteht in klaren, windstillen Nächten über Land. Er fließt auf Flüsse und in Buchten und löst sich meist am Vormittag auf, wenn die Sonne den Boden erwärmt."},{"id":"W81","cat":"Wetter","nr":81,"bogen":9,"q":"Wodurch kann es im Mittelmeerraum in besonderen Fällen zur Sichtreduktion kommen?","a":"Durch mit der Luftmasse transportierter Saharastaub","e":"Der Scirocco trägt Saharastaub über das Mittelmeer. Die Sicht kann auf wenige Seemeilen sinken, und alles an Deck wird mit rötlichem Staub bedeckt."},{"id":"W85","cat":"Wetter","nr":85,"bogen":13,"q":"1. Was verstehen Sie unter Dünung?\n2. Was kann einsetzende hohe Dünung andeuten?","a":"1. Seegang, der dem erzeugenden Windfeld vorausläuft, sowie abklingender (alter) Seegang.\n2. Einen eventuell aufziehenden Sturm.","e":"Dünung hat lange, gleichmäßige Wellen ohne Schaumkronen. Setzt hohe Dünung ein, obwohl kaum Wind weht, kann ein Sturmfeld unterwegs sein – dann Wetterbericht prüfen."},{"id":"W88","cat":"Wetter","nr":88,"bogen":8,"q":"Welchen Seegang müssen Sie erwarten, wenn Sie küstennah bei ablandigem Wind fahren?","a":"Der Seegang wird nicht so hoch sein wie auf der freien See, da der Fetch (Windwirklänge) nur sehr kurz ist","e":"Der Fetch ist die Strecke, über die der Wind auf das Wasser wirkt. Direkt unter Land ist sie kurz – das Wasser bleibt ruhig, obwohl es stark weht; weiter draußen baut sich die See auf."},{"id":"W89","cat":"Wetter","nr":89,"bogen":9,"q":"1. Welchen Seegang müssen Sie erwarten, wenn Sie küstennah bei auflandigem Wind fahren?\n2. Welche Gefahr besteht bezüglich der Entwicklung des Seegangs außerdem?","a":"1. Der Seegang wird ähnlich ausgeprägt sein wie auf der freien See, da genügend Fetch (Windwirklänge) vorhanden ist.\n2. Dort, wo das Wasser flacher wird, oder im Bereich von Untiefen muss mit Brechern und Grundseen gerechnet wird","e":"Auflandig kommt der volle Seegang an die Küste. Wo das Wasser flach wird, steilen sich die Wellen auf und brechen – vor Hafeneinfahrten und über Sandbänken besonders gefährlich."},{"id":"W90","cat":"Wetter","nr":90,"bogen":7,"q":"1. Was verstehen Sie unter einer Grundsee?\n2. Welche Höhen kann sie erreichen?","a":"1. Meereswellen mit besonders hohen Brechern, die durch ansteigenden Meeresboden entstehen. (z.B. Untiefen oder Küstennähe)\n2. Etwa das 2,5 fache der charakteristischen Wellenhöhe.","e":"Grundseen entstehen, weil die Welle im Flachwasser gebremst wird, ihre Energie aber erhalten bleibt. Bei 2 m kennzeichnender Wellenhöhe sind also etwa 5 m hohe Brecher möglich."},{"id":"W93","cat":"Wetter","nr":93,"bogen":4,"q":"1. Was verstehen Sie unter einer Kreuzsee?\n2. Geben Sie 3 Beispiele an, wo mit Kreuzsee zu rechnen ist.","a":"1. Windsee und Dünung laufen aus unterschiedlichen Richtungen heran.\n2. a. Kurz vor und b. bei dem Durchzug einer Kaltfront sowie c. in der Nähe des Tiefkerns. In Lee von kleinen Inseln.","e":"Laufen Wellen aus verschiedenen Richtungen, addieren sie sich zu unregelmäßigen, pyramidenförmigen Seen. Das Boot wird von allen Seiten gestoßen und ist schwer zu steuern."},{"id":"W94","cat":"Wetter","nr":94,"bogen":14,"q":"Welcher Seegang ist in Lee kleiner Inseln zu erwarten?","a":"Kreuzlaufende See, die meist kurz und kabbelig ist.","e":"Die Wellen laufen um beide Seiten der Insel herum und treffen sich dahinter wieder. Deshalb ist der Windschatten einer kleinen Insel oft unruhiger als erwartet."},{"id":"W95","cat":"Wetter","nr":95,"bogen":6,"q":"Welche Faktoren können die Länge und Höhe des Seegangs erheblich verändern?","a":"Wassertiefe sowie Meeres- und Gezeitenströmungen.","e":"Im Flachwasser werden Wellen kürzer und höher. Strom gegen die Welle staucht sie zusätzlich, mitlaufender Strom macht sie länger und flacher."},{"id":"W96","cat":"Wetter","nr":96,"bogen":5,"q":"Im Internet finden Sie auf einer \"Wetterseite\" eine Vorhersagekarte für die Dünung. Können Sie daraus ungefähr den vorherrschenden Wind über See ableiten?","a":"Nein. Dünung kann vorhanden sein, auch wenn kein Windfeld vorhanden ist.","e":"Dünung kann Hunderte Seemeilen weit laufen und noch Tage nach dem Sturm ankommen. Für den Wind am Ort braucht man die Windkarte."},{"id":"W98","cat":"Wetter","nr":98,"bogen":15,"q":"Welche Windgeschwindigkeit zeigt das Anemometer an, wenn das Fahrzeug Fahrt durchs Wasser macht?","a":"Die scheinbare Windgeschwindigkeit.","e":"Das Anemometer misst den Wind, den du an Bord spürst. Am Wind ist er stärker, vor dem Wind schwächer als der wahre Wind – für den Wetterbericht muss man umrechnen."},{"id":"W99","cat":"Wetter","nr":99,"bogen":5,"q":"1. Warum sollten Luftdrucktendenzen an Bord beobachtet und aufgezeichnet werden?\n2. In welchem zeitlichen Abstand sollte man den Luftdruck aufzeichnen?","a":"1. Eventuelle Wetterveränderungen können registriert werden. (z. B. Trog, Annäherung eines Tiefdruckgebiets)\n2. Mindestens alle 4 Stunden.","e":"Nicht der absolute Luftdruck, sondern seine Änderung ist aussagekräftig. Fällt er deutlich (mehr als 1 hPa pro Stunde), kommt ein Tief oder Trog näher."},{"id":"W101","cat":"Wetter","nr":101,"bogen":4,"q":"1. Wie bestimmen Sie an Bord die Windstärke, wenn keine Windmessanlage vorhanden ist?\n2. Wie bestimmen Sie an Bord die Windrichtung, wenn keine Windmessanlage vorhanden ist?","a":"1. Die Windstärke wird geschätzt mit Hilfe der Beaufortskala in Anlehnung an das Seegangsbild.\n2. Die Windrichtung wird anhand der Verlagerung der Wellenkämme geschätzt.","e":"Die Beaufortskala beschreibt für jede Stärke das typische Seebild (Schaumköpfe, Gischt, Wellenhöhe). Die Wellenkämme laufen etwa quer zum Wind – ihre Bewegungsrichtung zeigt die Windrichtung."}]</script>
