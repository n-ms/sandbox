://www.w3.org/2000/svg\" font-family=\"inherit\"><path d=\"M110 195 l-9 -22 l9 -40 l9 40 z\" fill=\"currentColor\" opacity=\".15\"/><line x1=\"110\" y1=\"135\" x2=\"110\" y2=\"195\" stroke=\"currentColor\" stroke-width=\"2.5\"/><path d=\"M106.49523491922214 186.71045105397403 L110 195 L113.50476508077786 186.71045105397403\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"/><text x=\"102\" y=\"133\" font-size=\"12\" fill=\"currentColor\" text-anchor=\"end\">Fw<\/text><line x1=\"170\" y1=\"150\" x2=\"110\" y2=\"195\" stroke=\"#2f6fd6\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/><path d=\"M114.52878010835406 187.22245856776215 L110 195 L118.73449820528748 192.8300826970067\" fill=\"none\" stroke=\"#2f6fd6\" stroke-width=\"2\"/><text x=\"176\" y=\"155\" font-size=\"12\" fill=\"#2f6fd6\" text-anchor=\"start\">wW<\/text><line x1=\"170\" y1=\"90\" x2=\"110\" y2=\"195\" stroke=\"#2f6fd6\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/><path d=\"M111.06977976739569 186.0638055499407 L110 195 L117.15575625968098 189.54150640267514\" fill=\"none\" stroke=\"#2f6fd6\" stroke-width=\"2\"/><text x=\"158\" y=\"85\" font-size=\"12\" fill=\"#2f6fd6\" text-anchor=\"end\">sW<\/text><line x1=\"210\" y1=\"120\" x2=\"110\" y2=\"195\" stroke=\"#d6336c\" stroke-width=\"2.5\"/><path d=\"M114.52878010835406 187.22245856776215 L110 195 L118.73449820528748 192.8300826970067\" fill=\"none\" stroke=\"#d6336c\" stroke-width=\"2.5\"/><text x=\"216\" y=\"123\" font-size=\"12\" fill=\"#d6336c\" text-anchor=\"start\">wW in der Bö<\/text><line x1=\"210\" y1=\"60\" x2=\"110\" y2=\"195\" stroke=\"#d6336c\" stroke-width=\"2.5\"/><path d=\"M112.11788872329268 186.25274058028745 L110 195 L117.75044710657772 190.4250060493875\" fill=\"none\" stroke=\"#d6336c\" stroke-width=\"2.5\"/><text x=\"216\" y=\"59\" font-size=\"12\" fill=\"#d6336c\" text-anchor=\"start\">sW in der Bö<\/text><line x1=\"110\" y1=\"135\" x2=\"210\" y2=\"60\" stroke=\"#d6336c\" opacity=\".4\" stroke-dasharray=\"3 3\"/><line x1=\"210\" y1=\"120\" x2=\"210\" y2=\"60\" stroke=\"#d6336c\" opacity=\".4\" stroke-dasharray=\"3 3\"/><text x=\"12\" y=\"20\" font-size=\"10\" fill=\"currentColor\" text-anchor=\"start\">Pfeile zeigen, woher der Wind kommt<\/text><\/svg>"}</script>
<script>
(() => {
"use strict";
const CARDS = JSON.parse(document.getElementById('cardsData').textContent);
const SK = JSON.parse(document.getElementById('sketchData').textContent);
const BYID = Object.fromEntries(CARDS.map(c => [c.id, c]));
const CATS = [
  {key:'Navigation', name:'Navigation'},
  {key:'Recht', name:'Schifffahrtsrecht'},
  {key:'Seemannschaft', name:'Seemannschaft'},
  {key:'Wetter', name:'Wetterkunde'}
];
const CATNAME = Object.fromEntries(CATS.map(c => [c.key, c.name]));
const BOGEN = [...new Set(CARDS.map(c => c.bogen))].sort((a,b)=>a-b);
const KEY = 'sks-kartei-v1';
const MASTER = 3;

/* ---------- storage ---------- */
let storageOK = true;
function defaults(){ return { v:1, cards:{}, log:{}, settings:{ perRound:20, order:'random', autoExpl:true, theme:'system', tab:'B' } }; }
function load(){
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return defaults();
    const d = JSON.parse(raw); const base = defaults();
    return { ...base, ...d, settings:{ ...base.settings, ...(d.settings||{}) }, cards:d.cards||{}, log:d.log||{} };
  } catch(e){ return defaults(); }
}
let S = load();
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); storageOK = true; }
  catch(e){ storageOK = false; }
  document.getElementById('storageWarn').hidden = storageOK;
}
try { localStorage.setItem(KEY+'-t','1'); localStorage.removeItem(KEY+'-t'); } catch(e){ storageOK = false; }

function st(id){ return S.cards[id] || {s:0,m:false,v:0,t:0,n:0,l:null,d:null}; }
function setSt(id, o){ S.cards[id] = o; }
function status(id){ const c = S.cards[id]; if (!c || (!c.v && !c.t && !c.n)) return 'new'; return c.m ? 'done' : 'work'; }
function today(){ const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

/* ---------- theme ---------- */
function applyTheme(){
  const t = S.settings.theme;
  if (t === 'system') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
}
applyTheme();

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function textHTML(t){
  return t.split('\n').map(line => {
    const m = line.match(/^(\d{1,2})\.\s+(.*)$/);
    if (m) return `<div class="li"><span>${m[1]}.</span><span>${esc(m[2])}</span></div>`;
    return `<p>${esc(line)}</p>`;
  }).join('');
}
function sketch(key, cap){
  if (!key || !SK[key]) return '';
  return `<figure class="sk">${SK[key]}<figcaption>${cap||'Skizze nachgezeichnet, die Vorlage enthält sie nicht'}</figcaption></figure>`;
}
function dots(id){
  const s = st(id);
  if (s.m) return `<span class="dots" title="Sicher gelernt">${'<i class="on"></i>'.repeat(MASTER)}</span>`;
  let h = ''; for (let i=0;i<MASTER;i++) h += `<i class="${i < s.s ? 'on':''}"></i>`;
  return `<span class="dots" title="Serie ${s.s} von ${MASTER}">${h}</span>`;
}
function counts(ids){
  let d=0,w=0,n=0; ids.forEach(id => { const x = status(id); if (x==='done') d++; else if (x==='work') w++; else n++; });
  return {d,w,n,total:ids.length};
}
function pbar(c){
  const pd = c.total ? c.d/c.total*100 : 0, pw = c.total ? c.w/c.total*100 : 0;
  return `<div class="pbar" aria-hidden="true"><i class="d" style="width:${pd}%"></i><i class="w" style="width:${pw}%"></i></div>`;
}
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(()=> t.hidden = true, 2200); }
function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const idsOf = f => CARDS.filter(f).map(c => c.id);

/* ---------- views & history ---------- */
const VIEWS = ['home','study','summary','kartei'];
function show(v, push=true){
  VIEWS.forEach(x => document.getElementById(x).hidden = x !== v);
  if (push) history.pushState({v}, '', '#'+v);
  window.scrollTo(0,0);
}
window.addEventListener('popstate', e => {
  const v = (e.state && e.state.v) || 'home';
  if (v !== 'study' && !$('#study').hidden) endSession(false);
  ['detail','admin','confirm'].forEach(d => { const el = document.getElementById(d); if (el.open) el.close(); });
  if (v === 'home') renderHome();
  if (v === 'kartei') renderKartei();
  if (v === 'study' && !session) { show('home', false); renderHome(); return; }
  show(v, false);
});
history.replaceState({v:'home'}, '', '#home');

/* ---------- home ---------- */
function renderHome(){
  const all = CARDS.map(c=>c.id), c = counts(all);
  let h = `<div class="chart-head"><b>${c.d} von ${c.total} sicher gelernt</b><span>${c.w} in Arbeit, ${c.n} neu</span></div>
    <div class="legend"><span><i style="background:var(--done)"></i>sicher</span><span><i style="background:var(--work)"></i>in Arbeit</span><span><i style="background:var(--new)"></i>neu</span><span><i style="box-shadow:inset 0 0 0 2px var(--port)"></i>zuletzt nicht gewusst</span></div>`;
  CATS.forEach(cat => {
    const ids = idsOf(x => x.cat === cat.key), cc = counts(ids);
    h += `<div class="mx-group"><div class="mx-label"><span>${cat.name}</span><span>${cc.d}/${cc.total}</span></div><div class="mx">`;
    ids.forEach(id => { const s = status(id), l = st(id).l;
      h += `<button data-card="${id}" class="${s==='done'?'d':s==='work'?'w':''}${l==='n'&&s!=='done'?' x':''}" aria-label="Karte ${id}"></button>`; });
    h += `</div></div>`;
  });
  $('#overview').innerHTML = h;

  $('#decksB').innerHTML = BOGEN.map(b => {
    const cc = counts(idsOf(x => x.bogen === b));
    const open = cc.total - cc.d;
    return `<button class="tile${open===0?' complete':''}" data-deck="b:${b}"><span class="n"><small>Bogen</small>${b}</span>${pbar(cc)}<span class="s">${open ? open+' offen' : 'alles sicher'}</span></button>`;
  }).join('');
  $('#decksC').innerHTML = CATS.map(cat => {
    const cc = counts(idsOf(x => x.cat === cat.key));
    return `<button class="row" data-deck="c:${cat.key}"><span class="t">${cat.name}</span><span class="s">${cc.d} von ${cc.total} sicher<br>${cc.total-cc.d} offen</span>${pbar(cc)}</button>`;
  }).join('');
  const weak = weakIds().length, mastered = c.d, allOpen = c.total - c.d;
  $('#more').innerHTML = `
    <button class="row" data-deck="all"><span class="t">Alle offenen Karten gemischt</span><span class="s">${allOpen}</span></button>
    <button class="row" data-deck="weak" ${weak? '' : 'disabled style="opacity:.5"'}><span class="t">Schwachstellen üben</span><span class="s">${weak ? weak+' Karten' : 'noch keine'}</span></button>
    <button class="row" data-kartei="done"><span class="t">Sicher gelernt</span><span class="s">${mastered} Karten ansehen</span></button>
    <button class="row" data-kartei="all"><span class="t">Kartei durchsuchen</span><span class="s">alle ${c.total}</span></button>`;
  const t = S.log[today()] || 0;
  const days = Object.keys(S.log).length;
  $('#today').textContent = t ? `Heute ${t} Karten bewertet. Gelernt an ${days} ${days===1?'Tag':'Tagen'}.` : (days ? `Gelernt an ${days} ${days===1?'Tag':'Tagen'}. Heute noch nichts.` : 'Wähle einen Bogen oder eine Kategorie, um zu starten.');
  setTab(S.settings.tab, false);
}
function setTab(t, persist=true){
  $('#tabB').setAttribute('aria-selected', t==='B'); $('#tabC').setAttribute('aria-selected', t==='C');
  $('#decksB').hidden = t!=='B'; $('#decksC').hidden = t!=='C';
  if (persist){ S.settings.tab = t; save(); }
}
$('#tabB').onclick = () => setTab('B'); $('#tabC').onclick = () => setTab('C');
document.addEventListener('click', e => {
  const d = e.target.closest('[data-deck]'); if (d && !d.disabled) { startDeck(d.dataset.deck); return; }
  const k = e.target.closest('[data-kartei]'); if (k) { openKartei(k.dataset.kartei); return; }
  const c = e.target.closest('[data-card]'); if (c) { openDetail(c.dataset.card); return; }
});

function weakIds(){
  return CARDS.filter(c => { const s = S.cards[c.id]; return s && !s.m && (s.n > 0 || s.l === 't'); })
    .sort((a,b) => { const sa=S.cards[a.id], sb=S.cards[b.id]; return (sb.n*2+sb.t) - (sa.n*2+sa.t); })
    .map(c => c.id);
}
function deckInfo(key){
  if (key.startsWith('b:')) { const b = +key.slice(2); return {title:'Bogen '+b, ids:idsOf(c=>c.bogen===b)}; }
  if (key.startsWith('c:')) { const k = key.slice(2); return {title:CATNAME[k], ids:idsOf(c=>c.cat===k)}; }
  if (key === 'all') return {title:'Alle offenen Karten', ids:CARDS.map(c=>c.id)};
  if (key === 'weak') return {title:'Schwachstellen', ids:weakIds(), keepOrder:true};
  if (key.startsWith('ids:')) return {title:'Wiederholung', ids:key.slice(4).split(',')};
  return {title:'', ids:[]};
}

/* ---------- session ---------- */
let session = null;
function startDeck(key){
  const info = deckInfo(key);
  let ids = info.ids.filter(id => !st(id).m);
  if (!ids.length){ toast('Hier ist alles sicher gelernt.'); return; }
  if (!info.keepOrder){
    if (S.settings.order === 'random') shuffle(ids);
    // unseen and weak cards should not always end up at the end: keep random, but put last-"nicht" cards first
    ids.sort((a,b) => (st(b).l==='n') - (st(a).l==='n'));
  }
  const per = S.settings.perRound;
  if (per && ids.length > per) ids = ids.slice(0, per);
  session = { key, title:info.title, queue:ids.slice(), total:ids.length, done:0, res:{v:0,t:0,n:0}, mastered:[], missed:new Set(), flipped:false, undo:[], showExpl:S.settings.autoExpl };
  show('study');
  renderCard(false);
}
function current(){ return session && session.queue[0]; }
function renderCard(animate=true){
  const id = current(); if (!id) { finishSession(); return; }
  const c = BYID[id], s = session;
  $('#stTitle').textContent = s.title;
  const left = s.queue.length;
  $('#stCount').textContent = `${s.done} erledigt, ${left} ${left===1?'Karte':'Karten'} in der Runde`;
  $('#stBar').style.width = (s.total ? Math.min(100, s.done / (s.done + left) * 100) : 0) + '%';
  $('#undoBtn').hidden = !s.undo.length;
  const meta = `<div class="meta"><span><span class="cat">${CATNAME[c.cat]} ${c.nr}</span>${dots(id)}</span><span>Bogen ${c.bogen}</span></div>`;
  let h;
  if (!s.flipped){
    h = meta + `<div class="q txt">${textHTML(c.q)}</div>` + sketch(c.qs) + `<div class="tap">Überlege deine Antwort, dann umdrehen.</div>`;
  } else {
    h = meta + `<div class="q small txt">${textHTML(c.q)}</div>`
      + `<div class="ans"><div class="lab">Musterantwort</div><div class="txt">${textHTML(c.a)}</div>${sketch(c.as_)}</div>`
      + (s.showExpl
          ? `<div class="expl"><div class="lab">Erklärhilfe</div><div class="txt"><p>${esc(c.e)}</p></div>${sketch(c.es,'Zur Veranschaulichung')}</div>`
          : `<button class="expl-toggle" id="showExpl">Erklärhilfe zeigen</button>`);
  }
  const el = $('#fcard');
  const paint = () => { el.innerHTML = h; const b = document.getElementById('showExpl'); if (b) b.onclick = () => { s.showExpl = true; renderCard(false); }; };
  if (animate && !matchMedia('(prefers-reduced-motion: reduce)').matches){
    el.className = 'fcard flipout';
    setTimeout(() => { paint(); el.className = 'fcard flipin'; requestAnimationFrame(()=>requestAnimationFrame(()=> el.className = 'fcard flipdone')); }, 160);
  } else { el.className = 'fcard'; paint(); }
  $('#flipArea').hidden = s.flipped; $('#rateArea').hidden = !s.flipped;
}
function flip(){
  if (!session || session.flipped) return;
  session.flipped = true; session.showExpl = S.settings.autoExpl;
  renderCard(true);
  window.scrollTo({top:0});
}
$('#flipBtn').onclick = flip;
$('#fcard').addEventListener('click', e => { if (e.target.closest('button')) return; if (session && !session.flipped) flip(); });
$('#rateArea').addEventListener('click', e => { const b = e.target.closest('[data-r]'); if (b) rate(b.dataset.r); });

function rate(r){
  const s = session, id = current(); if (!id || !s.flipped) return;
  const before = {...st(id)};
  s.undo.push({ id, before, queue:s.queue.slice(), done:s.done, res:{...s.res}, mastered:s.mastered.slice(), missed:[...s.missed], logDay:today() });
  if (s.undo.length > 20) s.undo.shift();
  const c = {...before};
  c.d = today(); c.l = r;
  s.queue.shift();
  if (r === 'v'){
    c.v++; c.s++;
    if (c.s >= MASTER){ c.m = true; s.mastered.push(id); }
    s.done++;
  } else if (r === 't'){
    c.t++; // Serie bleibt stehen
    s.missed.add(id);
    s.queue.splice(Math.min(5, s.queue.length), 0, id);
  } else {
    c.n++; c.s = 0;
    s.missed.add(id);
    s.queue.splice(Math.min(3, s.queue.length), 0, id);
  }
  s.res[r]++;
  setSt(id, c);
  S.log[today()] = (S.log[today()]||0) + 1;
  save();
  if (c.m && r==='v') toast(`${CATNAME[BYID[id].cat]} ${BYID[id].nr} ist jetzt sicher gelernt.`);
  s.flipped = false;
  renderCard(true);
}
function undo(){
  const s = session; if (!s || !s.undo.length) return;
  const u = s.undo.pop();
  setSt(u.id, u.before);
  if (!u.before.v && !u.before.t && !u.before.n && !u.before.d) delete S.cards[u.id];
  s.queue = u.queue; s.done = u.done; s.res = u.res; s.mastered = u.mastered; s.missed = new Set(u.missed);
  S.log[u.logDay] = Math.max(0, (S.log[u.logDay]||1) - 1); if (!S.log[u.logDay]) delete S.log[u.logDay];
  save();
  s.flipped = true; s.showExpl = S.settings.autoExpl;
  renderCard(false);
  toast('Letzte Bewertung zurückgenommen.');
}
$('#undoBtn').onclick = undo;
$('#quitStudy').onclick = () => { if (session && (session.res.v+session.res.t+session.res.n)) finishSession(); else { endSession(); history.back(); } };
function endSession(){ session = null; }
function finishSession(){
  const s = session; if (!s) return;
  const rated = s.res.v + s.res.t + s.res.n;
  const retry = [...s.missed].filter(id => !st(id).m);
  $('#summary').innerHTML = `<div class="sum">
      <h2>${s.queue.length ? 'Runde beendet' : 'Runde geschafft'}</h2>
      <p>${esc(s.title)}: ${rated} Bewertungen${s.mastered.length ? `, ${s.mastered.length} ${s.mastered.length===1?'Karte':'Karten'} neu sicher gelernt` : ''}.</p>
      <div class="sumgrid"><div><b style="color:var(--stbd)">${s.res.v}</b><span>voll</span></div><div><b style="color:var(--yellow)">${s.res.t}</b><span>teilweise</span></div><div><b style="color:var(--port)">${s.res.n}</b><span>nicht</span></div></div>
      ${retry.length ? `<button class="btn primary" data-deck="ids:${retry.join(',')}">${retry.length===1 ? 'Die unsichere Karte wiederholen' : `Die ${retry.length} unsicheren Karten wiederholen`}</button>` : ''}
      <button class="btn${retry.length?'':' primary'}" data-deck="${s.key.startsWith('ids:')?'all':s.key}">Nächste Runde: ${esc(s.key.startsWith('ids:')?'Alle offenen Karten':s.title)}</button>
      <button class="btn" id="toHome">Zur Übersicht</button>
    </div>`;
  session = null;
  show('summary', false); history.replaceState({v:'summary'}, '', '#summary');
  $('#toHome').onclick = () => { renderHome(); show('home'); };
}

/* keyboard */
document.addEventListener('keydown', e => {
  if ($('#study').hidden || !session || document.querySelector('dialog[open]')) return;
  if (e.target.matches('input,select,textarea')) return;
  if (!session.flipped && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); flip(); }
  else if (session.flipped){
    if (e.key === '1') rate('n'); else if (e.key === '2') rate('t'); else if (e.key === '3') rate('v');
    else if (e.key === 'e' && !session.showExpl){ session.showExpl = true; renderCard(false); }
  }
  if ((e.key === 'z' || e.key === 'Backspace') && session && session.undo.length) { e.preventDefault(); undo(); }
});

/* ---------- kartei ---------- */
const K = { filter:'all', cat:'', q:'' };
const FILTERS = [['all','Alle'],['new','Neu'],['work','In Arbeit'],['done','Sicher gelernt'],['weak','Schwierig']];
function openKartei(f){ K.filter = f || 'all'; K.q=''; $('#kSearch').value=''; renderKartei(); show('kartei'); }
function renderKartei(){
  $('#kFilters').innerHTML = FILTERS.map(([k,l]) => `<button class="chip" aria-pressed="${K.filter===k}" data-f="${k}">${l}</button>`).join('');
  $('#kCats').innerHTML = [['','Alle Kategorien'],...CATS.map(c=>[c.key,c.name])].map(([k,l]) => `<button class="chip" aria-pressed="${K.cat===k}" data-c="${k}">${l}</button>`).join('');
  const q = K.q.trim().toLowerCase();
  const weak = new Set(weakIds());
  const list = CARDS.filter(c => {
    if (K.cat && c.cat !== K.cat) return false;
    const s = status(c.id);
    if (K.filter==='weak' && !weak.has(c.id)) return false;
    if (!['all','weak'].includes(K.filter) && s !== K.filter) return false;
    if (q && !(c.q+' '+c.a+' '+c.e+' '+c.id).toLowerCase().includes(q)) return false;
    return true;
  });
  $('#kCount').textContent = list.length + ' Karten';
  const doneCount = list.filter(c => st(c.id).m).length;
  $('#kAction').innerHTML = (K.filter==='done' && doneCount) ? `<button class="btn" id="unmasterAll" style="margin:0 0 10px">Diese ${doneCount} Karten zurück in die Rotation</button>` : '';
  const ua = document.getElementById('unmasterAll');
  if (ua) ua.onclick = () => ask(`${doneCount} Karten zurück in die Rotation nehmen? Ihre Serie beginnt wieder bei null.`, 'Zurück in die Rotation', () => {
    list.forEach(c => { const s = st(c.id); if (s.m){ s.m=false; s.s=0; setSt(c.id,s); } }); save(); renderKartei(); toast('Karten sind wieder in der Rotation.');
  });
  $('#kList').innerHTML = list.length ? list.map(c => {
    const s = st(c.id), stt = status(c.id);
    const label = stt==='done' ? 'Sicher gelernt' : stt==='work' ? `Serie ${s.s}/${MASTER}, ${s.v}× voll, ${s.t}× teilweise, ${s.n}× nicht` : 'Neu';
    return `<button class="item" data-card="${c.id}"><span class="id">${c.id}</span><span class="qq">${esc(c.q.replace(/\n/g,' '))}</span><span class="st">${dots(c.id)} ${label} <span>Bogen ${c.bogen}</span></span></button>`;
  }).join('') : `<div class="empty">${K.filter==='done' ? 'Noch keine Karte sicher gelernt. Eine Karte landet hier, sobald du sie dreimal nacheinander voll gewusst hast.' : 'Keine Karten für diese Auswahl.'}</div>`;
}
$('#kFilters').addEventListener('click', e => { const b=e.target.closest('[data-f]'); if(b){ K.filter=b.dataset.f; renderKartei(); }});
$('#kCats').addEventListener('click', e => { const b=e.target.closest('[data-c]'); if(b){ K.cat=b.dataset.c; renderKartei(); }});
$('#kSearch').addEventListener('input', e => { K.q = e.target.value; renderKartei(); });
$('#closeKartei').onclick = () => history.back();

/* ---------- detail ---------- */
function openDetail(id){
  const c = BYID[id], s = st(id), stt = status(id);
  const info = stt==='new' ? 'Noch nicht gelernt.' : `${s.v}× voll, ${s.t}× teilweise, ${s.n}× nicht. ${s.m ? 'Sicher gelernt.' : `Serie ${s.s} von ${MASTER}.`}`;
  $('#detailBody').innerHTML = `
    <div class="head"><h2>${CATNAME[c.cat]} ${c.nr}</h2><button class="iconbtn" data-close aria-label="Schließen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <p class="hint">Bogen ${c.bogen}. ${info}</p>
    <div class="q txt" style="font-size:18px">${textHTML(c.q)}</div>${sketch(c.qs)}
    <div class="ans"><div class="lab">Musterantwort</div><div class="txt">${textHTML(c.a)}</div>${sketch(c.as_)}</div>
    <div class="expl"><div class="lab">Erklärhilfe</div><div class="txt"><p>${esc(c.e)}</p></div>${sketch(c.es,'Zur Veranschaulichung')}</div>
    ${s.m ? `<button class="btn primary" id="dUnmaster">Zurück in die Rotation</button>` : ''}
    ${stt!=='new' ? `<button class="btn danger" id="dReset">Fortschritt dieser Karte zurücksetzen</button>` : ''}`;
  const dlg = $('#detail'); dlg.showModal(); dlg.querySelector('.sheet').scrollTop = 0;
  const um = document.getElementById('dUnmaster'); if (um) um.onclick = () => { s.m=false; s.s=0; setSt(id,s); save(); dlg.close(); refresh(); toast('Karte ist wieder in der Rotation.'); };
  const rs = document.getElementById('dReset'); if (rs) rs.onclick = () => { delete S.cards[id]; save(); dlg.close(); refresh(); toast('Fortschritt der Karte zurückgesetzt.'); };
}
function refresh(){ if (!$('#kartei').hidden) renderKartei(); if (!$('#home').hidden) renderHome(); }
document.querySelectorAll('dialog').forEach(d => {
  d.addEventListener('click', e => { if (e.target === d || e.target.closest('[data-close]')) d.close(); });
});

/* ---------- confirm ---------- */
function ask(text, okLabel, onOk){
  $('#confirmBody').innerHTML = `<h2>Sicher?</h2><p style="margin:8px 0 14px">${esc(text)}</p>
    <button class="btn danger" id="cOk">${esc(okLabel)}</button><button class="btn" data-close>Abbrechen</button>`;
  const d = $('#confirm'); d.showModal();
  document.getElementById('cOk').onclick = () => { d.close(); onOk(); };
}

/* ---------- admin ---------- */
function renderAdmin(){
  const o = (v, cur, l) => `<option value="${v}"${String(cur)===String(v)?' selected':''}>${l}</option>`;
  const ss = S.settings;
  $('#adminBody').innerHTML = `
    <div class="head"><h2>Einstellungen</h2><button class="iconbtn" data-close aria-label="Schließen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="field"><label for="sPer">Karten pro Runde</label><select id="sPer">${o(10,ss.perRound,'10')}${o(20,ss.perRound,'20')}${o(30,ss.perRound,'30')}${o(0,ss.perRound,'alle')}</select></div>
    <div class="field"><label for="sOrd">Reihenfolge</label><select id="sOrd">${o('random',ss.order,'zufällig')}${o('number',ss.order,'nach Nummer')}</select></div>
    <div class="field"><label for="sExp">Erklärhilfe</label><select id="sExp">${o('1',ss.autoExpl?'1':'0','sofort zeigen')}${o('0',ss.autoExpl?'1':'0','erst auf Tippen')}</select></div>
    <div class="field"><label for="sTheme">Darstellung</label><select id="sTheme">${o('system',ss.theme,'wie System')}${o('light',ss.theme,'hell')}${o('dark',ss.theme,'dunkel')}</select></div>

    <h3>Sicherung</h3>
    <p class="hint">Der Lernstand liegt nur in diesem Browser. Exportiere ihn gelegentlich, um ihn auf ein anderes Gerät zu übertragen oder vor dem Löschen zu schützen.</p>
    <div class="inline"><button class="btn" id="exp" style="flex:1">Exportieren</button><button class="btn" id="impBtn" style="flex:1">Importieren</button></div>
    <input type="file" id="imp" accept="application/json,.json" hidden>

    <h3>Zurücksetzen</h3>
    <p class="hint">Einen Bogen oder eine Kategorie zurücksetzen: Serien, Zähler und „Sicher gelernt“ dieser Karten werden gelöscht.</p>
    <div class="inline"><select id="rSel" aria-label="Bereich zum Zurücksetzen">
      <optgroup label="Bögen">${BOGEN.map(b=>`<option value="b:${b}">Bogen ${b}</option>`).join('')}</optgroup>
      <optgroup label="Kategorien">${CATS.map(c=>`<option value="c:${c.key}">${c.name}</option>`).join('')}</optgroup>
    </select><button class="btn danger" id="rOne">Zurücksetzen</button></div>
    <button class="btn" id="rMastered">Alle „Sicher gelernt“ zurück in die Rotation</button>
    <button class="btn danger" id="rAll">Gesamten Lernstand löschen</button>
    <p class="hint" style="margin-top:14px">Tastatur: Leertaste umdrehen, 1 nicht, 2 teilweise, 3 voll, Z zurück.</p>`;
  $('#sPer').onchange = e => { ss.perRound = +e.target.value; save(); };
  $('#sOrd').onchange = e => { ss.order = e.target.value; save(); };
  $('#sExp').onchange = e => { ss.autoExpl = e.target.value==='1'; save(); };
  $('#sTheme').onchange = e => { ss.theme = e.target.value; save(); applyTheme(); };
  $('#exp').onclick = () => {
    const blob = new Blob([JSON.stringify(S, null, 1)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `sks-lernstand-${today()}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  };
  $('#impBtn').onclick = () => $('#imp').click();
  $('#imp').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const d = JSON.parse(await f.text());
      if (!d || typeof d.cards !== 'object') throw new Error('format');
      ask('Der aktuelle Lernstand wird durch die Datei ersetzt.', 'Importieren', () => {
        const base = defaults(); S = { ...base, ...d, settings:{...base.settings, ...(d.settings||{})}, log:d.log||{} };
        save(); applyTheme(); $('#admin').close(); renderHome(); toast('Lernstand importiert.');
      });
    } catch(err){ toast('Diese Datei ist kein Lernstand-Export.'); }
    e.target.value = '';
  };
  $('#rOne').onclick = () => {
    const k = $('#rSel').value, info = deckInfo(k);
    ask(`${info.title}: Lernstand von ${info.ids.length} Karten löschen?`, 'Zurücksetzen', () => { info.ids.forEach(id => delete S.cards[id]); save(); renderHome(); toast(`${info.title} zurückgesetzt.`); });
  };
  $('#rMastered').onclick = () => {
    const n = Object.values(S.cards).filter(c=>c.m).length;
    if (!n) { toast('Es gibt noch keine sicher gelernten Karten.'); return; }
    ask(`${n} sicher gelernte Karten zurück in die Rotation nehmen? Zähler bleiben erhalten, die Serie beginnt bei null.`, 'Zurück in die Rotation', () => {
      Object.values(S.cards).forEach(c => { if (c.m){ c.m=false; c.s=0; } }); save(); renderHome(); toast('Alle Karten sind wieder in der Rotation.');
    });
  };
  $('#rAll').onclick = () => ask('Gesamten Lernstand aller 417 Karten und die Lernstatistik löschen? Einstellungen bleiben erhalten.', 'Alles löschen', () => {
    S.cards = {}; S.log = {}; save(); renderHome(); $('#admin').close(); toast('Lernstand gelöscht.');
  });
}
$('#openAdmin').onclick = () => { renderAdmin(); $('#admin').showModal(); };

/* ---------- boot ---------- */
save();
renderHome();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
})();
</script>
</body>
</html>
