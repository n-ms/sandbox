{"id":"R25","cat":"Recht","nr":25,"bogen":1,"q":"Was bestimmen die KVR für das Verhalten von Fahrzeugen von weniger als 20 m Länge oder von Segelfahrzeugen im Fahrwasser einer Seeschifffahrtsstraße?","a":"Fahrzeuge < 20 m Länge oder Segelfahrzeuge dürfen nicht die Durchfahrt eines Fahrzeuges behindern, das nur innerhalb eines engen Fahrwassers sicher fahren kann. Sie müssen frühzeitig Maßnahmen ergreifen um genügend Raum für die sichere Durchfahrt des anderen Fahrzeugs zu lassen.","e":"Große Schiffe können im engen Fahrwasser nicht ausweichen. Kleine Fahrzeuge und Segler dürfen sie deshalb nicht behindern – auch wenn sie nach anderen Regeln „Vorrang“ hätten."},{"id":"R26","cat":"Recht","nr":26,"bogen":8,"q":"Was ist eine \"Küstenverkehrszone\"?","a":"Die Zone zwischen Küste und Verkehrstrennungsgebietes. (landwärtige Grenze)","e":"Die Küstenverkehrszone ist der Bereich zwischen Küste und dem landseitigen Rand eines VTG. Durchgangsverkehr soll das VTG nutzen."},{"id":"R27","cat":"Recht","nr":27,"bogen":6,"q":"Welche Fahrzeuge dürfen die Küstenverkehrszone benutzen, ohne einen Hafen innerhalb der Küstenverkehrszone anzusteuern?","a":"Fahrzeuge < 20 m Länge und Segelfahrzeuge.","e":"Große Schiffe sollen das VTG nutzen und die Küstenverkehrszone freihalten. Kleine Fahrzeuge und Segler sind ausgenommen, damit sie sich nicht zwischen die Berufsschifffahrt begeben müssen."},{"id":"R28","cat":"Recht","nr":28,"bogen":5,"q":"Wie müssen Maschinenfahrzeuge ohne Radar bei verminderter Sicht ihre Fahrweise einrichten?","a":"Mit sicherer Geschwindigkeit fahren, die den Bedingungen der verminderten Sicht angepasst ist.","e":"Maßstab ist: Anhalten innerhalb der Strecke, die man überblicken kann. Zusätzlich muss die Maschine für sofortiges Manövrieren bereit sein, und Nebelsignale sind Pflicht."},{"id":"R29","cat":"Recht","nr":29,"bogen":10,"q":"Wie müssen sich Segelfahrzeuge ohne Radar bei verminderter Sicht verhalten? Was gehört dabei zu den Regeln guter Seemannschaft?","a":"1. Mit sicherer Geschwindigkeit fahren, die den Bedingungen der verminderten Sicht angepasst ist.\n2. Das Bereithalten der Maschine (sofern vorhanden) gehört zu den Regeln guter Seemannschaft.","e":"Auch Segler müssen bei Nebel langsam fahren. Die Maschine sollte laufen oder startbereit sein, um schnell manövrieren zu können."},{"id":"R30","cat":"Recht","nr":30,"bogen":2,"q":"Wie müssen sich Fahrzeuge ohne Radar bei verminderter Sicht verhalten, wenn sie voraus das Schallsignal eines anderen Fahrzeuges hören?","a":"Sie müssen die Fahrt auf das für die Erhaltung der Steuerfähigkeit geringstmögliche Maß verringern. Ggf. müssen sie jegliche Fahrt wegnehmen und mit äußerster Vorsicht manövrieren, bis die Gefahr eines Zusammenstoßes vorüber ist.","e":"Du hörst den anderen, weißt aber nicht genau, wo er ist oder wohin er fährt. Deshalb Fahrt so weit wie möglich raus, bis die Lage geklärt ist – ein Nebelsignal voraus ist ein klares Stoppsignal."},{"id":"R31","cat":"Recht","nr":31,"bogen":7,"q":"Sie segeln in der Nordsee bei guter Sicht. Ihnen kommt in stehender Peilung ein Maschinenfahrzeug entgegen, das keine Anstalten macht, seiner Ausweichpflicht nachzukommen. Geben Sie in einer sinnvollen Reihenfolge an, was von Ihnen zu unternehmen ist. Welche dieser Maßnahmen sind zwingend vorgeschrieben?","a":"1. Über Funk versuchen, das andere Fahrzeug auf seine Ausweichpflicht aufmerksam zu machen.\n2. Schallsignal: fünf kurze, rasch aufeinander folgende Pfeifentöne geben.\n3. Manöver des \"vorletzten Augenblicks\" fahren.\n4. Manöver des \"letzten Augenblicks\" fahren. Zwingend vorgeschrieben sind 2. und 4.","e":"Das Signal „fünf kurze Töne“ zeigt Zweifel am Verhalten des anderen an und ist Pflicht. Ebenso das Manöver des letzten Augenblicks, wenn der Zusammenstoß anders nicht mehr zu vermeiden ist."},{"id":"R32","cat":"Recht","nr":32,"bogen":9,"q":"Auf einem Segelfahrzeug unter Motor sieht man nachts fast recht voraus ein näher kommendes Fahrzeug mit folgender Lichterführung: oben ein weißes Licht, seitlich darunter ein grünes Licht, zeitweise rechts von dem grünen Licht auf gleicher Höhe auch ein rotes Licht. Um was für ein Fahrzeug handelt es sich, was ist von Ihnen und was ist auf dem anderen Fahrzeug zu unternehmen?","a":"Es handelt sich um ein Maschinenfahrzeug von weniger als 50 m Länge, das im Seegang oder durch schlechtes Steuern giert. Man muss annehmen, dass sich zwei Maschinenfahrzeuge auf entgegengesetzten Kursen nähern und die Gefahr eines Zusammenstoßes besteht. Beide Fahrzeuge müssen den Kurs nach Steuerbord ändern und dieses durch einen kurzen Ton anzeigen.","e":"Das wechselnde Rot-Grün zeigt, dass das Fahrzeug direkt auf dich zuhält und dabei giert. Zwei Maschinenfahrzeuge auf Gegenkurs weichen beide nach Steuerbord aus."},{"id":"R33","cat":"Recht","nr":33,"bogen":11,"q":"Wie muss man sich verhalten, wenn man gezwungen ist, ein Verkehrstrennungsgebiet zu queren?","a":"Kielrichtung (rwK) muss möglichst rechtwinklig zur allgemeinen Verkehrsrichtung zeigen.","e":"Rechtwinklig queren minimiert die Zeit im VTG und macht deine Absicht für andere eindeutig. Entscheidend ist die Kielrichtung, nicht der Kurs über Grund."},{"id":"R35","cat":"Recht","nr":35,"bogen":12,"q":"Wie ist die Gefahr eines Zusammenstoßes sicher erkennbar?","a":"Wenn die Kompasspeilung zu einem anderen Fahrzeug steht und sie sich einander nähern.","e":"Steht die Peilung und der Abstand nimmt ab, seid ihr auf Kollisionskurs. Bei großen Schiffen kann auch eine sich leicht ändernde Peilung noch gefährlich sein."},{"id":"R36","cat":"Recht","nr":36,"bogen":13,"q":"Wie müssen Sie Ausweichmanöver durchführen?","a":"1. Möglichst frühzeitig,\n2. Durchgreifend, sodass das andere Fahrzeug rasch Ihre Absicht erkennen kann, und um sich gut klar zu halten.","e":"Kleine Kursänderungen sind auf Radar und nachts kaum zu erkennen. Eine deutliche Änderung (30° oder mehr) oder ein klares Aufstoppen zeigt sofort, was du vorhast."},{"id":"R37","cat":"Recht","nr":37,"bogen":14,"q":"Wie müssen Sie sich verhalten, nachdem Sie ein vorgeschriebenes Ausweichmanöver eingeleitet haben?","a":"Der Erfolg des Manövers ist laufend zu überprüfen, bis das andere Fahrzeug klar passiert ist.","e":"Ausweichen ist erst erledigt, wenn die Peilung deutlich auswandert und der andere klar passiert ist. Bis dahin kann sich die Lage ändern, etwa wenn der andere ebenfalls reagiert."},{"id":"R38","cat":"Recht","nr":38,"bogen":1,"q":"Sie segeln mit Wind von Steuerbord und sehen nachts in Luv ein einzelnes rotes Licht, das in stehender Peilung näher kommt.\n1. Was ist das für ein Licht?\n2. Wer muss ausweichen? (Begründung!)","a":"1. Backbordlicht eines Segelfahrzeugs in Fahrt.\n2. Das Segelfahrzeug in Luv muss ausweichen, entweder weil es den Wind von Backbord hat oder weil es - wenn mit Wind von Steuerbord segelnd - luvwärts steht.","e":"Ein rotes Licht allein ist ein Seitenlicht, ohne Topplicht also ein Segler. Wer luvwärts steht oder Wind von Backbord hat, muss in jedem Fall ausweichen."},{"id":"R39","cat":"Recht","nr":39,"bogen":15,"q":"Sie segeln mit Wind von Backbord und sehen nachts in Luv ein einzelnes grünes Licht, das in stehender Peilung näher kommt.\n1. Was ist das für ein Licht?\n2. Wer muss ausweichen? (Begründung!)","a":"1. Steuerbordlicht eines Segelfahrzeugs in Fahrt.\n2. Ihr Fahrzeug muss als leewärtiges Fahrzeug ausweichen, weil Sie (mit Wind von Backbord segelnd) nicht erkennen können, von welcher Seite das andere Fahrzeug den Wind hat.","e":"Hier bist du selbst mit Wind von Backbord unterwegs. Du kannst nicht erkennen, wie der andere segelt – dann gilt: Backbordbug weicht aus."},{"id":"R40","cat":"Recht","nr":40,"bogen":7,"q":"Sie segeln nachts mit raumem Wind und machen gute Fahrt. Sie sehen an Steuerbord voraus ein einzelnes weißes Licht in (nahezu) stehender Peilung. Näher kommend verschwindet das weiße Licht gelegentlich und es erscheint stattdessen in etwa gleicher Höhe und links davon ein rotes Licht. Jeweils kurzfristig sind beide Lichter gleichzeitig zu sehen.\n1. Worum handelt es sich bei diesen Lichtern?\n2. Wer muss ausweichen? (Begründung!)","a":"1. Man sieht Hecklicht und/oder Backbord- Seitenlicht eines Segelfahrzeugs in Fahrt, das im Seegang giert.\n2. Ihr Fahrzeug nähert sich aus dem Hecksektor des anderen Fahrzeugs und muss als überholendes Fahrzeug ausweichen. Im Zweifel muss man sich als Überholer betrachten.","e":"Das gelegentlich sichtbare Hecklicht zeigt, dass du dich von hinten näherst. Wer im Zweifel ist, ob er überholt, muss sich als Überholer betrachten."},{"id":"R41","cat":"Recht","nr":41,"bogen":2,"q":"Sie segeln nachts mit raumem Wind und sehen nahezu achteraus ein Fahrzeug mit der Lichterführung rot-weiß-rot senkrecht übereinander, das näher kommt. Zusätzlich sehen Sie neben zwei weißen Topplichtern links ein grünes und rechts ein rotes Licht auf gleicher Höhe.\n1. Was bedeuten diese Lichter?\n2. Wer muss ausweichen? (Begründung!)","a":"1. Man sieht ein manövrierbehindertes Fahrzeug mit FdW (Topplichter, Seitenlichter).\n2. Dieses Fahrzeug nähert sich im Hecklichtsektor und muss deshalb als Überholer ausweichen.","e":"Auch ein manövrierbehindertes Fahrzeug muss als Überholer ausweichen. Die Überholregel geht allen anderen Rangfolgen vor."},{"id":"R42","cat":"Recht","nr":42,"bogen":11,"q":"Welcher Zeitpunkt ist im freien Seeraum entscheidend für die Verantwortlichkeit (hier = Ausweichpflicht!) der Fahrzeuge untereinander?","a":"Der Augenblick des ersten Insichtkommens. Eine spätere Änderung der Lage der Fahrzeuge zueinander verändert nicht die Verantwortlichkeit.","e":"Die Ausweichpflicht wird festgelegt, wenn die Fahrzeuge sich zuerst sehen. Spätere Kursänderungen machen aus einem Überholer z. B. keinen Kreuzer."},{"id":"R43","cat":"Recht","nr":43,"bogen":5,"q":"Ein anderes Fahrzeug muss Ihnen ausweichen. Welche Verpflichtung nach KVR haben Sie? Was unternehmen Sie, wenn das andere Fahrzeug nicht ausweicht?","a":"1. Mein Fahrzeug ist \"Kurshalter\", d. h. muss Kurs und Geschwindigkeit beibehalten.\n2. Mein Fahrzeug darf zur Abwendung eines Zusammenstoßes manövrieren, sobald erkennbar wird, dass das andere Fahrzeug nicht angemessen (= regelgerecht) manövriert (\"Manöver des vorletzten Augenblicks!\")\n3. Mein Fahrzeug muss zweckdienlich manövrieren, wenn ein Manöver des Ausweichpflichtigen allein einen Zusammenstoß nicht mehr vermeiden kann (\"Manöver des letzten Augenblicks!\")","e":"Als Kurshalter musst du zunächst Kurs und Fahrt halten, damit der andere berechnen kann. Erst wenn er offensichtlich nicht handelt, darfst du (vorletzter Augenblick) bzw. musst du (letzter Augenblick) manövrieren."},{"id":"R44","cat":"Recht","nr":44,"bogen":6,"q":"Welchen Fahrzeugen muss ein Segelfahrzeug ausweichen?","a":"1. Einem manövrierunfähigen Fahrzeug,\n2. einem manövrierbehinderten Fahrzeug,\n3. einem fischenden Fahrzeug,\n4. ggf. einem anderen Segelfahrzeug, abhängig von der Segelstellung in Bezug auf den Wind.","e":"Merkhilfe für die Rangfolge (Regel 18): manövrierunfähig, manövrierbehindert, tiefgangbehindert, fischend, Segler, Maschine. Ein Segler weicht allen über ihm aus."},{"id":"R45","cat":"Recht","nr":45,"bogen":12,"q":"1. Wie muss sich ein Sportfahrzeug gegenüber einem tiefgangbehinderten Fahrzeug verhalten?\n2. Schlagen Sie entsprechende Maßnahmen/ Manöver vor.","a":"1. Die sichere Durchfahrt eines tiefgangbehinderten Fahrzeugs nicht behindern.\n2. Durch frühzeitige Kursänderung, Geschwindigkeitsänderung oder beides","e":"Tiefgangbehinderte Schiffe sind auf das tiefe Wasser angewiesen. Man muss ihnen so früh Platz machen, dass gar keine Kollisionsgefahr entsteht."},{"id":"R46","cat":"Recht","nr":46,"bogen":9,"q":"Wo unterliegt Ihr Segelfahrzeug bzw. Ihre Motoryacht unter 20 m Länge einem Behinderungsverbot?","a":"1. In engen Fahrwassern,\n2. Auf dem Einbahnweg eines VTG gegenüber Maschinenfahrzeugen","e":"Das Behinderungsverbot gilt dort, wo große Schiffe kaum Platz haben. Dort gelten die normalen Ausweichregeln für kleine Fahrzeuge nicht."},{"id":"R48","cat":"Recht","nr":48,"bogen":8,"q":"Auf einer Motoryacht A sieht man nachts etwa recht voraus Topplicht und beide Seitenlichter eines Fahrzeugs B. Die Lichter werden rasch heller.\n1. Was ist B?\n2. Wie ist die Situation zu klären?","a":"1. B ist ein Maschinenfahrzeug < 50 m Länge in Fahrt.\n2. A und B müssen ihren Kurs nach Steuerbord ändern und das Signal \"ein kurzer Ton\" geben.","e":"Ein Topplicht und beide Seitenlichter heißt: Fahrzeug kommt genau auf dich zu. Beide ändern Kurs nach Steuerbord und geben einen kurzen Ton."},{"id":"R49","cat":"Recht","nr":49,"bogen":13,"q":"Auf einer Motoryacht A erkennt man nachts etwa 2 Strich an Backbord folgende Lichter des Fahrzeugs B, die rasch näher kommen. Die Kompasspeilung zum Fahrzeug B ändert sich dabei nur geringfügig.\n1. Worum handelt es sich bei Fahrzeug B?\n2. Wer muss ausweichen?\n3. Was muss Fahrzeug A tun?","a":"1. B ist ein Maschinenfahrzeug < 50 m Länge in Fahrt, dessen Steuerbord-Seite man sieht.\n2. B muss ausweichen, weil es A an seiner Steuerbord-Seite hat.\n3. A muss Kurs und Geschwindigkeit beibehalten.","e":"Du siehst die Steuerbordseite (grün) von B. Wer den anderen an Steuerbord hat, muss ausweichen – das ist hier B.","qs":"r49"},{"id":"R50","cat":"Recht","nr":50,"bogen":14,"q":"Welchen Fahrzeugen muss eine Motoryacht ausweichen?","a":"1. manövrierunfähigen Fahrzeugen,\n2. manövrierbehinderten Fahrzeugen,\n3. fischenden Fahrzeugen,\n4. Segelfahrzeugen,\n5. ggf. einem anderen Maschinenfahrzeug.","e":"Die Motoryacht steht in der Rangfolge ganz unten. Sie weicht allen aus, bei anderen Maschinenfahrzeugen gilt rechts vor links."},{"id":"R51","cat":"Recht","nr":51,"bogen":15,"q":"Auf einer Motoryacht A sieht man nachts etwa querab an Steuerbord ein einzelnes weißes Licht in (nahezu) stehender Kompasspeilung. Näher kommend erkennt man unterhalb des weißen Lichtes und etwas rechts davon ein rotes Licht (Fahrzeug B).\n1. Worum handelt es sich?\n2. Was müssen jeweils beide Fahrzeuge tun? (Begründung!)","a":"1. Topplicht und später Backbord-Seitenlicht eines Maschinenfahrzeuges B von weniger als 50 m Länge in Fahrt.\n2. A muss ausweichen, weil es B an seiner Steuerbord-Seite hat. A muss das Signal \"ein kurzer Ton\" geben.\n3. B muss Kurs und Geschwindigkeit beibehalten.","e":"Das rote Licht zeigt die Backbordseite von B. B ist an deiner Steuerbordseite, also musst du ausweichen – mit einem kurzen Ton für die Kursänderung nach Steuerbord."},{"id":"R52","cat":"Recht","nr":52,"bogen":3,"q":"Eine Motoryacht, Länge 8 m, treibt nachts manövrierunfähig in der Nordsee und sieht ein großes Fahrzeug direkt auf sich zukommen. Welche Maßnahmen hat die Motoryacht zu ergreifen?","a":"1. Durch jedes verfügbare Mittel Manövrierunfähigkeit anzeigen - UKW Funk, Schall- / Lichtsignal lang-kurz-kurz.\n2. Fahrzeug mit starker Handlampe anleuchten\n3. Weißes Rundumlichtes setzen (nicht verwechselbar)\n4. \"Weißer Stern\" Signal oder \"Blitz-Knall\" abfeuern\n5. Bei Eintritt der Manövrierunfähigkeit sofort Verkehrszentrale informieren","e":"Das Wichtigste ist, vom anderen Schiff bemerkt zu werden. Funk, Signale und Anleuchten sind dafür die Mittel."},{"id":"R54","cat":"Recht","nr":54,"bogen":1,"q":"Erläutern Sie den Begriff \"durchgehende Schifffahrt\" auf einem Fahrwasser einer Seeschifffahrtsstraße.","a":"Alle Fahrzeuge, die deutlich (± 10°) dem Fahrwasserverlauf einer Seeschifffahrtsstraße folgen.","e":"„Deutlich folgen“ heißt: nicht mehr als etwa 10° vom Fahrwasserverlauf abweichen. Wer so fährt, gehört zur durchgehenden Schifffahrt und hat Vorfahrt vor Einlaufenden und Querenden."},{"id":"R55","cat":"Recht","nr":55,"bogen":11,"q":"Was fordern die Grundregeln für das Verhalten im Verkehr?","a":"Jeder Verkehrsteilnehmer\n1. muss die Sicherheit und Leichtigkeit des Verkehrs gewährleisten,\n2. darf andere nicht schädigen, gefährden oder mehr als unvermeidbar behindern oder belästigen.","e":"Diese Grundregel (§ 3 SeeSchStrO) gilt immer, auch wenn keine spezielle Vorschrift passt. Sie ist auch der Maßstab, an dem nach einem Unfall das Verhalten gemessen wird."},{"id":"R56","cat":"Recht","nr":56,"bogen":12,"q":"Welche verkehrsrechtliche Verantwortung hat der Schiffsführer?","a":"1. Befolgung der Vorschriften im Verkehr, u. a. KVR, SeeSchStrO.\n2. Ausrüstung des Fahrzeugs zum Führen und Zeigen von Lichtern und Signalkörpern und Geben von Schallsignalen.","e":"Der Schiffsführer haftet für die Regelbefolgung und dafür, dass die vorgeschriebenen Lichter, Signalkörper und Schallsignalmittel an Bord sind und funktionieren. Fehlt z. B. der Kegel für Motorsegeln, ist das sein Versäumnis."},{"id":"R57","cat":"Recht","nr":57,"bogen":2,"q":"Was sind Seeschifffahrtsstraßen im Sinne der SeeSchStrO?","a":"Wasserflächen\n1. zwischen der Küstenlinie bei mittlerem Hochwasser oder der seewärtigen Begrenzung der Binnenwasserstraßen und einer Linie von drei Seemeilen seewärts der Basislinie,\n2. der seewärtigen Teile der Fahrwasser im Küstenmeer, die durchgehend durch laterale Zeichen (Tonnen) begrenzt sind\n3. zwischen den Ufern bestimmter Binnenwasserstraßen.","e":"Seeschifffahrtsstraßen umfassen die küstennahen Gewässer bis 3 sm vor der Basislinie, betonnte Fahrwasser im Küstenmeer und bestimmte Flüsse. Dort gilt die SeeSchStrO."},{"id":"R58","cat":"Recht","nr":58,"bogen":9,"q":"Was sind Fahrwasser im Sinne der SeeSchStrO?","a":"1. Wasserflächen, die durch Tonnen (laterale Zeichen) begrenzt sind\n2. Wasserflächen auf den Binnenwasserstraßen für die durchgehende Schifffahrt","e":"Fahrwasser sind die von lateralen Tonnen (rot/grün) begrenzten Bereiche. In ihnen gelten Rechtsfahrgebot und Vorfahrt der durchgehenden Schifffahrt nach SeeSchStrO."},{"id":"R59","cat":"Recht","nr":59,"bogen":13,"q":"Welche verkehrsrechtlichen Bestimmungen gelten auf deutschen Seeschifffahrtsstraßen?","a":"1. KVR,\n2. Seeschifffahrtsstraßen-Ordnung, ggf. die Bekanntmachungen der Wasser- und Schifffahrtsdirektionen (WSD) Nord und Nordwest,\n3. ggf. Hafenordnungen.","e":"Die KVR sind die internationale Basis, die SeeSchStrO ergänzt sie für deutsche Seeschifffahrtsstraßen. Dazu kommen örtliche Bekanntmachungen und Hafenordnungen."},{"id":"R60","cat":"Recht","nr":60,"bogen":10,"q":"Wo und unter welcher Bedingung gelten im Geltungsbereich der SeeSchStrO die KVR?","a":"Im gesamten Geltungsbereich der SeeSchStrO innerhalb und außerhalb der Fahrwasser, soweit die SeeSchStrO nicht ausdrücklich etwas anderes bestimmt (z. B. Vorfahrt, Grundsatz des Vorranges der spezielleren Rechtsvorschrift vor der allgemeineren).","e":"Die KVR gelten auch im Bereich der SeeSchStrO. Nur wo die SeeSchStrO etwas Spezielles regelt (z. B. Vorfahrt im Fahrwasser), geht sie vor."},{"id":"R61","cat":"Recht","nr":61,"bogen":14,"q":"Wie haben Segelfahrzeuge in einem Fahrwasser der SeeSchStrO untereinander auszuweichen, wenn sie nicht deutlich der Richtung eines Fahrwassers folgen?","a":"Nach den Regeln der KVR, ohne dabei vorfahrtberechtigte Fahrzeuge zu gefährden oder zu behindern.","e":"Segler, die kreuzen oder queren, weichen untereinander nach KVR aus. Das Fahrwasser-Vorfahrtsrecht der durchgehenden Schifffahrt dürfen sie dabei aber nicht verletzen."},{"id":"R62","cat":"Recht","nr":62,"bogen":3,"q":"Auf der Elbe hören Sie nachts vor sich von einem Fahrzeug, das zusätzlich zu seinen Fahrtlichtern ein rotes Rundumlicht führt, fortwährend das Schallsignal kurz-lang. Um welches Schallsignal handelt es sich, wann ist es zu geben und wie verhalten Sie sich?","a":"Bleib-weg-Signal: gibt ein Fahrzeug, das gefährliche Güter befördert oder auf dem radioaktive Stoffe frei werden oder es besteht Explosionsgefahr.\nVerhalten: möglichst weit von dem anderen Fahrzeug zu entfernen (sicherer Abstand), keine elektrischen Schalter betätigen. Kein offenes Feuer.","e":"Das „Bleib-weg-Signal“ warnt vor Gefahrgut, Explosionsgefahr oder Strahlung. Abstand halten und alles vermeiden, was Funken erzeugt."},{"id":"R63","cat":"Recht","nr":63,"bogen":15,"q":"Wann ist von einem Fahrzeug auf einer Seeschifffahrtsstraße das \"allgemeine Gefahr- und Warnsignal\" zu geben und wie lautet es?","a":"Gefährdet ein Fahrzeug ein anderes Fahrzeug oder wird es durch dieses selbst gefährdet, hat es rechtzeitig das Schallsignal: langer Ton, vier kurze Töne; langer Ton, vier kurze Töne zu geben.","e":"Das Gefahrsignal ist ein Warnruf bei drohender Kollision. Es ist so auffällig, dass es nicht mit anderen Signalen verwechselt werden kann."},{"id":"R64","cat":"Recht","nr":64,"bogen":7,"q":"Nennen Sie die speziellen Verhaltensregeln für Sportfahrzeuge im Nord-Ostsee-Kanal (NOK).","a":"1. Sportfahrzeuge dürfen in der Regel die Zufahrten und den NOK lediglich zur Durchfahrt und ohne Lotsen nur während der Tagfahrzeiten und nicht bei verminderter Sicht benutzen.\n2. Sportfahrzeuge müssen ihre Kanalfahrt so einrichten, dass sie vor Ablauf der Tagfahrzeit eine für Sportfahrzeuge bestimmte Liegestelle erreichen können.\n3. Bei plötzlich auftretender verminderter Sicht dürfen Sportfahrzeuge in den Weichengebieten hinter den Dalben oder an geeigneten Liegestellen festmachen.","e":"Der NOK ist für Berufsschifffahrt gebaut. Sportboote dürfen nur bei Tag und guter Sicht durchfahren und müssen rechtzeitig eine Liegestelle erreichen."},{"id":"R65","cat":"Recht","nr":65,"bogen":11,"q":"Welche speziellen Fahrregeln haben Sportfahrzeuge im Nord-Ostsee-Kanal (NOK) einzuhalten?","a":"1. Segeln ist auf dem NOK verboten.\n2. Sportfahrzeuge mit Maschinenantrieb dürfen zusätzlich die Segel setzen.\n3. Ein motorbetriebenes Sportfahrzeug darf nur ein Sportfahrzeug schleppen.","e":"Im NOK ist reines Segeln verboten, der Motor muss laufen. Segel dürfen zusätzlich gesetzt werden, z. B. zur Stabilisierung."},{"id":"R67","cat":"Recht","nr":67,"bogen":8,"q":"Sie sehen vor dem Einlaufen in den NOK in Brunsbüttel folgende Lichtsignale:\n1. ein unterbrochenes rotes Licht,\n2. ein unterbrochenes weißes Licht über einem unterbrochenen roten Licht,\n3. ein unterbrochenes weißes Licht. Geben Sie die Bedeutung dieser Signale an.","a":"1. Einfahren verboten.\n2. Freigabe wird vorbereitet.\n3. Sportfahrzeuge können einfahren.","e":"Die Schleusensignale sind wie eine Ampel: Rot = verboten, Weiß über Rot = gleich geht's los, Weiß = Sportboote einfahren."},{"id":"R68","cat":"Recht","nr":68,"bogen":4,"q":"Erläutern Sie den Begriff \"Vorfahrt beachten\".","a":"\"Vorfahrt beachten\" begründet eine Wartepflicht. Wer die Vorfahrt zu beachten hat, muss rechtzeitig durch sein Fahrverhalten erkennen lassen, dass er warten wird. Er darf nur weiterfahren, wenn er übersehen kann, dass die Schifffahrt im Fahrwasser nicht beeinträchtigt wird. Ggf. hat der Wartepflichtige seinen Kurs und/oder seine Geschwindigkeit zu ändern (gilt rechtlich nicht als Ausweichen!).","e":"„Vorfahrt beachten“ heißt warten, bis die Situation sicher ist. Kursänderungen dabei gelten nicht als Ausweichen im Sinne der KVR."},{"id":"R69","cat":"Recht","nr":69,"bogen":5,"q":"Erläutern Sie den Begriff \"Vorfahrt haben\".","a":"\"Vorfahrt haben\" gilt für ein im Fahrwasser fahrendes oder dem Fahrwasserverlauf folgendes Fahrzeug. Das bedeutet, dass andere Fahrzeuge, die in das Fahrwasser einlaufen wollen, warten müssen. \"Vorfahrt haben\" bedeutet nicht: Vorfahrt erzwingen! Ggf. muss ein vorfahrtberechtigtes Fahrzeug Maßnahmen zur Verhinderung einer drohenden Kollision ergreifen.","e":"Vorfahrt ist kein Freifahrtschein. Wenn der Wartepflichtige sich falsch verhält, muss auch der Vorfahrtberechtigte handeln."},{"id":"R70","cat":"Recht","nr":70,"bogen":12,"q":"Wie hat sich ein in das Fahrwasser einlaufendes Fahrzeug gegenüber im Fahrwasser fahrenden Fahrzeugen zu verhalten?","a":"Es muss die Vorfahrt der Fahrzeuge im Fahrwasser beachten. Es muss rechtzeitig durch sein Fahrverhalten erkennen lassen, dass es warten wird.","e":"Wer ins Fahrwasser will, ist wartepflichtig. Durch deutliches Verlangsamen oder Aufstoppen zeigt man, dass man den Verkehr durchlässt – das ist kein Ausweichen im Sinne der KVR."},{"id":"R71","cat":"Recht","nr":71,"bogen":9,"q":"Wie hat sich ein den Ankerplatz oder Liegeplatz verlassendes Fahrzeug gegenüber im Fahrwasser fahrenden Fahrzeugen zu verhalten?","a":"Es muss die Vorfahrt der Fahrzeuge im Fahrwasser beachten, d. h. es muss warten, bis das Fahrwasser frei ist. Es muss rechtzeitig durch sein Fahrverhalten erkennen lassen, dass es warten wird.","e":"Beim Ablegen gilt dasselbe wie beim Einlaufen ins Fahrwasser: warten, bis frei ist. Besonders auf Flüssen wie der Elbe unterschätzt man leicht die Geschwindigkeit großer Schiffe."},{"id":"R72","cat":"Recht","nr":72,"bogen":13,"q":"Welche Fahrregeln muss ein Sportfahrzeug beachten, wenn es der Richtung des Fahrwassers folgt?","a":"Es muss sich so nahe am äußeren Rand des Fahrwassers an seiner Steuerbordseite halten, wie dieses ohne Gefahr möglich ist.","e":"Das Rechtsfahrgebot lässt die tiefe Fahrwassermitte für große Schiffe frei. Außerhalb der Tonnenreihe ist oft genug Wasser für Sportboote – die Karte zeigt, wie weit man ausweichen kann."},{"id":"R73","cat":"Recht","nr":73,"bogen":14,"q":"Was muss ein Sportfahrzeug in Bezug auf das Fahrwasser beachten, wenn es außerhalb des Fahrwassers fährt?","a":"Außerhalb des Fahrwassers ist so zu fahren, dass klar erkennbar ist, dass das Fahrwasser nicht benutzt wird.","e":"Wer knapp neben dem Fahrwasser fährt, sollte nicht so aussehen, als wolle er gleich einscheren. Klare Distanz und ein Kurs parallel zur Tonnenreihe machen die Absicht eindeutig."},{"id":"R74","cat":"Recht","nr":74,"bogen":15,"q":"Wie müssen sich Segelfahrzeuge verhalten, die, dem Fahrwasserverlauf folgend, sich auf (nahezu) entgegengesetzten Kursen begegnen?","a":"Jedes Fahrzeug muss nach Steuerbord ausweichen.","e":"Im Fahrwasser geht das Rechtsfahrgebot den Segler-Ausweichregeln (Luv/Lee, Backbord/Steuerbord) vor. Beide halten sich rechts und passieren Backbord an Backbord."},{"id":"R75","cat":"Recht","nr":75,"bogen":11,"q":"Was bedeutet \"Queren eines Fahrwassers\" im Sinne der SeeSchStrO?","a":"Deutliches Abweichen vom Fahrwasserverlauf. (im allgemeinen > 10 °)","e":"Queren heißt: deutlich vom Fahrwasserverlauf abweichen. Dann gehört man nicht mehr zur durchgehenden Schifffahrt und hat keine Vorfahrt."},{"id":"R77","cat":"Recht","nr":77,"bogen":1,"q":"Sie sehen auf der Elbe bei Nacht ein Fahrzeug mit der nachfolgenden Lichterführung. (Skizze) Um was für ein Fahrzeug handelt es sich? Was bedeuten die beiden roten und die beiden grünen Lichter senkrecht übereinander?","a":"Manövrierbehindertes Fahrzeug, Länge wahrscheinlich 50 m oder mehr, von vorn mit Fahrt durchs Wasser, das Unterwasserarbeiten ausführt.\nSteuerbord = Passierseite (zwei grüne Rundumlichter übereinander),\nBackbord = Passierbehinderung (zwei rote Rundumlichter übereinander).","e":"Ein manövrierbehindertes Fahrzeug bei Unterwasserarbeiten zeigt die Passierseite mit grünen und die gesperrte Seite mit roten Lichtern. Grün heißt: hier vorbei.","qs":"r77"},{"id":"R78","cat":"Recht","nr":78,"bogen":2,"q":"Sie sehen auf der Elbe bei Tage ein Fahrzeug mit den nachfolgenden schwarzen Signalkörpern (Skizze), dessen Bugwelle man klar erkennen kann. Um was für ein Fahrzeug handelt es sich? Was bedeuten die beiden schwarzen Bälle und die beiden schwarzen Rhomben senkrecht übereinander?","a":"Entgegenkommendes manövrierbehindertes Fahrzeug von vorn, mit Fahrt durchs Wasser, das Unterwasserarbeiten ausführt\nBackbord = Passierseite (zwei schwarze Rhomben übereinander),\nSteuerbord = Passierbehinderung (zwei schwarze Bälle übereinander).","e":"Tagsüber entsprechen Rhomben den grünen und Bälle den roten Lichtern. An der Rhomben-Seite darf man passieren.","qs":"r78"},{"id":"R79","cat":"Recht","nr":79,"bogen":12,"q":"Beim Passieren von Cuxhaven sichten Sie, elbabwärts segelnd, an Ihrer Steuerbord-Seite die Tonne 32a. Um was für eine Tonne handelt es sich, welche Bezeichnung hat die nächste Tonne an der gleichen Seite?","a":"Eine Backbord-Fahrwassertonne. Nächste Tonne = 32.","e":"Gerade Nummern und rote Farbe bedeuten Backbordtonne (von See kommend). Seewärts fährt man gegen die Zählrichtung, die Nummern werden also kleiner."},{"id":"R80","cat":"Recht","nr":80,"bogen":13,"q":"Welche besondere Lichterführung/Kennzeichnung ist vorgeschrieben, wenn ein Motorsportfahrzeug ein anderes Sportfahrzeug schleppt?","a":"Motorsportfahrzeuge, die andere Sportfahrzeuge schleppen, gelten nicht als schleppende Maschinenfahrzeuge im Sinne der KVR. Daher keine besondere Lichterführung/ Kennzeichnung.","e":"Das Schleppen eines Sportboots durch ein anderes ist rechtlich kein Schleppverband im Sinne der KVR. Es gelten die normalen Lichter – trotzdem sollte man vorsichtig und langsam fahren."},{"id":"R81","cat":"Recht","nr":81,"bogen":4,"q":"Welche besonderen Bestimmungen gelten auf dem Nord-Ostsee-Kanal (NOK) für Sportfahrzeuge beim Schleppen?","a":"1. Ein motorbetriebenes Sportfahrzeug darf nur ein Sportfahrzeug schleppen.\n2. Das geschleppte Sportfahrzeug darf nur eine Höchstlänge von weniger als 15 m haben.\n3. Die Mindestgeschwindigkeit beim Schleppen muss 9 km/h betragen.","e":"Im NOK sind die Schlepp-Regeln streng, weil Berufsschiffe schnell unterwegs sind. Nur ein Sportboot, unter 15 m, mit mindestens 9 km/h."},{"id":"R82","cat":"Recht","nr":82,"bogen":14,"q":"Während einer Revierfahrt erkennen Sie ein Signal an Land, jeweils schwarze Signalkörper: (Skizze)\n1. Was bedeutet dieses Signal?\n2. Welches Signal wird stattdessen nachts gezeigt?","a":"1. Außergewöhnliche Schifffahrtsbehinderung.\n2. Nachts: Rundumlichter rot-rot-grün senkrecht übereinander.","e":"Tagsüber zeigen zwei Bälle über einem Kegel mit Spitze nach unten die außergewöhnliche Schifffahrtsbehinderung an. Nachts entsprechen dem die Lichter rot-rot-grün.","qs":"r82q","es":"r82a"},{"id":"R83","cat":"Recht","nr":83,"bogen":6,"q":"Wer darf laut SeeSchStrO ein Fahrzeug nicht führen oder als Mitglied der Crew eine andere Tätigkeit des Brücken- oder Decksdienstes nicht ausüben (allgemein ohne Zahlen zu beantworten)?","a":"Wer infolge körperlicher oder geistiger Mängel oder des Genusses alkoholischer Getränke oder anderer berauschender Mittel in der sicheren Führung eines Fahrzeugs oder in der sicheren Ausübung einer anderen Tätigkeit des Brücken- oder Decksdienstes behindert ist.","e":"Die SeeSchStrO wiederholt hier die Regel der KVR-Verordnung. Die Einschränkung gilt für jede Beeinträchtigung, nicht nur Alkohol."},{"id":"R84","cat":"Recht","nr":84,"bogen":10,"q":"Welche Atem- bzw. Blutalkoholkonzentration darf laut SeeSchStrO nicht erreicht werden, damit kein Verbot für ein Führen eines Fahrzeugs oder als Mitglied der Crew für ein Ausüben des Brückendienstes besteht?","a":"0,25 mg/l oder mehr Alkohol in der Atemluft 0,5 Promille oder mehr Alkohol im Blut.","e":"Gleiche Grenzwerte wie bei der KVR-Verordnung. Wer darunter liegt, darf trotzdem nicht fahren, wenn er beeinträchtigt ist."},{"id":"R86","cat":"Recht","nr":86,"bogen":5,"q":"Was ist ein Flaggenzertifikat? Für welche Fahrzeuge kann es ausgestellt werden?","a":"Vom BSH ausgestellter Ausweis, mit dem das Recht und die Pflicht zum Führen der Bundesflagge nachgewiesen wird. Für Fahrzeuge unter 15 m Lüa = \"nicht registerpflichtige Fahrzeuge\"","e":"Das Flaggenzertifikat belegt, dass die Yacht die deutsche Flagge führen darf. Im Ausland wird es oft als Nachweis der Nationalität verlangt; alternativ gibt es den Internationalen Bootsschein."},{"id":"R87","cat":"Recht","nr":87,"bogen":15,"q":"Was ist das Schiffszertifikat, wer stellt es aus, ab welcher Schiffslänge ist es vorgeschrieben?","a":"Nachweis, dass ein Schiff im Seeschiffsregister eingetragen ist.\nAusgesteller: Registergericht,\nVorgeschrieben ab 15 m Rumpflänge.","e":"Schiffe ab 15 m Rumpflänge müssen ins Seeschiffsregister beim Amtsgericht. Das Schiffszertifikat ersetzt dann das Flaggenzertifikat."},{"id":"R88","cat":"Recht","nr":88,"bogen":2,"q":"Was versteht man unter dem Begriff \"Küstenmeer\"?","a":"Die seewärts der Basislinie gelegenen Meeresgewässer bis zu einer Breite von 12 sm.","e":"Das Küstenmeer (12 sm) gehört zum Hoheitsgebiet des Küstenstaates. Dort gelten dessen Gesetze, Fremde haben nur das Recht der friedlichen Durchfahrt."},{"id":"R90","cat":"Recht","nr":90,"bogen":3,"q":"Was versteht man unter dem Begriff \"Basislinie\" und wo finden Sie diese?","a":"Die Grenze zwischen den inneren Gewässern (eines Staates) und Küstenmeer. Befinden sich in Seekarten.","e":"Die Basislinie folgt meist der Niedrigwasserlinie oder verbindet Inseln und Buchten. Sie ist in Seekarten eingezeichnet."},{"id":"R91","cat":"Recht","nr":91,"bogen":6,"q":"Welche Aufgaben hat die Bundesstelle für Seeunfalluntersuchung?","a":"1. Untersuchung von Seeunfällen\n2. Ermittlung der (See) Unfallumstände\n3. Herausgabe von Untersuchungsberichten\n4. Sicherheitsempfehlungen zur Verhütung von Seeunfällen.","e":"Die BSU untersucht Unfälle, um die Ursachen zu klären und Wiederholungen zu vermeiden. Sie klärt nicht die Schuldfrage."},{"id":"R92","cat":"Recht","nr":92,"bogen":1,"q":"Wann liegt ein schaden- oder gefahrverursachendes Vorkommnis (Seeunfall) im Sinne des Seesicherheits -Untersuchungs- Gesetzes (SUG) vor? Nennen Sie mindestens 3 Merkmale.","a":"1. Schiffsverlust, Aufgrundlaufen, Kollision eines Schiffes,\n2. Tod oder Verschollenheit oder schwere Verletzung einer Person,\n3. Maritimer Umweltschaden oder sonstiger Sachschaden,\n4. Gefahr für einen Menschen oder ein Schiff,\n5. Gefahr eines schweren Schadens an einem Schiff, einem meerestechnischen Bauwerk oder an der Meeresumwelt.","e":"Seeunfall ist mehr als eine Kollision: auch Personenschäden, Umweltschäden oder eine gefährliche Situation zählen. Drei Beispiele reichen."},{"id":"R93","cat":"Recht","nr":93,"bogen":9,"q":"Was müssen Sie nach einem Seeunfall veranlassen? Wie kann es umgesetzt werden?","a":"Seeunfall unverzüglich der Bundesstelle für Seeunfalluntersuchung melden. Deutschland -> über Wasserschutzpolizei / Ausland -> über zuständige Hafenbehörde","e":"Die Meldung muss unverzüglich erfolgen. Die Wasserschutzpolizei leitet sie an die BSU weiter; im Ausland übernimmt das die Hafenbehörde."},{"id":"R94","cat":"Recht","nr":94,"bogen":7,"q":"Welche Angaben müssen der Bundesstelle für Seeunfalluntersuchung gemeldet werden? Nennen Sie mindestens 5 dieser Angaben.","a":"1. Name / Aufenthaltsort des Meldenden,\n2. Ort / Zeit des Unfalles,\n3. Name, Rufzeichen und Flagge des Schiffes\n4. Name des Betreibers des Schiffes,\n5. Name des verantwortlichen Schiffsführers,\n6. Herkunfts- und Zielhafen des Schiffes,\n7. Anzahl der Besatzungsmitglieder und weiterer Personen an Bord,\n8. Umfang des Personen- und Sachschadens,\n9. Darstellung des Verlaufs des Vorkommnisses,\n10. Angaben über andere Schiffe, die am Unfall beteiligt sind,\n11. Wetterbedingungen,\n12. Darstellung der Gefahr einer Meeresverschmutzung.","e":"Denk an die W-Fragen: Wer, wo, wann, welches Schiff, was ist passiert, welche Schäden, welches Wetter. Fünf Angaben reichen."},{"id":"R95","cat":"Recht","nr":95,"bogen":4,"q":"In welcher Vorschrift ist geregelt, welche Angaben der Bundesstelle für Seeunfalluntersuchung bei einem schaden- oder gefahrverursachenden Vorkommnis (Seeunfall) gemeldet werden müssen? Wer ist verantwortlich für die Meldung?","a":"Vorschrift: \"Verordnung über die Sicherung der Seefahrt\".\nVerantwortlich: Schiffsführer oder bei Verhinderung: Besatzungsmitglied.","e":"Die Meldepflicht steht in der „Verordnung über die Sicherung der Seefahrt“. Ist der Schiffsführer verletzt oder verhindert, muss ein Besatzungsmitglied melden."},{"id":"R96","cat":"Recht","nr":96,"bogen":2,"q":"Was sind Seeämter und was sind ihre Aufgaben?","a":"Untersuchungsausschüsse der Wasser- und Schifffahrtsdirektionen Nord / Nordwest.\nAufgabe: Untersuchung der Frage, ob gegenüber einem Verfahrensbeteiligten ein Fahrverbot ausgesprochen oder ein Befähigungszeugnis bzw. Führerschein der Sportschifffahrt entzogen werden muss.","e":"Seeämter entscheiden über persönliche Konsequenzen wie Fahrverbote oder Entzug des Führerscheins. Die BSU dagegen sucht nur nach Ursachen, nicht nach Schuld."},{"id":"R97","cat":"Recht","nr":97,"bogen":11,"q":"Welche behördlichen Veröffentlichungen für Wassersportler geben Ihnen rechtliche Informationen und Hinweise über das Verhalten auf Seeschifffahrtsstraßen?","a":"\"Sicherheit auf dem Wasser, Leitfaden für Wassersportler\". \"Sicherheit im See- und Küstenbereich, Sorgfaltsregeln für Wassersportler\".","e":"Die beiden Broschüren fassen die wichtigsten Regeln für Wassersportler verständlich zusammen. Beide gibt es kostenlos zum Download über ELWIS."},{"id":"R98","cat":"Recht","nr":98,"bogen":8,"q":"Sie sehen von Ihrem Sportfahrzeug aus in der Nordsee nördlich von Helgoland eine noch unbekannte Gefahr, z. B. einen treibenden Container. Was haben Sie zu unternehmen?","a":"Man muss dies auf dem schnellsten Weg direkt oder über eine Verkehrszentrale bzw. Küstenfunkstelle dem Maritimen Lagezentrum (MLZ) in Cuxhaven als Meldestelle für Unfälle auf See mitteilen.","e":"Das MLZ in Cuxhaven ist die zentrale deutsche Meldestelle für Gefahren auf See. Erreichbar über UKW (Verkehrszentrale, Küstenfunk) oder Telefon; eine schnelle Meldung kann eine nautische Warnnachricht auslösen."},{"id":"R101","cat":"Recht","nr":101,"bogen":12,"q":"Welche Befahrensregelungen gelten für die Schutzzonen I in den Nationalparks im Deutschen Wattenmeer außerhalb der speziellen Schutzgebiete?","a":"Das Verlassen der Fahrwasser zwischen 3 h nach Hochwasser und 3 h vor dem folgenden Hochwasser ist untersagt. In der übrigen Zeit beträgt für Sportfahrzeuge die Höchstgeschwindigkeit außerhalb des Fahrwassers 8 kn und generell im Fahrwasser 12 kn.","e":"In den Kernzonen des Nationalparks Wattenmeer soll die Natur möglichst ungestört bleiben. Außerhalb des Fahrwassers darf man daher nur rund um Hochwasser fahren und muss langsam sein."},{"id":"R103","cat":"Recht","nr":103,"bogen":1,"q":"Welchen Zweck soll das MARPOL- Übereinkommen erfüllen?","a":"Die Verschmutzung der Meere verhindern.","e":"MARPOL ist ein IMO-Übereinkommen mit mehreren Anlagen: u. a. Öl (I), Schiffsabwasser (IV) und Schiffsmüll (V). Es gilt weltweit."},{"id":"R104","cat":"Recht","nr":104,"bogen":13,"q":"Was sind Sondergebiete im Sinne des MARPOL Übereinkommens in Europa?","a":"Ostsee, Nordsee und Mittelmeer.","e":"Sondergebiete sind besonders empfindliche, relativ geschlossene Meere. Dort gelten strengere Einleitverbote als auf den Ozeanen."},{"id":"R105","cat":"Recht","nr":105,"bogen":5,"q":"Was ist nach dem MARPOL-Übereinkommen für die Sportschifffahrt in Sondergebieten grundsätzlich verboten?","a":"Das Einleiten von Öl, Schiffsabwässern, Schiffsmüll und anderen Schadstoffen.","e":"In Sondergebieten darf man praktisch nichts einleiten: kein Öl, kein Fäkalienwasser, keinen Müll. Die Yacht braucht daher Fäkalientank und Müllsammlung an Bord."},{"id":"R106","cat":"Recht","nr":106,"bogen":14,"q":"Gilt das MARPOL-Übereinkommen grundsätzlich auch für Sportfahrzeuge?","a":"Das MARPOL-Übereinkommen gilt grundsätzlich für alle Schiffe, somit auch für Sportfahrzeuge.","e":"Es gibt keine Ausnahme für Sportboote. Manche Vorschriften (z. B. Ölbuch) gelten erst ab bestimmten Größen, die Einleitverbote aber für alle."},{"id":"R107","cat":"Recht","nr":107,"bogen":4,"q":"Woraus können Sie Informationen über Entsorgungsmöglichkeiten in deutschen Sportboothäfen entnehmen?","a":"Aus der Broschüre \"Entsorgungsmöglichkeiten für Öl, Schiffsmüll und Schiffsabwässer - eine Übersicht für Sport- und Kleinschifffahrt\" des BSH.","e":"Die BSH-Broschüre listet Absaugstationen für Fäkalientanks, Altöl- und Müllannahme in deutschen Häfen. Hafenhandbücher enthalten meist dieselben Informationen."},{"id":"R108","cat":"Recht","nr":108,"bogen":3,"q":"Wie ist auf Sportfahrzeugen mit ölhaltigem Bilgenwasser zu verfahren, wenn die Bedingungen, unter denen nach MARPOL das Lenzen zulässig ist, nicht eingehalten werden können?","a":"Es muss im Hafen entsorgt werden.","e":"Lenzen ist nur bei sehr geringem Ölgehalt (15 ppm) erlaubt – ohne Ölabscheider schafft das kaum eine Yacht. Also sammeln (Ölbindetücher, Kanister) und im Hafen an der Entsorgungsstation abgeben."},{"id":"R110","cat":"Recht","nr":110,"bogen":6,"q":"Welche Müllanteile dürfen in Sondergebieten nicht auf See entsorgt werden?","a":"Synthetische Seile, Netze, Segel, Kunststofftüten u. Ä., Papiererzeugnisse, Lumpen, Glas, Metall, Steingut, Schalungs- oder Verpackungsmaterial.","e":"Kunststoffe dürfen nirgends ins Meer, auch nicht außerhalb der Sondergebiete. In Sondergebieten ist sogar Papier, Glas und Metall verboten – nur Lebensmittelreste mit Abstand zur Küste sind erlaubt."},{"id":"S1","cat":"Seemannschaft","nr":1,"bogen":6,"q":"Was versteht man im Bootsbau unter Gelcoat?","a":"Die äußere Schutzschicht eines Bauteils aus glasfaserverstärktem Kunststoff.","e":"Gelcoat ist die glatte, farbige Außenhaut eines GFK-Rumpfes. Sie schützt das Laminat darunter vor Wasser und UV-Licht."},{"id":"S2","cat":"Seemannschaft","nr":2,"bogen":11,"q":"Was versteht man beim GFK-Bootsbau unter Sandwichverfahren (GFK = glasfaserverstärkter Kunststoff)?","a":"Zwischen zwei GFK-Schichten wird eine Zwischenlage zur Versteifung einlaminiert, z. B. aus Balsaholz","e":"Beim Sandwich liegt ein leichter Kern (Balsa, Schaum) zwischen zwei dünnen GFK-Schichten. Ähnlich wie ein Doppel-T-Träger wird das Bauteil dadurch sehr steif, ohne schwer zu werden."},{"id":"S3","cat":"Seemannschaft","nr":3,"bogen":12,"q":"Welchen Vorteil hat die Sandwichbauweise gegenüber der Massivbauweise bei GFK- Yachten (GFK = glasfaserverstärkter Kunststoff)?","a":"1. Große Steifheit,\n2. Verwindungsfestigkeit,\n3. Geringes Gewicht,\n4. Gute Isolierung.","e":"Der Abstand der beiden Deckschichten bringt die Steifigkeit, der leichte Kern spart Gewicht. Nebenbei dämmt er Wärme und Schall."},{"id":"S4","cat":"Seemannschaft","nr":4,"bogen":13,"q":"Beschreiben Sie die Vor- und Nachteile von Stahl als Baumaterial für Yachten","a":"Vorteile: zuverlässiges, problemloses Baumaterial mit sehr hoher Festigkeit und langer Lebensdauer.\nNachteile: hohes Gewicht, Rostanfälligkeit.","e":"Stahl verzeiht Grundberührungen und Kollisionen besser als GFK. Der Preis ist Gewicht und ständiger Kampf gegen Rost."},{"id":"S5","cat":"Seemannschaft","nr":5,"bogen":14,"q":"Was bedeutet der Begriff \"Kategorie\" im Zusammenhang mit dem CE-Zeichen für Wassersportfahrzeuge?","a":"Mit der Kategorie legt der Hersteller fest,\n1. in welchem Fahrgebiet,\n2. bis zu welcher Windstärke und\n3. charakteristischen Wellenhöhe das Fahrzeug sicher betrieben werden kann.","e":"Die CE-Kategorie beschreibt die Bedingungen, für die das Boot konstruiert wurde. Sie ist keine Garantie, sondern eine Auslegungsgrenze."},{"id":"S6","cat":"Seemannschaft","nr":6,"bogen":5,"q":"Welche Kategorien können im Zusammenhang mit dem CE-Zeichen für Wassersportfahrzeuge vergeben werden?","a":"1. A = Hochsee,\n2. B = Außerhalb von Küstengewässern,\n3. C = Küstennahe Gewässer,\n4. D = Geschützte Gewässer.","e":"Merkhilfe: A bis D geht von Hochsee bis geschützte Gewässer. Je weiter hinten im Alphabet, desto ruhiger das Einsatzgebiet."},{"id":"S7","cat":"Seemannschaft","nr":7,"bogen":6,"q":"Was bedeutet die im Zusammenhang mit dem CE-Zeichen für Wassersportfahrzeuge angegebene Kategorie \"B Außerhalb von Küstengewässern\"?","a":"Das Fahrzeug ist ausgelegt für Fahrten außerhalb von Küstengewässern, in denen Windstärken bis 8 Bft und signifikante Wellenhöhen bis 4 m auftreten können.","e":"B-Boote sind für Fahrten wie Nord- oder Ostsee-Überquerungen gedacht. Bft 8 und 4 m Wellen sind die Grenzen, für die sie ausgelegt sind."},{"id":"S8","cat":"Seemannschaft","nr":8,"bogen":7,"q":"Beschreiben Sie den Aufbau einer Radsteuerung mit Seilzügen","a":"Das Rad dreht ein Zahnrad, über das eine Kette in der Steuersäule nach unten verläuft. Die Kette ist mit den Steuerseilen verbunden, welche über Umlenkrollen zum Ruderquadranten führen.","e":"Rad → Kette → Seile → Quadrant → Ruder. Wer das Prinzip kennt, kann Probleme wie ein ausgesprungenes Seil schneller finden."},{"id":"S10","cat":"Seemannschaft","nr":10,"bogen":7,"q":"1. Wozu dienen Backstagen?\n2. Bei welchen Takelungen werden sie vor allem gefahren?","a":"1. Zum zusätzlichen Abstagen des Mastes nach achtern.\n2. Bei 7/8-Takelung und anderen nicht toppgetakelten Yachten.","e":"Bei 7/8-Takelung greift das Vorstag unterhalb des Masttopps an. Backstagen stützen dann den Mast nach achtern und halten das Vorstag straff."},{"id":"S12","cat":"Seemannschaft","nr":12,"bogen":5,"q":"Was gehört zur regelmäßigen Pflege der Segel?","a":"1. Nasse Segel trocknen,\n2. Segel vor Sonnenlicht schützen,\n3. Salzwasserreste abspülen und\n4. Beschädigungen umgehend beseitigen.","e":"UV-Licht, Salz und Nässe zerstören Segeltuch und Nähte. Kleine Schäden früh reparieren verhindert große Risse."},{"id":"S13","cat":"Seemannschaft","nr":13,"bogen":10,"q":"Warum sollten Vorsegel für schweres Wetter im Unterliek hoch geschnitten sein?","a":"Damit überkommende Seen nicht ins Segel schlagen und so Rigg und Segel belasten.","e":"Ein hoch geschnittenes Unterliek hält das Segel über den Wellen. So wird es nicht von Brechern getroffen und bleibt sichtbar für den Rudergänger."},{"id":"S14","cat":"Seemannschaft","nr":14,"bogen":15,"q":"Was ist ein Trysegel und wie wird es gefahren?","a":"Ein Schwerwettersegel, das anstelle des Großsegels mit losem Unterliek gefahren wird.","e":"Das Trysegel ist ein kleines, sehr stabiles Sturmsegel. Es wird ohne Baum gefahren, damit dieser bei schwerem Wetter keine Gefahr ist."},{"id":"S15","cat":"Seemannschaft","nr":15,"bogen":4,"q":"Warum soll man das Schlagen eines Segels vermeiden, vor allem bei stärkerem Wind?","a":"Um Beschädigungen zu vermeiden.","e":"Schlagende Segel werden an Nähten und Lieken stark belastet. Außerdem schlagen Schoten und Blöcke unkontrolliert herum."},{"id":"S17","cat":"Seemannschaft","nr":17,"bogen":7,"q":"Wozu dient ein \"Cunningham-Stropp\"?","a":"Zur Regulierung der Vorliekspannung des Großsegels, um es so zu trimmen.","e":"Der Cunningham zieht das Vorliek nach unten und verschiebt so den Bauch des Segels nach vorn. Bei mehr Wind macht das das Segel flacher."},{"id":"S18","cat":"Seemannschaft","nr":18,"bogen":8,"q":"Welche Segel sollte eine Segelyacht in der Küstenfahrt mindestens an Bord haben?","a":"1. Reffbares Großsegel,\n2. Reffbare Rollfock oder Vorsegel verschiedener Größen,\n3. Sturmfock.","e":"Man muss die Segelfläche an jeden Wind anpassen können. Eine Sturmfock ist für den Notfall unverzichtbar."},{"id":"S21","cat":"Seemannschaft","nr":21,"bogen":11,"q":"Wozu dient der Lenzkorb am Ansaugstutzen einer Lenzpumpe und wie erhalten Sie damit ihre Funktionsfähigkeit?","a":"Der Lenzkorb verhindert Verunreinigungen und Verstopfungen der Lenzpumpe. Er muss regelmäßig überprüft und gereinigt werden.","e":"Ohne Lenzkorb saugen Pumpen Schmutz an und verstopfen. Im Notfall wäre das fatal – deshalb regelmäßig kontrollieren."},{"id":"S22","cat":"Seemannschaft","nr":22,"bogen":2,"q":"Welche Lenzvorrichtungen und -möglichkeiten sollten auf jeder seegehenden Yacht vorhanden sein?","a":"Zwei voneinander unabhängige Bilgenpumpen, von denen\n1. eine über Deck und\n2. eine unter Deck bedienbar ist, sowie\n3. Zwei Pützen mit Leinen.","e":"Zwei unabhängige Pumpen sorgen für Redundanz. Eine von Deck bedienbare Pumpe ist wichtig, weil man bei schwerem Wetter nicht unbedingt nach unten will."},{"id":"S23","cat":"Seemannschaft","nr":23,"bogen":1,"q":"Warum sollten Sie mehr als einen Anker an Bord haben, möglichst unterschiedlicher Art?","a":"1. Als Ersatz bei Verlust,\n2. zum Verwarpen oder Verkatten,\n3. um unterschiedliche Ankergründe berücksichtigen zu können,\n4. um bei schwerem Wetter vor 2 Ankern liegen zu können.","e":"Anker gehen verloren oder halten auf manchen Böden schlecht. Ein Zweitanker gibt Sicherheit und mehr Möglichkeiten."},{"id":"S25","cat":"Seemannschaft","nr":25,"bogen":12,"q":"Was sollte auf jeder Yacht außer Festmacherleinen, Fallen und Schoten an Tauwerk vorhanden sein?","a":"1. Reservetauwerk,\n2. Wurfleine,\n3. Schlepptrosse und Ankerleine.","e":"Reserveleinen braucht man für Reparaturen und Notfälle, die Wurfleine fürs Anlegen oder Retten. Die Schlepptrosse ist nötig, falls man geschleppt werden muss."},{"id":"S26","cat":"Seemannschaft","nr":26,"bogen":9,"q":"Für welche unterschiedlichen Reparaturbereiche sollten Sie Ersatzteile und Werkzeug an Bord haben?","a":"1. Segel\n2. Rumpf und Rigg,\n3. Motor\n4. Elektro\n5. Schlauchleitungen.","e":"Merkhilfe über die Systeme an Bord: Segel, Rumpf/Rigg, Motor, Elektrik, Schläuche. Auf See gibt es keine Werkstatt – was man nicht dabeihat, kann man nicht reparieren."},{"id":"S27","cat":"Seemannschaft","nr":27,"bogen":13,"q":"Welches Werkzeug sollten Sie zur Segelreparatur an Bord haben?","a":"Segelhandschuh, Segelnadeln, Segelgarn, Wachs, Zange und selbstklebendes Segeltuch.","e":"Mit Nadel, Garn und Segelhandschuh lassen sich Nähte reparieren. Klebesegeltuch ist die schnelle Notlösung."},{"id":"S28","cat":"Seemannschaft","nr":28,"bogen":6,"q":"Ihr Mast ist gebrochen, eine Bergung ist nicht möglich. Welche Werkzeuge benötigen Sie, um die Takelage zu kappen?","a":"Bolzenschneider, Metallsäge mit Ersatzblättern, Schraubenschlüssel und verschiedene Zangen.","e":"Wanten und Stagen sind Stahldraht. Nur Bolzenschneider oder Säge kommen da durch."},{"id":"S29","cat":"Seemannschaft","nr":29,"bogen":14,"q":"Welches Kleinmaterial und Kleinwerkzeug muss an Bord jederzeit greifbar sein?","a":"Kleinmaterial: Zeisinge, Bändselwerk, Tape, Reserveschäkel,\nKleinwerkzeug: Schäkelöffner, Bordmesser und Kombizange.","e":"Zeisinge und Bändsel sichern Segel und lose Teile, Tape und Schäkel sind die Universalreparatur. Ein Messer muss so griffbereit sein, dass man im Notfall sofort eine Leine kappen kann."},{"id":"S31","cat":"Seemannschaft","nr":31,"bogen":7,"q":"Wo finden Sie amtliche Informationen über die Ausrüstung und Sicherheit von Sportbooten, die auch bei der Beurteilung von Sportbootunfällen herangezogen werden?","a":"1. \"Sicherheit im See- und Küstenbereich, Sorgfaltsregeln für Wassersportler\", herausgegeben vom BSH,\n2. \"Sicherheit auf dem Wasser, Leitfaden für Wassersportler\", herausgegeben vom Bundesministerium für Verkehr, Bau und Stadtentwicklung.","e":"Die beiden Broschüren beschreiben die empfohlene Ausrüstung. Bei Unfällen dienen sie als Maßstab für gute Seemannschaft."},{"id":"S33","cat":"Seemannschaft","nr":33,"bogen":3,"q":"Warum ist Flüssiggas (Propan, Butan) an Bord einer Yacht besonders gefährlich?","a":"Es ist schwerer als Luft, sinkt nach unten und bildet mit Luft ein explosives Gemisch; es kann sich im Schiffsinneren (z. B. in der Bilge) sammeln.","e":"Gas sammelt sich unbemerkt in der Bilge. Ein Funke reicht dann für eine Explosion – deshalb Gasventil nach Gebrauch schließen und Gaswarner nutzen."},{"id":"S34","cat":"Seemannschaft","nr":34,"bogen":15,"q":"Welche 4 Bedienelemente besitzt ein mit Handpumpe betriebenes Bord-WC auf einer Yacht?","a":"1. Seeventil und Spülwasserschlauch (Seewasser),\n2. Handpumpe für Toilettenspülung,\n3. Hebel zur Unterbrechung der Seewasserzufuhr\n4. Abwasserschlauch (via Fäkalientank) zum Seeventil.","e":"Ein Bord-WC hat Zu- und Ablauf über Seeventile. Wer das System versteht, verhindert Wassereinbruch."},{"id":"S35","cat":"Seemannschaft","nr":35,"bogen":11,"q":"Beschreiben Sie in 5 Schritten die Bedienung eines Bord-WC auf einer Yacht.","a":"1. Seeventil für Seewasserspülung öffnen,\n2. Handpumpe betätigen und ausgiebig spülen,\n3. Hebel umlegen und Seewasserzufuhr unterbrechen\n4. Becken mit Handpumpe leer pumpen,\n5. Seeventile für Zu- und Abfluss schließen.","e":"Wichtig ist der letzte Schritt: Seeventile schließen. Offene Ventile sind eine häufige Ursache für Wassereinbruch."},{"id":"S36","cat":"Seemannschaft","nr":36,"bogen":4,"q":"Was versteht man unter der \"Stabilität\" eines Schiffes?","a":"Seine Eigenschaft, in aufrechter Lage zu schwimmen und sich aus einer Krängung wieder aufzurichten.","e":"Stabilität ist die Fähigkeit, sich wieder aufzurichten. Ohne sie würde jede Böe das Boot kentern lassen."},{"id":"S37","cat":"Seemannschaft","nr":37,"bogen":5,"q":"Wovon hängt die Stabilität eines Schiffes in ruhigem Wasser ab? Nennen Sie Beispiele für äußere Momente, welche die Stabilität beanspruchen.","a":"Die Stabilität hängt ab von seiner Geometrie (Form) und der Gewichtsverteilung im Schiff (Ausrüstung, Crew, Ballast). Beispiele für eine Beanspruchung der Stabilität sind krängende Momente durch Seitenwind, Trossenzug oder Drehkreisfahrt bei schnellen Motoryachten.","e":"Form und Gewichtsverteilung bestimmen die Stabilität. Äußere Kräfte wie Wind versuchen, das Boot zu krängen."},{"id":"S38","cat":"Seemannschaft","nr":38,"bogen":3,"q":"Wovon hängt eine in ruhigem Wasser vorhandene Stabilität zusätzlich in schwerem Wetter ab?","a":"Von Wind und Seegang, besonders von brechenden Wellen","e":"Im Seegang ändern Wellen die Unterwasserform ständig. Brechende Wellen können ein Boot besonders leicht umwerfen."},{"id":"S39","cat":"Seemannschaft","nr":39,"bogen":6,"q":"Was versteht man unter\n1. Formschwerpunkt (F)?\n2. Massenschwerpunkt (Gewichtsschwerpunkt, G)? Welche Kräfte wirken in den beiden Punkten?","a":"Formschwerpunkt F: Masse des vom Schiff verdrängten Wassers. In F wirkt die Auftriebskraft senkrecht zur Wasseroberfläche nach oben.\nMassenschwerpunkt G: Masse des gesamten Schiffes. In G wirkt die Gewichtskraft senkrecht zur Wasseroberfläche nach unten.","e":"Auftrieb wirkt im Formschwerpunkt nach oben, Gewicht im Massenschwerpunkt nach unten. Liegen beide nicht übereinander, entsteht ein Drehmoment."},{"id":"S40","cat":"Seemannschaft","nr":40,"bogen":7,"q":"Was geschieht bei einer Neigung des Schiffes, z. B. durch seitlichen Winddruck, solange sich die Lage des Massenschwerpunktes (Gewichtsschwerpunktes) nicht verändert? (Begründung!)","a":"Der Formschwerpunkt F wandert zur geneigten Seite aus, weil dort ein größerer Teil des Bootskörpers unter Wasser gelangt. Die Wirklinie der Auftriebskraft bekommt dadurch einen seitlichen Abstand zur Wirklinie der Gewichtskraft. Es entsteht ein Kräftepaar, der seitliche Abstand zwischen den Wirklinien ist der Hebelarm. Es entsteht ein aufrichtendes Moment, welches gleich dem Produkt aus Gewichtskraft und Hebelarm ist.","e":"Beim Krängen wandert der Auftrieb nach Lee. So entsteht ein Hebelarm, der das Boot wieder aufrichtet."},{"id":"S41","cat":"Seemannschaft","nr":41,"bogen":3,"q":"Erklären Sie mit Hilfe eines Vektorparallelogramms aus \"wahrem Wind (wW)\", \"Fahrtwind (Fw)\" und \"scheinbarem Wind (sW)\", warum beim Einfallen einer Bö (Windzunahme) der \"scheinbare Wind\" raumt. Welcher Vorteil ergibt sich dadurch beim Kreuzen? (Zeichnung!)","a":"Verhältnisse bei Einfall der Bö: Der \"scheinbare Wind\" fällt etwas achterlicher ein, er \"raumt\", und das Segelboot kann etwas höher an den \"wahren Wind\" gehen.","e":"Der scheinbare Wind setzt sich aus wahrem Wind und Fahrtwind zusammen. Frischt der wahre Wind auf, dominiert er stärker, der scheinbare Wind dreht achterlicher – man kann höher an den Wind gehen.","es":"s41"},{"id":"S42","cat":"Seemannschaft","nr":42,"bogen":8,"q":"Auf Amwindkurs mussten Sie reffen. Ein entgegenkommendes Boot gleicher Größe segelt ungerefft. Wie erklären Sie das?","a":"Der \"scheinbare Wind\" ist unterschiedlich stark. Auf Amwindkursen stärker, auf Raumschot- oder Vorwindkursen schwächer als der \"wahre Wind\".","e":"Am Wind addiert sich Fahrtwind zum wahren Wind, raumschots zieht er ihn ab. Deshalb fühlt sich der gleiche Wind am Wind viel stärker an."},{"id":"S43","cat":"Seemannschaft","nr":43,"bogen":9,"q":"Warum wird die Versetzung einer Yacht durch den Wind mit zunehmender Krängung größer?","a":"Der Lateralplan wird kleiner, dadurch verringert sich der seitliche Widerstand des Schiffes im Wasser.","e":"Bei Krängung liegt der Kiel schräg im Wasser und bietet weniger seitlichen Widerstand. Das Boot rutscht mehr nach Lee."},{"id":"S44","cat":"Seemannschaft","nr":44,"bogen":10,"q":"Welchen Einfluss hat zunehmende Krängung auf den Trimm eines Segelbootes? (Begründung!)","a":"Die Luvgierigkeit nimmt zu, weil der Segeldruckpunkt nach Lee auswandert.","e":"Der Segeldruck wandert bei Krängung nach Lee und damit seitlich vom Lateraldruckpunkt weg. Das Boot dreht in den Wind."},{"id":"S45","cat":"Seemannschaft","nr":45,"bogen":4,"q":"Sie segeln am Wind, Krängung und Ruderdruck nehmen stark zu.\n1. Wie bezeichnet man das Verhalten des Bootes?\n2. Mit welchen Mitteln können Sie die Krängung und den Ruderdruck vermindern?","a":"1. Luvgierigkeit.\n2. Traveller nach Lee setzen und/oder Großschot (etwas) fieren, Großsegel reffen.","e":"Starke Luvgierigkeit ist ein Zeichen für zu viel Segeldruck. Traveller nach Lee und Großschot fieren entlasten das Groß."},{"id":"S46","cat":"Seemannschaft","nr":46,"bogen":12,"q":"Welche Funktion hat ein Unterliekstrecker und wie kann mit dem Unterliekstrecker der Trimm des Großsegels beeinflusst werden?","a":"Er reguliert die Spannung der Unterlieks. Je nach Zugkraft wird der untere Teil des Großsegels flacher oder bauchiger.","e":"Mehr Spannung macht das untere Segel flach (für Starkwind), weniger macht es bauchig (für Leichtwind oder raume Kurse)."},{"id":"S47","cat":"Seemannschaft","nr":47,"bogen":13,"q":"Das Vorliek der Fock wirft Falten. Welches ist die häufigste Ursache?","a":"Das Fall ist nicht genügend durchgesetzt.","e":"Falten am Vorliek zeigen zu wenig Fallspannung. Mehr Spannung glättet das Vorliek und zieht den Bauch nach vorn."},{"id":"S48","cat":"Seemannschaft","nr":48,"bogen":14,"q":"Das Unterliek Ihres Vorsegels killt. Was ist die Ursache?","a":"Der Holepunkt der Schot liegt zu weit vorne.","e":"Liegt der Holepunkt zu weit vorn, zieht die Schot zu sehr nach unten und das Unterliek ist zu lose. Nach achtern verschieben."},{"id":"S49","cat":"Seemannschaft","nr":49,"bogen":15,"q":"Das Achterliek Ihres Vorsegels killt. Was ist die Ursache?","a":"Der Holepunkt der Schot liegt zu weit achtern.","e":"Liegt der Holepunkt zu weit hinten, zieht die Schot zu sehr nach hinten und das Achterliek ist zu lose. Nach vorn verschieben."},{"id":"S51","cat":"Seemannschaft","nr":51,"bogen":2,"q":"1. Wann sollte ein Großsegel flach getrimmt sein?\n2. Wie kann ein Großsegel flach getrimmt werden?","a":"1. Bei Starkwind.\n2. Dichtholen von Unterliek- und Vorliekstrecker, Dichtholen der Großschot, Durchsetzen des Großfalls, Spannung des Achterstags erhöhen, Traveller nach Lee","e":"Ein flaches Segel erzeugt weniger Krängung. Alle Strecker und Fall kommen dicht, Traveller nach Lee."},{"id":"S52","cat":"Seemannschaft","nr":52,"bogen":11,"q":"Mit welchen 6 Teilen des laufenden und stehenden Guts können Sie ein Großsegel trimmen?","a":"Großschot, Traveller, Unterliekstrecker, Cunninghamstrecker, Großfall, Achterstagspanner.","e":"Diese sechs Trimmmittel beeinflussen Profil, Twist und Anstellwinkel des Großsegels. Die Prüfung verlangt genau diese sechs."},{"id":"S53","cat":"Seemannschaft","nr":53,"bogen":12,"q":"Wozu dienen \"Opferanoden\" und wann sollten sie ausgewechselt werden?","a":"Sie dienen dem Schutz gegen Schäden durch Elektrolyse. Anoden müssen nach einer Saison ersetzt werden, nicht erst wenn sie verbraucht sind.","e":"Anoden bestehen aus unedlerem Metall (meist Zink) und opfern sich anstelle von Propeller und Welle. Ohne sie greift Korrosion teure Teile an."},{"id":"S54","cat":"Seemannschaft","nr":54,"bogen":9,"q":"Wie schützt man auf Kunststoffyachten den Propeller gegen Elektrolyse?","a":"Durch eine Zinkanode auf der Propellerwelle.","e":"Die Zinkanode auf der Welle schützt den Propeller. Sie sollte regelmäßig geprüft und ersetzt werden."},{"id":"S55","cat":"Seemannschaft","nr":55,"bogen":1,"q":"Welche Sicherheitsmaßnahmen sind vor und beim Tanken von Diesel zu treffen?","a":"1. Maschine aus,\n2. Feuer aus (Rauchen einstellen),\n3. Maßnahmen gegen Überlaufen treffen.","e":"Diesel ist weniger explosiv als Benzin, aber trotzdem brennbar. Übergelaufener Diesel verschmutzt zudem das Wasser."},{"id":"S57","cat":"Seemannschaft","nr":57,"bogen":3,"q":"Wozu dient das Wendegetriebe eines Motors?","a":"1. Zum Ein- und Auskuppeln des Propellers,\n2. zum Umsteuern des Propellers auf Rückwärtsfahrt,\n3. zur Drehzahluntersetzung.","e":"Das Wendegetriebe verbindet Motor und Welle. Es erlaubt Leerlauf, Vorwärts und Rückwärts sowie eine günstigere Drehzahl."},{"id":"S58","cat":"Seemannschaft","nr":58,"bogen":13,"q":"Welche Maßnahmen sind vor dem Anlassen eines eingebauten Motors zu treffen?","a":"1. Hauptstromschalter einschalten,\n2. Kraftstoff- und Kühlwasserventile öffnen,\n3. Getriebe auf \"neutral\" stellen","e":"Strom an, Ventile auf, Getriebe neutral – sonst startet der Motor nicht oder das Boot fährt ungewollt los."},{"id":"S59","cat":"Seemannschaft","nr":59,"bogen":14,"q":"Was sollte nach dem Anlassen der Maschine kontrolliert werden?","a":"1. Kühlwasserdurchlauf,\n2. Öldruck und Ladung,\n3. Motorengeräusche\n4. Auspuffgase","e":"Kommt kein Kühlwasser aus dem Auspuff, überhitzt der Motor schnell. Das ist die wichtigste Kontrolle nach dem Start."},{"id":"S60","cat":"Seemannschaft","nr":60,"bogen":2,"q":"Was können erste Störungsanzeichen im Motorbetrieb sein?","a":"1. Ungewöhnliche Motorengeräusche / Vibrationen,\n2. Verfärbung der Abgase,\n3. Aufleuchten der Kontrollleuchten (Ladekontrolle bzw. Öldruckkontrolle) und\n4. die entsprechenden akustischen Warnungen.","e":"Veränderte Geräusche, Rauch und Warnleuchten zeigen Probleme früh an. Wer darauf achtet, kann Schäden vermeiden."},{"id":"S61","cat":"Seemannschaft","nr":61,"bogen":4,"q":"Wie können Sie einen Dieselmotor abstellen, wenn die vorgesehene Abstellvorrichtung defekt ist?","a":"1. Kraftstoffzufuhr unterbrechen.\n2. Verschließen des Luftansaugrohres","e":"Ein Diesel braucht Kraftstoff und Luft. Fehlt eines davon, geht er aus."},{"id":"S62","cat":"Seemannschaft","nr":62,"bogen":5,"q":"Der Dieselmotor Ihres Bootes startet nicht. Welche Fehler, die Sie selber überprüfen können, könnten die Ursache sein?","a":"1. Anlasserdrehzahl zu gering (Batterie zu schwach),\n2. kein Kraftstoff im Tank,\n3. Luft in der Kraftstoffleitung,\n4. falsche Bedienung der Kaltstarthilfe (eventuell Vorglühen zu kurz),\n5. Anlasser defekt.","e":"Die meisten Startprobleme haben einfache Ursachen: schwache Batterie, leerer Tank oder Luft in der Leitung. Diese kann man selbst prüfen."},{"id":"S63","cat":"Seemannschaft","nr":63,"bogen":15,"q":"Der Motor Ihres Bootes bleibt beim Einkuppeln stehen. Nennen Sie mögliche Ursachen.","a":"1. Propellerwelle blockiert (z.B. Tauwerk)\n2. Schwerlauf des Getriebes wegen defekter Teile\n3. verbogene Propellerwelle.","e":"Blockiert der Propeller, würgt der Motor beim Einkuppeln ab. Häufigste Ursache: Leine im Propeller."},{"id":"S64","cat":"Seemannschaft","nr":64,"bogen":10,"q":"Während Sie unter Maschine laufen, steigt plötzlich die Kühlwassertemperatur stark an. Ihre Yacht ist mit einem Saildrive-Antrieb ausgestattet.\n1. Welche typische Ursache hat der Temperaturanstieg, wenn eine technische Störung unwahrscheinlich ist?\n2. Wie können Sie die Störung einfach beheben?","a":"1. Fremdkörper haben den Kühlwassereinlass verstopft.\n2. Mehrmals abwechselnd vor- und zurückfahren, sodass sich die Fremdkörper vom Kühlwassereinlass lösen.","e":"Beim Saildrive liegt der Wassereinlass im Unterwasserteil. Plastiktüten oder Seegras können ihn verstopfen und lassen sich durch Vor- und Zurückfahren lösen."},{"id":"S67","cat":"Seemannschaft","nr":67,"bogen":4,"q":"Mit welchen 4 Angaben werden Propeller auf Yachten beschrieben?","a":"1. Anzahl der Flügel,\n2. Größe ihrer Fläche,\n3. Durchmesser\n4. Steigung.","e":"Diese vier Angaben bestimmen, wie viel Schub der Propeller erzeugt. Die Steigung ist der Weg pro Umdrehung."},{"id":"S70","cat":"Seemannschaft","nr":70,"bogen":6,"q":"Warum sollten Sie bei seltener Motorbenutzung den eingebauten Tank eines Dieselmotors möglichst voll getankt halten?","a":"Um Kondenswasserbildung zu verringern, was zu Startschwierigkeiten führen kann.","e":"In einem halbvollen Tank kondensiert Wasser an den Wänden. Wasser im Diesel führt zu Startproblemen und Korrosion."},{"id":"S71","cat":"Seemannschaft","nr":71,"bogen":11,"q":"Welche Motor-Ersatzteile bzw.Schmierstoffe sollten Sie mindestens an Bord haben?","a":"1. Impeller für die Wasserpumpe,\n2. Reservekeilriemen,\n3. Motorenöl,\n4. Dichtungsmaterial.","e":"Der Impeller ist ein Verschleißteil der Kühlwasserpumpe. Fällt er aus, überhitzt der Motor – deshalb immer Ersatz an Bord."},{"id":"S72","cat":"Seemannschaft","nr":72,"bogen":5,"q":"1. Was bedeutet die Angabe einer Batteriekapazität \"2 x 60 Ah\"? (Begründung!)\n2. Welche Nettokapazität steht in dem Fall zur Verfügung?(Begründung!)","a":"1. Es handelt sich um 2 Batterien (Akkus) mit jeweils 60 Amperestunden, insgesamt also 120 Ah Nennkapazität.\n2. Dem entspricht eine Nettokapazität von etwa 72 Ah, da ein Akku kaum über 80 % seiner Nennkapazität geladen werden kann.","e":"Batterien nutzt man nur zwischen etwa 20 % und 80 % ihrer Nennkapazität, um sie nicht zu schädigen. Also bleiben rund 60 % = 72 Ah nutzbar."},{"id":"S73","cat":"Seemannschaft","nr":73,"bogen":10,"q":"Geben Sie die benötigte Strommenge (in Amperestunden) an, um bei einer 12-Volt- Anlage zwei Verbraucher mit je 24 Watt 10 Stunden betreiben zu können (mit Angabe der Berechnung)!","a":"Benötigte Strommenge je Verbraucher: Ampere = W/V -> 24: 12 = 2 Ampere mal Anzahl der Verbraucher mal Stunden ergibt: 2 x 2 A x 10 h = 40 Ah.","e":"Formel: Strom (A) = Leistung (W) ÷ Spannung (V). Dann mal Anzahl und Stunden – diese Rechnung kommt in der Prüfung oft."},{"id":"S75","cat":"Seemannschaft","nr":75,"bogen":8,"q":"Wodurch können Sie verhindern, dass Festmacherleinen durch Schamfilen in Klüsen oder an Kanten an der Pier beschädigt werden?","a":"Durch einen gegen Verrutschen gesicherten Plastikschlauch, der über den Festmacher an der Scheuerstelle gezogen wird, hilfsweise mit Tuchstreifen.","e":"Schamfilen heißt Durchscheuern. Ein Schlauch über der Leine schützt sie an scharfen Kanten."},{"id":"S76","cat":"Seemannschaft","nr":76,"bogen":12,"q":"Was müssen Sie hinsichtlich der Festigkeit bedenken, wenn Sie Leinen zusammenknoten?","a":"Es können Festigkeitsverluste bis zu 50 % auftreten.","e":"Knoten schwächen eine Leine stark. Spleiße sind besser, weil sie kaum Festigkeit verlieren."},{"id":"S78","cat":"Seemannschaft","nr":78,"bogen":13,"q":"Wie sind längsseits liegende Fahrzeuge festzumachen? Ergänzen Sie die Skizze und benennen Sie die Leinen.","a":"1. Achterleine,\n2. Achterspring,\n3. Vorspring,\n4. Vorleine. (plus Fender)","e":"Vor- und Achterleine halten das Boot an der Pier, die Springs verhindern das Vor- und Zurückrutschen. Fender schützen den Rumpf.","qs":"s78q","as_":"s78a"},{"id":"S79","cat":"Seemannschaft","nr":79,"bogen":3,"q":"Wie können Sie mit Hilfe von zwei Fendern und einem Fenderbrett Ihr Boot festmachen, wenn die Pier mit vorspringenden Pfählen versehen ist? Ergänzen Sie die Skizze mit Leinen.","a":"Die Musterantwort besteht nur aus der ergänzten Skizze: Fenderbrett waagerecht außen vor die Pfähle, zwei Fender zwischen Brett und Bordwand, dazu Vor- und Achterleine sowie Vor- und Achterspring.","e":"Die Fender würden zwischen den Pfählen durchrutschen. Das Fenderbrett liegt außen quer vor den Pfählen, die Fender hängen zwischen Brett und Rumpf; Vor-, Achterleine und Springs halten das Boot wie gewohnt.","qs":"s79q","as_":"s79a"},{"id":"S80","cat":"Seemannschaft","nr":80,"bogen":4,"q":"Was ist an Land beim Reinigen eines mit Antifouling behandelten Unterwasserschiffes zu beachten?","a":"Umweltschutzbestimmungen beachten, d. h., das Schiff nur auf einem entsprechend ausgerüsteten Reinigungsplatz abspritzen und Wasser und Schmutz auffangen, also nicht in die Kanalisation leiten.","e":"Antifouling enthält Gifte, die Bewuchs verhindern. Beim Abspritzen gelangen sie sonst ins Grundwasser."},{"id":"S81","cat":"Seemannschaft","nr":81,"bogen":6,"q":"Ein funktionsfähiges elektrisches Gerät arbeitet an Bord nicht. Nennen Sie häufige Ursachen und was kann zur Behebung getan werden?","a":"1. Schlechte Kontakte und Korrosion.\n2. Kontakte fest anziehen, korrodierte Stellen mit feinstem Schleifpapier säubern, Kontaktspray verwenden.","e":"Salzhaltige, feuchte Luft lässt Kontakte oxidieren – der Übergangswiderstand steigt, das Gerät bekommt zu wenig Strom. Erst Sicherung und Stecker prüfen, bevor man das Gerät für defekt hält."},{"id":"S83","cat":"Seemannschaft","nr":83,"bogen":10,"q":"Welche Daten sollten mindestens an Bord im Logbuch dokumentiert werden?","a":"1. Namen und Funktionen der Crewmitglieder,\n2. Beginn und Ende einer Fahrt\n3. in Zeitabständen: Position, Kurs, Geschwindigkeit, Strömung, Wetter, Luftdruck.","e":"Das Logbuch ist Urkunde und Navigationshilfe zugleich. Fällt die Elektronik aus, ist der letzte Logbucheintrag der Startpunkt fürs Koppeln."},{"id":"S84","cat":"Seemannschaft","nr":84,"bogen":14,"q":"Worauf müssen Sie vor dem Setzen des Großsegels achten? Welche Gefahr besteht nach dem Setzen des Großsegels, solange der Wind von vorne kommt?","a":"Großschot und Baumniederholer müssen ausreichend Lose haben. Das Großfall muss frei laufen und darf nicht vertörnt sein. Verletzungsgefahr durch schlagenden Großbaum.","e":"Das Groß muss frei hochgehen können. Beim Setzen im Wind schlägt der Baum hin und her und kann Crewmitglieder verletzen."},{"id":"S85","cat":"Seemannschaft","nr":85,"bogen":15,"q":"Was tun Sie, wenn Ihr Großsegel unter der untersten Lattentasche einreißt?","a":"1. Untere Latte entfernen.\n2. Segel bis über den Riss reffen.","e":"Die Latte würde das Segel weiter aufreißen. Durch Reffen kommt der Riss aus dem Wind."},{"id":"S86","cat":"Seemannschaft","nr":86,"bogen":1,"q":"Beschreiben Sie die Schritte für den Reffvorgang mit dem Bindereff.","a":"1. Sicherstellen, dass Dirk angeschlagen oder Baum durch stützenden Baumniederholer in der Höhe gehalten wird,\n2. Fall fieren und Segel etwas herunterholen,\n3. Segelhals in Reffhaken am Lümmelbeschlag einhaken und festsetzen,\n4. Fall wieder dichtholen,\n5. Segelschothorn mit Reffleine nach achtern auf den Baum holen\n6. Loses Segeltuch mit Reffbändseln einbinden","e":"Reffen heißt: Segelfläche verkleinern. Die Reihenfolge ist wichtig, damit der Baum nicht herunterfällt und das Segel sauber liegt."},{"id":"S87","cat":"Seemannschaft","nr":87,"bogen":7,"q":"1. Wozu dient ein \"Bullenstander\"?\n2. Wie wird er gefahren?","a":"1. Er soll das ungewollte Überkommen des Großbaums bei achterlichen Winden verhindern.\n2. Von der Baumnock zum Vorschiff","e":"Der Bullenstander verhindert eine Patenthalse. Er führt von der Baumnock nach vorn und hält den Baum auf seiner Seite."},{"id":"S91","cat":"Seemannschaft","nr":91,"bogen":11,"q":"Sie sind mit Ihrer Segelyacht auf See. Was veranlassen Sie bei einem Gewitteraufzug?","a":"1. Vorsegel rechtzeitig verkleinern,\n2. Großsegel klar zum Reffen oder Bergen,\n3. Schlechtwetterkleidung, Sicherheitsgurte und Rettungswesten anlegen,\n4. Position in Karte eintragen.","e":"Gewitter bringen plötzliche starke Böen. Man sollte rechtzeitig reffen und sich sichern."},{"id":"S92","cat":"Seemannschaft","nr":92,"bogen":12,"q":"Sie übernehmen in einem Hafen eine Ihnen unbekannte Yacht. Wie machen Sie sich zu Reisebeginn mit den Segeleigenschaften vertraut?","a":"Ich fahre diverse Manöver - Wende, Halse, Q- Wende, verschiedene Rettungsmanöver - mit unterschiedlicher Geschwindigkeit und Besegelung.","e":"Wendekreis, Radeffekt, Luvgierigkeit und Verhalten bei Böen unterscheiden sich von Boot zu Boot. Besser man lernt das auf freiem Wasser als im engen Hafen."},{"id":"S93","cat":"Seemannschaft","nr":93,"bogen":6,"q":"Wie verhalten Sie sich nach einem Mastbruch, was müssen Sie veranlassen?","a":"1. Nach Möglichkeit den Mast an Bord nehmen und sichern.\n2. Falls nicht möglich, Mast und Wanten kappen, um Rumpfschäden zu vermeiden.","e":"Ein treibender Mast kann den Rumpf beschädigen. Wenn er nicht geborgen werden kann, muss er abgeschnitten werden."},{"id":"S94","cat":"Seemannschaft","nr":94,"bogen":4,"q":"Von welchen Faktoren ist die Länge eines Nahezu-Aufschießers zu einer im Wasser treibenden Person abhängig?","a":"Geschwindigkeit, Wind, Seegang, Strömung und Form und Gewicht des Bootes.","e":"Beim Nahezu-Aufschießer soll das Boot genau bei der Person zum Stehen kommen. Ein schweres Boot läuft deutlich weiter aus als ein leichtes – das sollte man vorher geübt haben."},{"id":"S97","cat":"Seemannschaft","nr":97,"bogen":8,"q":"Welchen Nachteil hat ein \"Saildrive-Antrieb\" insbesondere bei Hafenmanövern?","a":"Durch den großen Abstand zwischen Propeller und Ruder wird dieses nicht direkt angeströmt. Das kann die Manövrierfähigkeit beim Anfahren etwas verschlechtern.","e":"Beim Saildrive sitzt der Propeller weit vor dem Ruder. Das Ruder bekommt daher bei langsamer Fahrt weniger Anströmung."},{"id":"S98","cat":"Seemannschaft","nr":98,"bogen":13,"q":"Was ist ein Bugstrahlruder und wozu dient es?","a":"Eine im Bug einer Yacht befindliche Röhre mit einem Propeller, mit dem ein Querschub und damit ein Drehen des Buges bei geringen Vorausgeschwindigkeiten erreicht werden kann.","e":"Ein Bugstrahlruder schiebt den Bug seitlich, ohne dass das Boot Fahrt braucht. Das hilft beim Manövrieren im Hafen."},{"id":"S100","cat":"Seemannschaft","nr":100,"bogen":7,"q":"Sie liegen längsseits mit der Steuerbordseite an einer Pier. Beschreiben Sie ein Ablegemanöver unter gleichzeitigem Einsatz von Bugstrahlruder und Maschine.","a":"1. Hebel für Bugstrahlruder nach Backbord legen, sodass der Bug von der Pier weggedrückt wird (nach Backbord schwenkt) und gleichzeitig\n2. Ruderlage deutlich nach Steuerbord und langsame Fahrt voraus, sodass das Heck nach Backbord ausschwenkt. So wird das Schiff fast parallel von der Pier abgedrückt.","e":"Bugstrahlruder drückt den Bug weg, Maschine mit Ruder drückt das Heck weg. So löst sich das Boot parallel von der Pier."},{"id":"S101","cat":"Seemannschaft","nr":101,"bogen":3,"q":"Wie können Sie im freien Seeraum auf einer Segelyacht einen Sturm abwettern?","a":"1. Passiv durch Beiliegen; Lenzen vor Topp und Takel, dabei Leinen achteraus schleppen; Liegen vor Treibanker oder\n2. Aktiv unter Sturmbesegelung segelnd und nach Möglichkeit brechende Seen aussteuernd.","e":"Beiliegen und Treibanker halten das Boot ruhig und schonen die Crew; Lenzen vor Topp und Takel mit geschleppten Leinen bremst die Fahrt vor dem Wind. Aktives Segeln verlangt eine ausgeruhte, erfahrene Crew, bietet aber die meiste Kontrolle."},{"id":"S102","cat":"Seemannschaft","nr":102,"bogen":10,"q":"Warum kann das Anlaufen eines Hafens bei auflandigem Starkwind bzw. schwerem Wetter gefährlich werden?","a":"Gefahr durch Grundseen und. Kreuzseen. Möglichkeit von Querstrom.","e":"Wo die Wassertiefe vor der Hafeneinfahrt abnimmt, werden Wellen steiler und brechen (Grundseen). Von Molen reflektierte Wellen bilden zusätzlich Kreuzseen – oft ist es sicherer, auf See abzuwettern."},{"id":"S103","cat":"Seemannschaft","nr":103,"bogen":14,"q":"Warum kann eine Leeküste bei schwerem Wetter einer Segelyacht gefährlich werden?","a":"Wenn die Yacht sich nicht freikreuzen kann, droht Strandung.","e":"Bei Sturm verliert eine Segelyacht viel Höhe durch Abdrift und kann gegen Wind und Welle kaum Raum gewinnen. Deshalb plant man bei schlechter Prognose immer genügend Seeraum in Lee ein."},{"id":"S104","cat":"Seemannschaft","nr":104,"bogen":5,"q":"Mit welchem Manöver können Sie bei Starkwind das Halsen vermeiden (Name)? Vervollständigen Sie die Skizze durch Einzeichnen der Kurslinie und geben Sie die erforderlichen Manöver an.","a":"Q-Wende.","e":"Statt vor dem Wind zu halsen, luvt man an, wendet und fällt auf dem anderen Bug wieder bis zum Zielkurs ab – das Boot dreht also fast 270° statt 90°. So schlägt der Baum nie unkontrolliert über.","qs":"s104q","as_":"s104a"},{"id":"S105","cat":"Seemannschaft","nr":105,"bogen":15,"q":"Was erreicht man mit dem Ausbringen eines Treibankers bei schwerer See?","a":"1. Bei richtiger Leinenlänge: Halten des Bugs im Wind\n2. Verringerung der Driftgeschwindigkeit.","e":"Ein Treibanker ist ein Fallschirm im Wasser, der am Bug ausgebracht wird. Die Leinenlänge sollte so gewählt sein, dass Boot und Treibanker gleichzeitig auf Wellenkämmen liegen."},{"id":"S106","cat":"Seemannschaft","nr":106,"bogen":5,"q":"Worauf müssen Sie achten, wenn Sie in Tidengewässern längsseits einer Pier festgemacht haben?","a":"1. Die Wassertiefe muss auch bei Niedrigwasser ausreichen oder sicheres Aufsetzen muss gewährleistet sein.\n2. Die Leinen müssen für den Tidenstieg oder - fall ausreichend lang sein. Bei größerem Tidenhub darf das Fahrzeug keinesfalls unbeaufsichtigt bleiben.","e":"Bei 3 m Tidenhub muss die Leine mehrere Meter nachgeben können. Zu kurze Leinen können das Boot bei Niedrigwasser aufhängen oder bei Hochwasser unter die Pier ziehen."},{"id":"S107","cat":"Seemannschaft","nr":107,"bogen":11,"q":"Sie kreuzen bei frischem Wind und mitlaufendem Strom (Wind gegen Strom) nach Luv auf. Welche Auswirkungen hat ein gegen den Wind setzender Strom auf den Seegang?","a":"Durch den Strom entsteht eine kurze, steile und kabbelige See.","e":"Der Strom staucht die Wellen: Wellenlänge sinkt, Höhe steigt. Solche Seen können Kreuzen gegen die Welle sehr unangenehm machen – oft lohnt es, auf den Stromwechsel zu warten."},{"id":"S108","cat":"Seemannschaft","nr":108,"bogen":9,"q":"Wie wirkt sich mitlaufender Strom auf die Fahrt eines Fahrzeugs und die Loganzeige aus?","a":"1. Der Strom erhöht die Fahrt über Grund.\n2. Das Log zeigt dies nicht an.","e":"Das Log misst nur relativ zum Wasser. Die Differenz zwischen Log- und GPS-Fahrt zeigt dir direkt die Stromkomponente in Fahrtrichtung."},{"id":"S109","cat":"Seemannschaft","nr":109,"bogen":1,"q":"Welche Hilfsmittel können Sie einsetzen, um einen Überbordgefallenen an Deck zu bekommen?","a":"Badeleiter, Großschot, Großbaum, Trittschlinge, kleines Berge-Segel, Bergegurt, Dingi, Rettungstalje","e":"Eine erschöpfte Person in nasser Kleidung ist sehr schwer – oft zu schwer, um sie mit Muskelkraft über die Bordwand zu ziehen. Talje oder Großschot mit dem Baum als Kran vervielfachen die Kraft."},{"id":"S110","cat":"Seemannschaft","nr":110,"bogen":2,"q":"Welche Sofortmaßnahmen sind einzuleiten, wenn jemand über Bord gefallen ist?","a":"1. Ruf \"Mensch über Bord!\"\n2. Rettungsmittel zuwerfen,\n3. Ausguck halten, Mensch im Auge behalten,\n4. MOB-Taste drücken,\n5. Maschine starten,\n6. \"Mensch-über-Bord-Manöver\" einleiten,\n7. Notmeldung abgeben,\n8. Bergung durchführen.","e":"In den ersten Sekunden entscheidet sich, ob man die Person wiederfindet. Ein Crewmitglied sollte nur die Aufgabe haben, ständig auf die Person zu zeigen."},{"id":"S111","cat":"Seemannschaft","nr":111,"bogen":8,"q":"Welche Maßnahmen können gegen das Überbordfallen getroffen werden?","a":"1. Sicherheitsgurte anlegen und einpicken.\n2. Anbringen von \"Streck-\" oder Laufleinen vom Bug zum Heck.\n3. Crew auf Befestigungspunkte hinweisen. (Einpickpunkte für Karabinerhaken)","e":"Die meisten MOB-Unfälle passieren beim Arbeiten an Deck oder beim Pinkeln über die Reling. Einpicken bei Nacht, Seegang und allein an Deck sollte Standard sein."},{"id":"S112","cat":"Seemannschaft","nr":112,"bogen":9,"q":"Nennen Sie die grundsätzlichen Schritte und ihre Ziele zur Rettung einer über Bord gegangenen Person.","a":"1. Ruf \"Mensch über Bord\" -> Absolute Aufmerksamkeit/ Handlungsbereitschaft der Crew herstellen\n2. Maschine starten -> Handlungsmöglichkeit herstellen\n3. Suche -> Herstellung eines Sichtkontaktes zur über Bord gegangenen Person,\n4. MOB-Taste drücken / Position markieren -> Bezugspunkt der Person sichern\n5. \"Mensch-über-Bord-Manöver\" -> Annäherung an die im Wasser treibende Person und Herstellung einer ersten Leinenverbindung,\n6. Bergung -> sicheres und schnelles Anbordnehmen der Person,\n7. Erste Hilfe -> medizinische und psychologische Betreuung,","e":"Jeder Schrit
