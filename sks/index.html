<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SKS Kartei</title>
<meta name="theme-color" content="#12263a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SKS Kartei">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f4f8fb; --card:#ffffff; --ink:#12263a; --muted:#5a6b7c; --shoal:#d6e7f2; --shoal2:#eaf3f9;
  --line:#c5d5e1; --magenta:#b1216f; --magenta-bg:#fbeef5; --port:#c8102e; --stbd:#0f8049; --yellow:#c98f00;
  --done:#12263a; --work:#6fa6cc; --new:#dde7ef;
  --ui:"Barlow Semi Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --text:"Source Serif 4", Georgia, "Times New Roman", serif;
  --r:10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#08121d; --card:#0f1e2d; --ink:#e4ecf3; --muted:#91a4b6; --shoal:#18314a; --shoal2:#12263a;
    --line:#223a50; --magenta:#e56aa9; --magenta-bg:#2a1424; --port:#f0625e; --stbd:#3cc486; --yellow:#f0c04a;
    --done:#cfe0ee; --work:#3f7aa6; --new:#1b2e40; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#08121d; --card:#0f1e2d; --ink:#e4ecf3; --muted:#91a4b6; --shoal:#18314a; --shoal2:#12263a;
  --line:#223a50; --magenta:#e56aa9; --magenta-bg:#2a1424; --port:#f0625e; --stbd:#3cc486; --yellow:#f0c04a;
  --done:#cfe0ee; --work:#3f7aa6; --new:#1b2e40; color-scheme: dark;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); -webkit-text-size-adjust:100%; }
body{ margin:0; background:var(--paper); color:var(--ink); font-family:var(--ui); font-size:17px; line-height:1.4; min-height:100%; }
button,select,input{ font:inherit; color:inherit; }
button{ cursor:pointer; -webkit-tap-highlight-color:transparent; }
:focus-visible{ outline:3px solid var(--magenta); outline-offset:2px; }
.wrap{ max-width:640px; margin:0 auto; padding:0 16px 32px; }
[hidden]{ display:none !important; }

/* top bar */
.bar{ position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--paper); display:flex; align-items:center; gap:10px; padding:10px 0; }
.bar h1{ font-size:22px; font-weight:700; margin:0; letter-spacing:.01em; flex:1; }
.bar h1 small{ font-weight:500; color:var(--muted); font-size:15px; margin-left:6px; }
.iconbtn{ width:40px; height:40px; border-radius:50%; border:1px solid var(--line); background:var(--card); display:grid; place-items:center; flex:none; }
.iconbtn svg{ width:20px; height:20px; }

/* overview matrix */
.chart{ background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:14px 14px 12px; margin:6px 0 18px; position:relative; }
.chart::after{ content:""; position:absolute; inset:4px; border:1px solid var(--line); border-radius:7px; pointer-events:none; opacity:.6; }
.chart-head{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; flex-wrap:wrap; }
.chart-head b{ font-size:19px; }
.chart-head span{ color:var(--muted); font-size:15px; }
.legend{ display:flex; gap:14px; font-size:14px; color:var(--muted); margin:8px 0 10px; flex-wrap:wrap; }
.legend i{ display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:-1px; }
.mx-group{ margin-top:6px; }
.mx-label{ font-size:14px; color:var(--muted); display:flex; justify-content:space-between; margin-bottom:3px; }
.mx{ display:grid; grid-template-columns:repeat(auto-fill, minmax(8px,1fr)); gap:2px; }
.mx button{ aspect-ratio:1; border:0; padding:0; border-radius:2px; background:var(--new); min-width:0; }
.mx button.w{ background:var(--work); }
.mx button.d{ background:var(--done); }
.mx button.x{ box-shadow:inset 0 0 0 2px var(--port); }

/* segmented */
.seg{ display:grid; grid-template-columns:1fr 1fr; background:var(--shoal2); border:1px solid var(--line); border-radius:999px; padding:3px; margin-bottom:14px; }
.seg button{ border:0; background:transparent; border-radius:999px; padding:8px 0; font-weight:600; color:var(--muted); }
.seg button[aria-selected="true"]{ background:var(--card); color:var(--ink); box-shadow:0 1px 0 var(--line); }

/* deck tiles */
.tiles{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.tile{ background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:10px 10px 9px; text-align:left; display:flex; flex-direction:column; gap:6px; min-height:86px; }
.tile .n{ font-size:28px; font-weight:700; line-height:1; }
.tile .n small{ font-size:14px; font-weight:500; color:var(--muted); margin-right:3px; }
.tile .s{ font-size:13px; color:var(--muted); }
.tile.complete{ border-color:var(--done); }
.pbar{ display:flex; height:6px; border-radius:3px; overflow:hidden; background:var(--new); }
.pbar i{ display:block; height:100%; }
.pbar .d{ background:var(--done); } .pbar .w{ background:var(--work); }
.rows{ display:flex; flex-direction:column; gap:8px; }
.row{ background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:12px 14px; text-align:left; display:grid; grid-template-columns:1fr auto; gap:6px 12px; align-items:center; }
.row .t{ font-size:19px; font-weight:600; }
.row .s{ color:var(--muted); font-size:14px; text-align:right; }
.row .pbar{ grid-column:1/-1; }
.more{ margin-top:20px; display:flex; flex-direction:column; gap:8px; }
.more .row .t{ font-size:17px; }
.today{ color:var(--muted); font-size:14px; text-align:center; margin-top:18px; }

/* study */
#study:not([hidden]){ display:flex; flex-direction:column; min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)); }
#study .rate, #study .flipbtn{ margin-top:auto; }
#study .cardwrap{ margin-bottom:12px; }
.study-top{ display:flex; align-items:center; gap:10px; padding:10px 0 6px; }
.study-top .title{ flex:1; min-width:0; }
.study-top .title b{ display:block; font-size:18px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.study-top .title span{ font-size:14px; color:var(--muted); }
.qbar{ height:4px; background:var(--new); border-radius:2px; overflow:hidden; margin-bottom:12px; }
.qbar i{ display:block; height:100%; background:var(--magenta); transition:width .25s; }
.cardwrap{ perspective:1400px; }
.fcard{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 18px 18px; position:relative; min-height:300px; transform-origin:50% 50%; }
.fcard::after{ content:""; position:absolute; inset:5px; border:1px solid var(--line); border-radius:10px; pointer-events:none; opacity:.7; }
.fcard.flipout{ transition:transform .16s ease-in; transform:rotateY(90deg); }
.fcard.flipin{ transform:rotateY(-90deg); }
.fcard.flipdone{ transition:transform .18s ease-out; transform:rotateY(0); }
@media (prefers-reduced-motion: reduce){ .fcard.flipout,.fcard.flipdone{ transition:none; } .fcard.flipin{ transform:none; } }
.meta{ display:flex; justify-content:space-between; align-items:center; font-size:14px; color:var(--muted); margin-bottom:14px; position:relative; z-index:1; }
.meta .cat{ font-weight:600; color:var(--ink); }
.dots{ display:inline-flex; gap:4px; align-items:center; margin-left:8px; }
.dots i{ width:8px; height:8px; border-radius:50%; border:1.5px solid var(--stbd); }
.dots i.on{ background:var(--stbd); }
.q{ font-family:var(--text); font-size:21px; line-height:1.45; margin:0; }
.q.small{ font-size:16px; color:var(--muted); line-height:1.45; }
.txt p{ margin:0 0 6px; }
.txt .li{ display:grid; grid-template-columns:1.6em 1fr; margin:0 0 6px; }
.tap{ margin-top:22px; color:var(--muted); font-size:15px; text-align:center; }
.sk{ margin:14px 0 4px; }
.sk svg{ width:100%; height:auto; max-height:260px; display:block; color:var(--ink); }
.sk figcaption{ font-size:12px; color:var(--muted); margin-top:4px; }
.ans{ margin-top:14px; border-top:1px solid var(--line); padding-top:12px; }
.lab{ font-size:13px; font-weight:700; letter-spacing:.02em; color:var(--muted); margin-bottom:6px; display:flex; align-items:center; gap:6px; }
.ans .txt{ font-family:var(--text); font-size:18px; line-height:1.5; }
.expl{ margin-top:16px; background:var(--magenta-bg); border-left:3px solid var(--magenta); border-radius:0 8px 8px 0; padding:10px 12px 12px; }
.expl .lab{ color:var(--magenta); }
.expl .txt{ font-family:var(--text); font-size:16px; line-height:1.5; }
.expl-toggle{ margin-top:14px; border:1px dashed var(--magenta); color:var(--magenta); background:transparent; border-radius:8px; padding:8px 12px; width:100%; font-weight:600; }
.rate{ position:sticky; bottom:0; padding:12px 0 calc(10px + env(safe-area-inset-bottom,0px)); background:linear-gradient(to top, var(--paper) 75%, transparent); display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:6px; }
.rate button{ border:0; border-radius:12px; padding:12px 4px 10px; font-weight:700; font-size:18px; color:#fff; display:flex; flex-direction:column; align-items:center; gap:1px; }
.rate button small{ font-weight:500; font-size:12px; opacity:.9; }
.rate .no{ background:var(--port); } .rate .part{ background:var(--yellow); color:#1c1400; } .rate .full{ background:var(--stbd); }
:root[data-theme="dark"] .rate .full, :root[data-theme="dark"] .rate .no{ color:#08121d; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .rate .full, :root:not([data-theme="light"]) .rate .no{ color:#08121d; } }
.flipbtn{ position:sticky; bottom:0; padding:12px 0 calc(10px + env(safe-area-inset-bottom,0px)); background:linear-gradient(to top, var(--paper) 75%, transparent); margin-top:6px; }
.flipbtn button{ width:100%; border:0; border-radius:12px; padding:14px; font-weight:700; font-size:18px; background:var(--ink); color:var(--paper); }
.undo{ border:0; background:transparent; color:var(--muted); font-size:15px; padding:6px 8px; text-decoration:underline; text-underline-offset:3px; }
.toast{ position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--paper); padding:10px 16px; border-radius:999px; font-size:15px; z-index:30; max-width:90vw; text-align:center; }

/* summary */
.sum{ text-align:center; padding:30px 0 10px; }
.sum h2{ font-size:26px; margin:0 0 6px; }
.sum p{ color:var(--muted); margin:0 0 18px; }
.sumgrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:18px; }
.sumgrid div{ background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:12px 6px; }
.sumgrid b{ display:block; font-size:28px; }
.sumgrid span{ font-size:14px; color:var(--muted); }
.btn{ display:block; width:100%; border:1px solid var(--line); background:var(--card); border-radius:12px; padding:13px; font-weight:600; font-size:17px; margin-top:8px; text-align:center; }
.btn.primary{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
.btn.danger{ color:var(--port); border-color:var(--port); background:transparent; }

/* list / kartei */
.filters{ display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:10px; scrollbar-width:none; }
.chip{ border:1px solid var(--line); background:var(--card); border-radius:999px; padding:6px 12px; white-space:nowrap; font-size:15px; }
.chip[aria-pressed="true"]{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
.search{ width:100%; border:1px solid var(--line); background:var(--card); border-radius:10px; padding:10px 12px; margin-bottom:10px; }
.list{ display:flex; flex-direction:column; gap:6px; }
.item{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; text-align:left; display:grid; grid-template-columns:auto 1fr; gap:2px 10px; }
.item .id{ font-weight:700; font-size:15px; min-width:3.2em; }
.item .qq{ font-family:var(--text); font-size:15px; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.item .st{ grid-column:2; font-size:13px; color:var(--muted); display:flex; align-items:center; gap:6px; }
.empty{ color:var(--muted); text-align:center; padding:30px 10px; }

/* dialogs */
dialog{ border:0; padding:0; background:transparent; overflow:auto; overscroll-behavior:contain; max-width:640px; width:calc(100% - 24px); max-height:calc(100% - 24px); }
dialog::backdrop{ background:rgba(4,12,20,.55); }
.sheet{ background:var(--paper); color:var(--ink); border-radius:16px; padding:16px 16px 18px; border:1px solid var(--line); }
.sheet h2{ font-size:22px; margin:0 0 4px; }
.sheet h3{ font-size:17px; margin:18px 0 8px; }
.sheet p.hint{ color:var(--muted); font-size:14px; margin:4px 0 8px; }
.sheet .head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
.field{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); }
.field select{ border:1px solid var(--line); background:var(--card); border-radius:8px; padding:6px 8px; }
.inline{ display:flex; gap:8px; }
.inline select{ flex:1; border:1px solid var(--line); background:var(--card); border-radius:10px; padding:10px; }
.inline .btn{ width:auto; margin:0; padding:10px 14px; }
.warn{ background:var(--magenta-bg); color:var(--ink); border-left:3px solid var(--magenta); padding:10px 12px; border-radius:0 8px 8px 0; font-size:15px; margin:8px 0 12px; }
</style>
</head>
<body>
<div class="wrap">

<!-- HOME -->
<section id="home">
  <div class="bar">
    <h1>SKS Kartei</h1>
    <button class="iconbtn" id="openAdmin" aria-label="Einstellungen und Zurücksetzen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
  <div id="storageWarn" class="warn" hidden>Der Browser speichert hier keinen Fortschritt. Öffne die App über ihre Web-Adresse (nicht als lokale Datei), damit dein Lernstand erhalten bleibt.</div>
  <div class="chart" id="overview"></div>
  <div class="seg" role="tablist">
    <button role="tab" id="tabB" aria-selected="true">Bogen für Bogen</button>
    <button role="tab" id="tabC" aria-selected="false">Nach Kategorie</button>
  </div>
  <div id="decksB" class="tiles"></div>
  <div id="decksC" class="rows" hidden></div>
  <div class="more" id="more"></div>
  <div class="today" id="today"></div>
</section>

<!-- STUDY -->
<section id="study" hidden>
  <div class="study-top">
    <button class="iconbtn" id="quitStudy" aria-label="Runde beenden">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="title"><b id="stTitle"></b><span id="stCount"></span></div>
    <button class="undo" id="undoBtn" hidden>Zurück</button>
  </div>
  <div class="qbar"><i id="stBar"></i></div>
  <div class="cardwrap"><article class="fcard" id="fcard" tabindex="0" aria-live="polite"></article></div>
  <div class="flipbtn" id="flipArea"><button id="flipBtn">Karte umdrehen</button></div>
  <div class="rate" id="rateArea" hidden>
    <button class="no" data-r="n">Nicht<small>von vorn</small></button>
    <button class="part" data-r="t">Teilweise<small>nochmal</small></button>
    <button class="full" data-r="v">Voll<small>+1 Serie</small></button>
  </div>
</section>

<!-- SUMMARY -->
<section id="summary" hidden></section>

<!-- KARTEI -->
<section id="kartei" hidden>
  <div class="bar">
    <button class="iconbtn" id="closeKartei" aria-label="Zurück zur Übersicht">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h1>Kartei <small id="kCount"></small></h1>
  </div>
  <input class="search" id="kSearch" type="search" placeholder="Suchen in Fragen und Antworten" autocomplete="off">
  <div class="filters" id="kFilters"></div>
  <div class="filters" id="kCats"></div>
  <div id="kAction"></div>
  <div class="list" id="kList"></div>
</section>
</div>

<dialog id="detail"><div class="sheet" id="detailBody"></div></dialog>
<dialog id="admin"><div class="sheet" id="adminBody"></div></dialog>
<dialog id="confirm"><div class="sheet" id="confirmBody"></div></dialog>

<script type="application/json" id="cardsData">[{"id":"N1","cat":"Navigation","nr":1,"bogen":14,"q":"Worauf müssen Sie als Schiffsführer vor Reiseantritt hinsichtlich der Seekarten und Seebücher achten?","a":"Auf Vollständigkeit der Unterlagen und deren Berichtigung auf den neuesten Stand.","e":"Veraltete Karten sind eine der häufigsten Ursachen für Navigationsfehler: Tonnen werden verlegt, Wracks kommen hinzu, Tiefen ändern sich. Berichtigt wird mit den wöchentlichen Nachrichten für Seefahrer (NfS) des BSH – und zwar für alle Karten und Bücher, die du auf dem Törn brauchen könntest."},{"id":"N2","cat":"Navigation","nr":2,"bogen":3,"q":"Warum muss in der GPS-Navigation das jeweilige Kartendatum unbedingt berücksichtigt werden?","a":"Weil sich das von GPS verwendete Bezugssystem WGS 84 (World Geodetic System 1984) von anderen verwendeten Bezugssystemen (Kartendatum) unterscheiden kann.","e":"Jede Seekarte ist auf ein bestimmtes Modell der Erdform (Kartendatum) bezogen. Trägst du eine WGS‑84‑Position in eine Karte mit anderem Datum ein, kann der Ort um Dutzende bis Hunderte Meter danebenliegen – in engen Revieren entscheidend."},{"id":"N3","cat":"Navigation","nr":3,"bogen":4,"q":"Welche Differenzen können zwischen WGS 84 und anderen Bezugssystemen auftreten?","a":"Differenzen von φ und λ von etwa 20 bis 200 m","e":"Merke dir die Größenordnung 20–200 m. Das klingt wenig, reicht aber, um eine Tonne oder Untiefe auf der falschen Seite zu vermuten."},{"id":"N4","cat":"Navigation","nr":4,"bogen":7,"q":"Wo finden Sie in der Seekarte Angaben über das benutzte Bezugssystem und ggf. entsprechende Korrekturhinweise?","a":"Am Kartenrand unter dem Titel.","e":"Am Kartenrand stehen unter dem Titel alle Metadaten der Karte: Maßstab, Kartendatum, Kartennull, Einheiten – und eben der GPS-Korrekturhinweis. Vor dem Arbeiten mit einer neuen Karte lohnt immer ein Blick dorthin."},{"id":"N5","cat":"Navigation","nr":5,"bogen":8,"q":"Wie lautet ggf. der Korrekturhinweis bezüglich GPS in der Seekarte, wenn das benutzte Kartendatum (z. B. ED 50) und WGS 84 nicht übereinstimmen?","a":"Durch Satellitennavigation (z. B. GPS) erhaltene Positionen im WGS 84 sind 0, ... Minuten nordwärts/südwärts und 0, ... Minuten westwärts/ostwärts zu verlegen, um mit dieser Karte übereinzustimmen.","e":"Der Hinweis gibt konkrete Beträge in Bogenminuten an, um die du die GPS-Position verschieben musst. Alternativ stellst du im GPS-Gerät gleich das Kartendatum der Karte ein – dann entfällt die Rechnung."},{"id":"N6","cat":"Navigation","nr":6,"bogen":5,"q":"Woran erkennen Sie, bis wann eine deutsche Seekarte \"amtlich\" berichtigt ist?","a":"Am Berichtigungsstempel (BSH oder amtliche Seekartenberichtigungsstelle.)","e":"Der Stempel dokumentiert, bis zu welcher NfS-Ausgabe die Karte amtlich berichtigt wurde. Alles danach musst du selbst nachtragen."},{"id":"N7","cat":"Navigation","nr":7,"bogen":11,"q":"Woran erkennen Sie, bis wann eine britische Seekarte \"amtlich\" berichtigt ist?","a":"Am Berichtigungsstempel auf der Rückseite der Seekarte.","e":"Anders als bei deutschen Karten sitzt der Stempel bei britischen Admiralty Charts auf der Rückseite. Er verweist auf die Admiralty Notices to Mariners."},{"id":"N8","cat":"Navigation","nr":8,"bogen":12,"q":"Was bedeutet der Stempel auf der britischen Seekarte: Corrected up to N.T.M. 3595 1998?","a":"Seekarte ist berichtigt bis zur Mitteilung Nummer 3595 der Admiralty Notices to Mariners (N.T.M.) in 1998.","e":"N.T.M. sind die britischen Notices to Mariners, fortlaufend pro Jahr nummeriert. Alle Mitteilungen mit höherer Nummer (oder aus späteren Jahren) sind noch nicht eingearbeitet."},{"id":"N9","cat":"Navigation","nr":9,"bogen":1,"q":"Welche Angaben enthalten die Nachrichten für Seefahrer (NfS)?","a":"Wichtige Maßnahmen, Ereignisse und Veränderungen für die sichere Schiffsführung auf Seeschifffahrtsstraßen, auf Hoher See sowie in den Hoheitsgewässern anderer Staaten","e":"Die NfS sind das zentrale Berichtigungsmedium für deutsche Seekarten und Seebücher. Sie decken nicht nur deutsche Gewässer ab, sondern auch die Hohe See und fremde Hoheitsgewässer."},{"id":"N10","cat":"Navigation","nr":10,"bogen":10,"q":"In welcher Sprache werden die Nachrichten für Seefahrer (NfS) verfasst?","a":"Die Angaben erfolgen in deutscher und in englischer Sprache.","e":"Zweisprachig, damit auch ausländische Schiffsführer sie nutzen können – eine reine Faktenfrage."},{"id":"N11","cat":"Navigation","nr":11,"bogen":13,"q":"Welche Angaben enthalten deutsche und britische Leuchtfeuerverzeichnisse?","a":"Beschreibung der Leuchtfeuer, Feuerschiffe und Großtonnen sowie deren geographische Lage.","e":"Das Leuchtfeuerverzeichnis ergänzt die Karte um Details, die dort keinen Platz haben: Kennung, Tragweite, Sektoren, Feuerhöhe und Bauwerk. Bei der Identifizierung eines Feuers in der Nacht ist es unverzichtbar."},{"id":"N12","cat":"Navigation","nr":12,"bogen":6,"q":"Welche schwimmenden Schifffahrtszeichen werden in der britischen List of Lights und in deutschen Leuchtfeuerverzeichnissen nicht angegeben?","a":"Tonnen < 8 m Höhe.","e":"Kleine Leuchttonnen stehen nicht im Leuchtfeuerverzeichnis; ihre Angaben findest du nur in der Seekarte. Deshalb muss man für nächtliche Fahrten die Karte gründlich durchgehen."},{"id":"N13","cat":"Navigation","nr":13,"bogen":15,"q":"Wo finden Sie Angaben über die Merkmale der Schifffahrtszeichen?","a":"1. Leuchtfeuerverzeichnissen bzw. List of Lights\n2. Karte 1/INT\n3. Schwimmende Schifffahrtszeichen zusätzlich in der Anlage I zur SeeSchStrO","e":"Die Karte 1/INT ist die „Legende“ aller Seekarten. Das Leuchtfeuerverzeichnis liefert die Details der Feuer, die Anlage I der SeeSchStrO das System der schwimmenden Zeichen in deutschen Seeschifffahrtsstraßen."},{"id":"N14","cat":"Navigation","nr":14,"bogen":4,"q":"Worauf beziehen sich die Höhenangaben der Leuchtfeuer in Leuchtfeuerverzeichnissen in der Nord und Ostsee?","a":"Nordsee: mittleres Hochwasser,\nOstsee: mittlerer Wasserstand.","e":"Die Feuerhöhe brauchst du für die Berechnung der Sichtweite (Feuer in der Kimm). In der Nordsee gilt wegen der Gezeiten MHW als Bezug – das ist die ungünstige Annahme, weil bei höherem Wasser das Feuer niedriger erscheint."},{"id":"N15","cat":"Navigation","nr":15,"bogen":14,"q":"Wo finden Sie Angaben über Brückensignale?","a":"In Hafenhandbüchern und Seekarten.","e":"Brückensignale regeln Durchfahrt und Öffnungszeiten beweglicher Brücken. Sie sind lokal unterschiedlich und deshalb im Hafenhandbuch bzw. in der Karte beschrieben."},{"id":"N16","cat":"Navigation","nr":16,"bogen":2,"q":"Welche Themen (Grobgliederung) enthalten die Seehandbücher des BSH?","a":"1. Schifffahrtsangelegenheiten,\n2. Küstenkunde und Segelanweisungen.\n3. Naturverhältnisse,","e":"Die Seehandbücher sind der „Reiseführer“ für ein Seegebiet: Vorschriften, Küstenbeschreibung mit Ansteuerungshinweisen sowie Wetter, Strom und Gezeiten. Ideal für die Törnplanung."},{"id":"N17","cat":"Navigation","nr":17,"bogen":11,"q":"Wie werden Richtungsangaben in nautischen Veröffentlichungen gemacht?","a":"Rechtweisend in Grad, rechtsherum zählend (im Uhrzeigersinn)","e":"Rechtweisend heißt: bezogen auf geografisch Nord, ohne Missweisung oder Ablenkung. Gezählt wird von 000° bis 360° im Uhrzeigersinn."},{"id":"N18","cat":"Navigation","nr":18,"bogen":12,"q":"In welchem Quadranten liegt der rote Warnsektor eines Leitfeuers mit der Angabe rot 030°-042° (Begründung!)","a":"Im Südwest-Quadranten. Angegeben sind die Peilungen zum Leuchtfeuer.","e":"Sektorangaben sind immer Peilungen vom Schiff zum Feuer. Peilst du das Feuer mit 030°–042°, stehst du auf der Gegenrichtung 210°–222° vom Feuer aus gesehen, also südwestlich davon."},{"id":"N19","cat":"Navigation","nr":19,"bogen":1,"q":"Was sind Leitfeuer (direction lights)","a":"Einzelfeuer, die durch Sektoren verschiedener Farbe oder Kennung ein Fahrwasser, eine Hafeneinfahrt oder einen freien Seeraum zwischen Untiefen bezeichnen.","e":"Ein Leitfeuer ist ein Sektorenfeuer: Im weißen Sektor fährst du sicher, rote und grüne Sektoren zeigen dir, zu welcher Seite du abgekommen bist. Es reicht ein einzelnes Feuer."},{"id":"N20","cat":"Navigation","nr":20,"bogen":2,"q":"1. Was sind Richtfeuer (leading lights)?\n2. Wann befindet man sich in einer Richtlinie eines Richtfeuers?","a":"1. Feuer, die als Unter- und Oberfeuer in Deckpeilung als Richtlinie beispielsweise einen Kurs im Fahrwasser, durch eine Hafeneinfahrt oder im freien Seeraum zwischen Untiefen bezeichnen.\n2. Wenn Unter- und Oberfeuer senkrecht unter-/übereinander erscheinen.","e":"Richtfeuer bestehen immer aus zwei Feuern hintereinander, das hintere (Oberfeuer) höher. Stehen beide exakt übereinander, bist du auf der Linie; wandert das Oberfeuer zur Seite, korrigierst du in dieselbe Richtung."},{"id":"N21","cat":"Navigation","nr":21,"bogen":3,"q":"Was ist ein Torfeuer?","a":"Zwei Feuern gleicher Höhe, Lichtstärke und Kennung, rechtwinklig zur Fahrwasserachse und von dieser gleich weit entfernt angeordnet.","e":"Ein Torfeuer markiert wie ein Tor die Mitte einer Fahrwasserstelle, etwa eine Hafeneinfahrt. Man fährt mittig hindurch."},{"id":"N22","cat":"Navigation","nr":22,"bogen":6,"q":"Was ist die \"Tragweite\" eines Feuers?","a":"Den Abstand, in dem ein Feuer einen eben noch deutlichen Lichteindruck im Auge des Beobachters hervorruft.","e":"Die Tragweite ist eine Frage der Lichtstärke und der Sichtverhältnisse, nicht der Erdkrümmung. Bei diesigem Wetter sinkt sie deutlich."},{"id":"N23","cat":"Navigation","nr":23,"bogen":5,"q":"Was ist die \"Nenntragweite\" eines Feuers?","a":"Die Tragweite eines Feuers für einen definierten Wert bei einer meteorologischen Sichtweite am Tage von 10 sm.(= Sichtwert von 0,74)","e":"Die Nenntragweite ist ein genormter Vergleichswert bei guter Sicht (10 sm). So lassen sich Feuer untereinander vergleichen; bei schlechterer Sicht ist die tatsächliche Tragweite geringer."},{"id":"N24","cat":"Navigation","nr":24,"bogen":13,"q":"Wovon hängt die \"Tragweite\" eines Feuers ab?","a":"1. Lichtstärke (Helligkeit) und\n2. Lichtdurchlässigkeit der Atmosphäre (Sichtwert)","e":"Physikalisch ist das einfach: helleres Licht und klarere Luft bedeuten größere Tragweite. Die Höhe spielt hier – im Unterschied zur Sichtweite – keine Rolle."},{"id":"N25","cat":"Navigation","nr":25,"bogen":8,"q":"In der Seekarte finden Sie bei einem Leuchtfeuer die Eintragung: 18 M. Was bedeutet diese Angabe?","a":"Nenntragweite, hier 18 Seemeilen.","e":"In deutschen und internationalen Karten steht M für Seemeilen. Die Angabe ist die Nenntragweite, also bei guter Sicht."},{"id":"N26","cat":"Navigation","nr":26,"bogen":7,"q":"Was ist die \"Sichtweite\" eines Feuers? Wovon hängt sie ab?","a":"Die Entfernung, auf die ein Leuchtfeuer über die Erdkrümmung (Kimm) hinweg gesehen werden kann. Sie hängt ab von:\n1. Feuerhöhe und\n2. Augeshöhe des Beobachters.","e":"Die Sichtweite ist rein geometrisch: Je höher Feuer und Auge, desto weiter kann man über die Kimm schauen. Faustformel: 2,075 × (√Feuerhöhe + √Augeshöhe) in Seemeilen."},{"id":"N27","cat":"Navigation","nr":27,"bogen":15,"q":"Wie müssen sich Tragweite und Sichtweite zueinander verhalten, damit das Verfahren zur Ortsbestimmung \"Feuer in der Kimm\" angewandt werden kann?","a":"Die Tragweite muss mindestens gleich der Sichtweite sein.","e":"Beim Verfahren „Feuer in der Kimm“ nutzt du den Moment, in dem das Feuer über der Kimm auftaucht, als Abstandsmaß. Ist das Feuer zu schwach, siehst du es erst später – der Abstand wäre dann falsch."},{"id":"N28","cat":"Navigation","nr":28,"bogen":11,"q":"Wo findet man Tabellen zur Ermittlung des Abstandes eines Feuers in der Kimm?","a":"In deutschen und britischen Leuchtfeuerverzeichnissen.","e":"Die Tabellen kombinieren Feuer- und Augeshöhe zu einer Sichtweite. So muss man die Formel nicht selbst rechnen."},{"id":"N29","cat":"Navigation","nr":29,"bogen":12,"q":"Wo sind die in Seekarten verwendeten Symbole und Abkürzungen erklärt?","a":"In der Karte 1/ INT des BSH.","e":"Die Karte 1/INT ist ein Heft mit allen Symbolen, Farben und Abkürzungen. Sie gehört auf jede Yacht."},{"id":"N30","cat":"Navigation","nr":30,"bogen":1,"q":"Wer veröffentlicht die Bekanntmachungen für Seefahrer (BfS) und was umfassen diese Veröffentlichungen?","a":"1. Die Wasser- und Schifffahrtsverwaltung des Bundes, bzw. der Länder\n2. Umfassen alle wichtigen Maßnahmen und Ereignisse auf den Seeschifffahrtsstraßen und der Wirtschaftszone Deutschlands.","e":"BfS kommen von den Behörden, die die Wasserstraßen verwalten (WSV), und betreffen deutsche Gewässer bis zur Ausschließlichen Wirtschaftszone. Sie ergänzen die NfS mit aktuellen örtlichen Informationen."},{"id":"N31","cat":"Navigation","nr":31,"bogen":2,"q":"Wie werden die Bekanntmachungen für Seefahrer (BfS) der Sportschifffahrt zur Kenntnis gebracht?","a":"An amtlichen Aushangstellen für das entsprechende Seegebiet und dessen angrenzende Reviere sowie im Internet unter www.elwis.de.","e":"Für Sportschiffer ist ELWIS die praktische Quelle: Dort lassen sich die BfS nach Revier filtern. In Häfen hängen sie oft zusätzlich aus."},{"id":"N32","cat":"Navigation","nr":32,"bogen":3,"q":"Zählen Sie die am häufigsten vorkommenden Ereignisse und Maßnahmen auf, über die die Bekanntmachungen für Seefahrer (BfS) unterrichten.","a":"1. Änderungen an Befeuerung, Betonnung und Landmarken,\n2. veränderte Wassertiefen,\n3. Wracke, Schifffahrtshindernisse, Rohrleitungen usw.,\n4. Bauarbeiten, Baggerarbeiten, militärische Übungen und damit zusammenhängende Sperrungen oder Behinderungen.","e":"Alles, was sich kurzfristig im Revier ändert, landet in den BfS. Vor dem Auslaufen lohnt der Blick auf Tonnen-Änderungen, Baustellen und Schießgebiete."},{"id":"N33","cat":"Navigation","nr":33,"bogen":7,"q":"Wer gibt die nautischen Warnnachrichten (NWN) heraus und von wem werden sie verbreitet?","a":"1. Herausgegeber: Seewarndienst Emden für gesamtes deutsches Warngebiet / Verkehrszentralen des Zuständigkeitsbereichs für ihren Bereich\n2. Verbreitung: Rundfunksender Deutschlandfunk","e":"NWN sind die schnellste Warnstufe: akute Gefahren wie treibende Container, ausgefallene Feuer oder Suchaktionen. Sie werden über Funk und Rundfunk verbreitet, damit sie Schiffe auf See erreichen."},{"id":"N34","cat":"Navigation","nr":34,"bogen":13,"q":"Was bedeutet der Zusatz \"vital\" bei einer nautischen Warnnachricht (NWN)?","a":"\"Vital\" weist auf eine lebensbedrohende Gefahr hin.","e":"„Vital“ markiert die dringendsten Warnungen – Gefahr für Leib und Leben. Solche Meldungen solltest du auf jeden Fall abhören."},{"id":"N35","cat":"Navigation","nr":35,"bogen":4,"q":"Welche Besonderheit bezüglich des Zusatzes \"vital\" bei einer nautischen Warnnachricht (NWN) gibt es für die Sportschifffahrt?","a":"Sie werden während der Zeit vom 1. April bis zum 31. Oktober zur Verbreitung über ausgewählte private und öffentlich-rechtliche Rundfunkanstalten weitergeleitet.","e":"In der Saison werden „vital“-Warnungen zusätzlich über normale Radiosender verbreitet, weil viele Sportboote keinen Seefunk abhören. Die Zeitspanne April bis Oktober musst du dir merken."},{"id":"N36","cat":"Navigation","nr":36,"bogen":8,"q":"Wer gibt die Nachrichten für Seefahrer (NfS) heraus und wie und wie oft erfolgt die Herausgabe?","a":"Herausgeber: BSH\nHäufigkeit: einmal wöchentlich.","e":"Das BSH gibt die NfS wöchentlich heraus. Damit berichtigt man Karten und Bücher laufend."},{"id":"N37","cat":"Navigation","nr":37,"bogen":14,"q":"Welche Unterlage steht Ihnen zur Verfügung zur Berichtigung von britischen Seekarten, die nicht von den NfS erfasst werden?","a":"Die britischen Notices to Mariners.","e":"Britische Karten werden mit den Admiralty Notices to Mariners berichtigt. Die NfS decken nur die BSH-Produkte ab."},{"id":"N38","cat":"Navigation","nr":38,"bogen":5,"q":"1. Was sind P-Nachrichten?\n2. Wie verfährt man mit diesen Nachrichten im Berichtigungsverfahren? (Begründung!)","a":"1. Bevorstehende (preliminary) Maßnahmen\n2. Wegen der begrenzten Geltungsdauer werden keine Berichtigungen vom BSH durchgeführt. Deshalb müssen vor Gebrauch jeder Seekarte die noch gültigen P-Nachrichten erfasst und in der Karte vermerkt werden.","e":"P‑Nachrichten kündigen Änderungen an, die noch nicht umgesetzt sind. Da sie sich jederzeit ändern können, werden sie nur mit Bleistift vermerkt und vor Gebrauch der Karte geprüft."},{"id":"N39","cat":"Navigation","nr":39,"bogen":6,"q":"1. Was sind T-Nachrichten?\n2. Wie verfährt man mit diesen Nachrichten im Berichtigungsverfahren? (Begründung!)","a":"1. Unterrichten über einen zeitweiligen (temporary) Zustand\n2. Wegen der begrenzten Geltungsdauer werden keine Berichtigungen vom BSH durchgeführt. Deshalb müssen vor Gebrauch jeder Seekarte die noch gültigen T Nachrichten erfasst und in der Karte vermerkt werden.","e":"T‑Nachrichten beschreiben vorübergehende Zustände, etwa ein zeitweise gelöschtes Feuer. Auch sie werden nur vorläufig (Bleistift) eingetragen und vor der Fahrt auf Gültigkeit geprüft."},{"id":"N40","cat":"Navigation","nr":40,"bogen":10,"q":"Worauf muss beim Ansteuern einer Küste bei der Auswahl von Seekarten geachtet werden? Begründen Sie Ihre Antwort.","a":"Seekarten mit größtmöglichem Maßstab verwenden. Nur in diesen Karten sind alle Schifffahrtszeichen und weitere für die Navigation wichtigen Informationen eingetragen.","e":"Großer Maßstab bedeutet: kleiner Ausschnitt, viele Details. Übersegler sind für die Planung gut, zum Ansteuern brauchst du die Spezialkarte."},{"id":"N41","cat":"Navigation","nr":41,"bogen":1,"q":"Was müssen Sie bei Kursberechnungen hinsichtlich der in der Seekarte angegebenen Ortsmissweisungen beachten?","a":"Die für ein bestimmtes Jahr angegebene Missweisung muss mittels der in der Seekarte angegebenen jährlichen Änderung für das aktuelle Jahr berichtigt werden.","e":"Die Missweisung ändert sich jedes Jahr um einen kleinen Betrag. Beispiel: 2° W (2010) mit jährlicher Änderung 8' E ergibt für 2026 etwa 0° 8' E."},{"id":"N42","cat":"Navigation","nr":42,"bogen":6,"q":"Was müssen Sie bei der Benutzung von deutschen \"Sportbootkarten\" beachten?","a":"Sie werden nach dem Druck weder vom BSH noch von den Seekartenvertriebsstellen berichtigt. Sie müssen also vom Nutzer nach dem Kauf vor Benutzung über die NfS auf den aktuellen Stand berichtigt werden.","e":"Sportbootkarten sind Momentaufnahmen des Druckdatums. Die Verantwortung für die Aktualisierung liegt komplett beim Nutzer."},{"id":"N43","cat":"Navigation","nr":43,"bogen":15,"q":"Nach welcher Faustregel können Sie m/s in Knoten umrechnen?","a":"kn = m/s * 2","e":"1 m/s entspricht ca. 1,94 kn – verdoppeln ist also eine gute Näherung. Praktisch z. B. bei Windangaben in m/s."},{"id":"N44","cat":"Navigation","nr":44,"bogen":3,"q":"Was müssen Sie beachten, wenn Sie die mit Loggen ermittelte Fahrt z. B. für das Arbeiten in Seekarten berücksichtigen wollen?","a":"Die üblichen Logmethoden liefern ausschließlich die \"Fahrt durchs Wasser (FdW)\". Um die \"Fahrt über Grund (FüG)\" zu ermitteln, müssen Stromrichtung und Stromgeschwindigkeit berücksichtigt werden.","e":"Das Log misst die Bewegung relativ zum Wasser. Strom verschiebt aber das ganze Wasser – für die Position über Grund musst du ihn vektoriell dazurechnen (Stromdreieck)."},{"id":"N45","cat":"Navigation","nr":45,"bogen":11,"q":"Welche Fahrt zeigen GPS-Geräte an?","a":"Die Fahrt über Grund (FüG).","e":"GPS misst Positionsänderungen über Grund und zeigt daher FüG und KüG. Die Differenz zur Logge verrät dir den Strom."},{"id":"N47","cat":"Navigation","nr":47,"bogen":2,"q":"Warum müssen Sie Ihre Position regelmäßig in die Seekarte eintragen?","a":"Um Abweichungen von der Kurslinie frühzeitig und sicher zu erkennen und ggf. den Kurs zu berichtigen","e":"Regelmäßig eingetragene Positionen machen Stromversatz oder Steuerfehler früh sichtbar. Fällt die Elektronik aus, hast du zudem einen aktuellen Ausgangsort fürs Koppeln."},{"id":"N48","cat":"Navigation","nr":48,"bogen":9,"q":"Was ist die Besteckversetzung (BV)?","a":"Richtung (rw) und Entfernung (in sm) vom Koppelort (Ok) zum beobachteten Ort (Ob), bezogen auf den gleichen Zeitpunkt.","e":"Die Besteckversetzung ist der Unterschied zwischen dem, wo du nach Koppelrechnung sein solltest, und wo du tatsächlich bist. Sie wird als Richtung und Distanz angegeben."},{"id":"N49","cat":"Navigation","nr":49,"bogen":7,"q":"Welche Ursachen kann die Besteckversetzung (BV) haben?","a":"1. Ungenaues Steuern und Koppeln,\n2. Kursfehler (z. B. ungenaue Steuertafel/Ablenkungstabelle) und\n3. fehlende oder unvollständige Berücksichtigung von Strom und Wind.","e":"Jeder Fehler beim Koppeln summiert sich: Rudergänger, Kompassfehler, Strom und Abdrift. Die BV hilft, diese Einflüsse für die weitere Kursplanung abzuschätzen."},{"id":"N50","cat":"Navigation","nr":50,"bogen":13,"q":"Warum sollte der Winkel zwischen zwei Peilungen nicht kleiner als 30° und nicht größer als 150° sein?","a":"Damit der gefundene Standort eine ausreichend sichere Positionsbestimmung ergibt.","e":"Bei sehr spitzen oder sehr stumpfen Winkeln schneiden sich die Standlinien schleifend. Schon ein kleiner Peilfehler verschiebt den Schnittpunkt dann stark – ideal sind etwa 90°."},{"id":"N51","cat":"Navigation","nr":51,"bogen":3,"q":"Warum sind regelmäßige Kompasskontrollen erforderlich?","a":"Zur Überprüfung der Funktionsfähigkeit des Kompasses und der Werte in der Ablenkungstabelle.","e":"Die Ablenkung kann sich durch neue Ausrüstung oder magnetische Gegenstände ändern. Regelmäßige Kontrolle, z. B. mit einer Deckpeilung, deckt das auf."},{"id":"N52","cat":"Navigation","nr":52,"bogen":5,"q":"Wodurch können auch in gezeitenlosen Revieren erhebliche Wasserstandsschwankungen und Strömungen (z. B. Triftstrom) hervorgerufen werden?","a":"Durch Stärke, Dauer und Richtung des Windes oder \"Zurückschwappen\" aufgestauter Wassermassen (z. B. Ostsee).","e":"Auch ohne Gezeiten verschiebt anhaltender Wind große Wassermassen. In der Ostsee führt das zu Hoch- oder Niedrigwasser von über einem Meter; dreht der Wind, schwappt das Wasser zurück."},{"id":"N53","cat":"Navigation","nr":53,"bogen":4,"q":"Welche navigatorischen Vorbereitungen treffen Sie vor einer Fahrt in Dunkelheit?","a":"1. Kurse und Kursänderungspunkte vorausbestimmen,\n2. Untiefen und Hindernisse in der Karte kennzeichnen,\n3. in der Seekarte markieren, welche Leuchtfeuer wann und wo in der Kimm erscheinen\n4. Wegstrecke nach unbefeuerten Tonnen absuchen.","e":"Nachts fehlen Landmarken und unbefeuerte Tonnen; man sieht nur Lichter. Wer vorher die Kurse, Gefahren und erwarteten Feuer vorbereitet hat, muss nicht im Dunkeln in der Karte suchen."},{"id":"N54","cat":"Navigation","nr":54,"bogen":8,"q":"Welche Möglichkeiten der terrestrischen Ortsbestimmung muss man kennen?","a":"1. Kreuzpeilung,\n2. Peilung und Abstand (Feuer in der Kimm, Radarabstand),\n3. Peilung und Lotung.","e":"Terrestrisch heißt: mit Objekten an Land oder in der Karte. Jede Methode liefert zwei Standlinien, deren Schnittpunkt der Standort ist."},{"id":"N55","cat":"Navigation","nr":55,"bogen":14,"q":"Nennen Sie zwei Möglichkeiten der Ortsbestimmung, wenn Sie nur ein Objekt mit bekannten Merkmalen (z. B. Leuchtturm) in Sicht haben.","a":"1. Peilung und Abstand (Feuer in der Kimm, Radarabstand),\n2. Peilung und Lotung.","e":"Eine Peilung liefert nur eine Standlinie; du brauchst eine zweite. Die liefert entweder ein Abstand (Kimm, Radar) oder eine Lotung, deren Tiefe zur Karte passen muss."},{"id":"N56","cat":"Navigation","nr":56,"bogen":6,"q":"Welche Nordrichtungen werden in der Navigation unterschieden? Erläutern Sie diese kurz.","a":"1. rwN: rechtweisend Nord = Richtung eines Meridians zum geographischen Nordpol.\n2. mwN: missweisend Nord = Richtung des erdmagnetischen Feldes zum magnetischen Nordpol, abhängig von Schiffsort und Datum (Jahr). In diese Richtung stellt sich eine ungestörte Magnet-(Kompass-)nadel ein.\n3. MgN: = Richtung zu Magnetkompass-Nord. In diese Richtung zeigt die durch das schiffsmagnetische Feld beeinflusste Kompassnadel an Bord.","e":"Drei Nordrichtungen, drei Ursachen: Geografie (rwN), Erdmagnetfeld (mwN) und das eigene Schiff (MgN). Aus ihnen ergeben sich die Korrekturen beim Kursumrechnen."},{"id":"N57","cat":"Navigation","nr":57,"bogen":15,"q":"Nennen Sie die Winkel zwischen den Nordrichtungen rechtweisend Nord (rwN), missweisend Nord (mwN) und Magnetkompass- Nord (MgN).","a":"1. Mw: Missweisung ist der Winkel von rwN nach mwN.\n2. Abl: Ablenkung (Abl) oder Deviation (Dev) ist der Winkel von mwN nach MgN.","e":"Missweisung (Mw) ist der Unterschied zwischen geografischem und magnetischem Nord, Ablenkung (Abl) der zwischen magnetischem Nord und Kompassnord. Beide werden mit Vorzeichen (E = +, W = −) angebracht."},{"id":"N58","cat":"Navigation","nr":58,"bogen":4,"q":"Nennen Sie den Winkel zwischen den Nordrichtungen rwN und MgN.","a":"Der Winkel von rwN nach MgN ist die Fehlweisung (Fw; Abl + Mw = Fw).","e":"Die Fehlweisung fasst beide Fehler zusammen: Fw = Mw + Abl. Damit rechnest du in einem Schritt zwischen MgK und rwK um."},{"id":"N59","cat":"Navigation","nr":59,"bogen":11,"q":"Wo finden Sie die erforderlichen Werte der Missweisung? Worauf ist dabei zu achten?","a":"1. Die Missweisung findet sich in der Seekarte eingedruckt für ein bestimmtes Jahr.\n2. Dieser Wert muss mit der ebenfalls in der Seekarte angegebenen jährlichen Änderung auf das Jahr der Benutzung berichtigt werden.","e":"Die Missweisung ist in der Kompassrose der Karte mit Bezugsjahr und jährlicher Änderung angegeben. Die Umrechnung auf das aktuelle Jahr ist Prüfungsstandard."},{"id":"N60","cat":"Navigation","nr":60,"bogen":5,"q":"Wo finden Sie die erforderlichen Werte der Ablenkung (Abl)? Worauf ist dabei zu achten?","a":"1. Die Abl wird einer Ablenkungstabelle entnommen.\n2. Die Abl ist abhängig vom anliegenden Kurs","e":"Die Ablenkung hängt vom Kurs ab, weil sich die Lage des Schiffes (und damit seines Magnetfeldes) zum Erdmagnetfeld ändert. Daher: Wert für den anliegenden Kurs nehmen."},{"id":"N61","cat":"Navigation","nr":61,"bogen":12,"q":"Warum muss für jedes Fahrzeug eine eigene Ablenkungstabelle (Steuertafel) erstellt werden?","a":"Die Ablenkungstabelle kann auf jedem Schiff andere Werte haben.","e":"Jedes Schiff hat durch Motor, Kiel und Ausrüstung ein eigenes Magnetfeld. Die Ablenkung muss deshalb individuell ermittelt werden (Kompensieren und Deviationstabelle)."},{"id":"N62","cat":"Navigation","nr":62,"bogen":9,"q":"Worauf müssen Sie achten, wenn eine Magnetkompasspeilung (MgP) auf eine rechtweisende Peilung (rwP) beschickt werden soll?","a":"1. Ablenkung für den anliegenden MgK (Magnetkompasskurs) aus der Steuertafel (Ablenkungstabelle) entnehmen;\n2. An den so erhaltenen mwK (missweisenden Kurs) die für das laufende Jahr der Seekarte entnommene Mw anbringen.","e":"Wichtig: Die Ablenkung hängt vom Schiffskurs ab, nicht von der Peilrichtung. Deshalb wird die Abl für den anliegenden MgK auf die Peilung angewandt, dann die Mw."},{"id":"N63","cat":"Navigation","nr":63,"bogen":13,"q":"Unter welchen Voraussetzungen ergibt sich eine brauchbare Standlinie aus einer Lotung?","a":"Der Meeresgrund muss ausreichend regelmäßig und ausreichend steil ansteigen/abfallen.","e":"Eine Lotung ergibt eine Standlinie entlang einer Tiefenlinie. Die ist nur brauchbar, wenn die Tiefe sich deutlich ändert – auf flachem, gleichförmigem Grund passt die Tiefe überall."},{"id":"N64","cat":"Navigation","nr":64,"bogen":7,"q":"Neben den Fahrwassertonnen liegen auf den Seeschifffahrtsstraßen weitere Tonnen aus, die für die Sportschifffahrt besonders wichtig sind. Welche Schifffahrtszeichen sind das?","a":"Sonderzeichen zur Bezeichnung von Sperrgebieten und Kardinalzeichen für allgemeine Gefahrenstellen.","e":"Sportboote fahren oft außerhalb des Fahrwassers und treffen dort auf Sperrgebiete und Gefahrenstellen. Sonder- und Kardinalzeichen sind deshalb besonders relevant."},{"id":"N65","cat":"Navigation","nr":65,"bogen":14,"q":"Aus welchen nautischen Publikationen können Sie Sperr- und Verbotsgebiete mit ihren Grenzen ersehen?","a":"1. Seekarten,\n2. BfS - Bekanntmachungen für Seefahrer\n3. NWN - Nautischen Warnnachrichten","e":"Dauerhafte Sperrgebiete stehen in der Karte, kurzfristige in BfS und NWN. Zur Törnplanung beides prüfen."},{"id":"N66","cat":"Navigation","nr":66,"bogen":5,"q":"Welche Sonderzeichen kennzeichnen Reeden, besondere Gebiete oder Stellen, z. B. Warngebiete?","a":"Gelbe Fasstonnen, Leuchttonnen, Spierentonnen oder Stangen.","e":"Gelb ist die Farbe der Sonderzeichen. Sie markieren Gebiete mit besonderer Bedeutung, die kein Fahrwasser sind."},{"id":"N67","cat":"Navigation","nr":67,"bogen":6,"q":"Welche Sonderzeichen kennzeichnen Sperrgebiete?","a":"Gelbe Fasstonnen, Leuchttonnen, Spierentonnen oder Stangen mit einem breiten roten Band. Beschriftung auf Fasstonne oder Leuchttonne mit schwarzen Buchstaben: \"Sperrgebiet\" oder \"Sperr-G\".","e":"Das rote Band unterscheidet Sperrgebiets-Tonnen von gewöhnlichen Sonderzeichen. Die Beschriftung macht es zusätzlich eindeutig."},{"id":"N68","cat":"Navigation","nr":68,"bogen":15,"q":"Welche Farbe haben Feuer auf Sonderzeichen, wenn vorhanden?","a":"Gelb.","e":"Gelbes Licht passt zur gelben Tonnenfarbe und ist mit keiner anderen Tonnenart zu verwechseln."},{"id":"N69","cat":"Navigation","nr":69,"bogen":2,"q":"Was bedeutet das Ausliegen der folgenden Schifffahrtszeichen: weiße Fasstonne, Kugeltonne oder Stange mit einem - von oben gesehen - rechtwinkligen gelben Kreuz bzw. bei Stangen mit einem breiten gelben Band?","a":"Wegen Badebetrieb gesperrte Wasserfläche. Fahrverbot für Maschinenfahrzeuge und Wassermotorräder.","e":"Das gelbe Kreuz auf weißem Grund kennzeichnet Badegebiete. Maschinenfahrzeuge und Jetskis dürfen hier nicht fahren – Segler ohne Motor theoretisch schon, aber mit Rücksicht."},{"id":"N70","cat":"Navigation","nr":70,"bogen":8,"q":"Wie stehen Sonne und Mond winkelmäßig zur Erde bei Springzeit und bei Nippzeit (die Springverspätung soll hier unberücksichtigt bleiben)?","a":"Springzeit: Mond, Sonne und Erde in einer Linie/Ebene\nNippzeit: Verbindungslinien Erde/Sonne und Erde/Mond stehen im rechten Winkel zueinander.","e":"Stehen Sonne und Mond in einer Linie (Voll- oder Neumond), addieren sich ihre Anziehungskräfte: Springtide. Stehen sie im rechten Winkel (Halbmond), schwächen sie sich: Nipptide."},{"id":"N71","cat":"Navigation","nr":71,"bogen":1,"q":"Erklären Sie den Begriff \"Alter der Gezeit\".","a":"Die Phase des aktuellen Tidengeschehen (Nippzeit, Mittzeit, Springzeit)","e":"Das „Alter der Gezeit“ beschreibt, wo im Zyklus zwischen Spring und Nipp man sich befindet. Davon hängt ab, wie stark Hub und Strom ausfallen."},{"id":"N72","cat":"Navigation","nr":72,"bogen":3,"q":"Warum findet man z. B. bei Bezugsorten in der Nordsee bzw. im Englischen Kanal zeitweise nur ein Hoch- bzw. Niedrigwasser pro Tag?","a":"Die Umlaufzeit des Mondes um die Erde dauert im Mittel 24 h 50 min. (Mondtag) gegenüber dem Sonnentag (= 24 h). Deshalb \"rutscht\" das letzte HW oder NW zeitweise in den nächsten Tag.","e":"Die Gezeiten folgen dem Mond (ca. 24 h 50 min), nicht der Sonne. Die Hochwasser verschieben sich daher täglich um etwa 50 Minuten, und gelegentlich fällt eines auf den nächsten Kalendertag."},{"id":"N73","cat":"Navigation","nr":73,"bogen":5,"q":"Weshalb und wie können die tatsächlichen Wasserstände von den Angaben in den Gezeitentafeln teilweise erheblich abweichen?","a":"Durch Wind und / oder durch sehr hohen bzw. sehr niedrigen Luftdruck. HWH bzw.NWH können höher oder niedriger sein als angegeben, die Hoch- und Niedrigwasserzeit kann früher oder später eintreten als angegeben.","e":"Gezeitentafeln sind astronomische Vorhersagen. Sturm oder extremer Luftdruck (ca. 1 cm pro hPa) können den tatsächlichen Wasserstand deutlich verändern."},{"id":"N74","cat":"Navigation","nr":74,"bogen":11,"q":"Worauf beziehen sich die Tiefenangaben in Seekarten in den deutschen Gewässern der Ost- und Nordsee?","a":"Auf Kartennull (KN).","e":"Kartennull ist eine sehr niedrige Bezugsfläche, damit man fast immer mindestens die Kartentiefe vorfindet. Sie ist in Nord- und Ostsee unterschiedlich definiert."},{"id":"N75","cat":"Navigation","nr":75,"bogen":10,"q":"Was ist Kartennull?","a":"Kartennull (KN) ist die Bezugsfläche für die Tiefenangaben in einer Seekarte.","e":"Alle Tiefen in der Karte sind auf diese Fläche bezogen. Die Höhe der Gezeit kommt jeweils oben drauf."},{"id":"N76","cat":"Navigation","nr":76,"bogen":4,"q":"Wie ist Kartennull (KN) in der Ost- und Nordsee und im Englischen Kanal definiert? Wo finden Sie die entsprechenden Angaben zur Kartennullebene?","a":"1.\nOstsee: KN = mittlerer Wasserstand. Nordsee und Englischer Kanal: KN = LAT = Lowest Astronomical Tide.\n2. In der jeweiligen Seekarte","e":"LAT ist der niedrigste Wasserstand, der astronomisch vorkommen kann; man hat also fast immer mehr Wasser. In der Ostsee gibt es kaum Gezeiten, deshalb nimmt man den mittleren Wasserstand."},{"id":"N77","cat":"Navigation","nr":77,"bogen":9,"q":"Was müssen Sie bedenken, wenn Sie die Wassertiefe außerhalb der Niedrigwasserzeit loten?","a":"Beim folgenden Niedrigwasser wird die Wassertiefe geringer sein als zum Zeitpunkt der Lotung.","e":"Die gemessene Tiefe enthält die aktuelle Höhe der Gezeit. Für die Sicherheit beim Ankern oder Trockenfallen musst du den Wasserstand beim nächsten Niedrigwasser berechnen."},{"id":"N78","cat":"Navigation","nr":78,"bogen":12,"q":"Was ist die Kartentiefe?","a":"Die Kartentiefe (KT) ist die auf Kartennull bezogene Wassertiefe. Kartentiefe ist Wassertiefe abzüglich Höhe der Gezeit.","e":"Die Kartentiefe ist die „Grundtiefe“ ohne Gezeiteneinfluss. Aktuelle Wassertiefe = Kartentiefe + Höhe der Gezeit."},{"id":"N79","cat":"Navigation","nr":79,"bogen":8,"q":"Mit welcher Wassertiefe können Sie bei einer Lotung normalerweise mindestens rechnen?","a":"Kartentiefe.","e":"Da Kartennull sehr niedrig liegt, ist die Kartentiefe normalerweise das Minimum. Nur bei extremem Ostwind oder Hochdruck kann es noch weniger sein."},{"id":"N80","cat":"Navigation","nr":80,"bogen":13,"q":"Welche Bedeutung hat die Angabe \"Springzeit\" für die Wasserstände in Gezeitengebieten?","a":"Zur Springzeit sind besonders hohe Hochwasser und besonders niedrige Niedrigwasser zu erwarten.","e":"Bei Springzeit ist der Tidenhub am größten. Beim Einlaufen in flache Häfen oder beim Trockenfallen musst du damit rechnen, dass das Niedrigwasser besonders tief fällt."},{"id":"N81","cat":"Navigation","nr":81,"bogen":7,"q":"Welche Bedeutung hat die Angabe \"Nippzeit\" für die Wasserstände in Gezeitengebieten?","a":"Zur Nippzeit sind besonders niedrige Hochwasser und besonders hohe Niedrigwasser zu erwarten.","e":"Bei Nippzeit ist der Tidenhub am kleinsten. Das Niedrigwasser ist weniger kritisch, das Hochwasser dafür aber auch nicht so hoch."},{"id":"N82","cat":"Navigation","nr":82,"bogen":14,"q":"Welche Bedeutung haben die Angaben \"Nippzeit\" bzw. \"Springzeit\" für die Gezeitenströme?","a":"Zur Springzeit setzen die Gezeitenströme z. T. deutlich stärker als zur Nippzeit.","e":"Mehr Hub bedeutet mehr Wasser, das in gleicher Zeit bewegt werden muss – also stärkeren Strom. Bei Springzeit kann der Strom fast doppelt so stark wie bei Nipp sein."},{"id":"N83","cat":"Navigation","nr":83,"bogen":1,"q":"Wo können Sie Informationen über Gezeitenströme in Küstengewässern finden?","a":"Gezeitenstromatlanten, Gezeitenstromtabellen in Seekarten","e":"Gezeitenstromatlanten zeigen für jede Stunde um HW die Stromrichtung und -stärke als Pfeile. In Seekarten gibt es zusätzlich Tabellen an markierten Stellen (Rautenzeichen)."},{"id":"N84","cat":"Navigation","nr":84,"bogen":6,"q":"Auf einer Seekarte finden Sie in Küstennähe die Tiefenangabe 2 3 (tiefergestellt). Was bedeutet das?","a":"Der Ort der Zahl liegt 2,3 m über Kartennull und kann trockenfallen.","e":"Unterstrichene bzw. tiefergestellte Zahlen sind Trockenfallhöhen über Kartennull. Hier liegt bei Niedrigwasser Watt frei."},{"id":"N85","cat":"Navigation","nr":85,"bogen":2,"q":"In welchem Zusammenhang stehen Kartentiefe (KT), Wassertiefe (WT) und Höhe der Gezeit (H)?","a":"KT = WT - H","e":"Die Formel lässt sich umstellen: WT = KT + H. Genau dieses Rechnen ist für Gezeitenaufgaben zentral."},{"id":"N86","cat":"Navigation","nr":86,"bogen":15,"q":"Warum ist es in Tidengewässern wichtig, die Uhrzeit einer Lotung festzuhalten?","a":"Um anhand der Gezeitentafel feststellen zu können, ob das Wasser steigt oder fällt.","e":"Ohne Uhrzeit kannst du die Lotung nicht mit der Gezeitentafel abgleichen und nicht auf Kartennull reduzieren. Dann bleibt unklar, wie viel Wasser beim nächsten NW bleibt."},{"id":"N87","cat":"Navigation","nr":87,"bogen":11,"q":"Was ist ein Pegel?","a":"Eine Skala zur Anzeige des Wasserstandes.","e":"Pegel stehen in Häfen und an Fahrwassern. Sie zeigen den aktuellen Wasserstand, der mit der Vorhersage verglichen werden kann."},{"id":"N88","cat":"Navigation","nr":88,"bogen":12,"q":"Welchen Einfluss kann der Wind auf die Gezeiten haben?","a":"Der Wind kann Änderungen von Strömung und Wasserstand hervorrufen, die zu den Gezeitenströmen und den Gezeiten hinzutreten.","e":"Anhaltender auflandiger Wind drückt Wasser an die Küste (höherer Wasserstand), ablandiger saugt es weg. Zusätzlich entsteht Triftstrom, der sich zum Gezeitenstrom addiert."},{"id":"N89","cat":"Navigation","nr":89,"bogen":3,"q":"Nennen Sie drei wichtige Vorzüge von GPS.","a":"1. Global - GPS arbeitet weltweit.\n2. Griffbereit - Die Positionsanzeige ist jederzeit verfügbar.\n3. Genau - Der Positionsfehler ist gering.","e":"Die „drei G“ (global, griffbereit, genau) sind eine Merkhilfe. GPS ist trotzdem kein Ersatz für Koppeln und Karte, weil es ausfallen oder gestört sein kann."},{"id":"N90","cat":"Navigation","nr":90,"bogen":2,"q":"Wie groß ist die typische und realistische Genauigkeit von Positionen, die mit GPS und DGPS ermittelt werden?","a":"DGPS: 1 - 10 m,\nGPS: 10 - 20 m Jeweils bei einer Wahrscheinlichkeit von etwa 95 %.","e":"DGPS nutzt Korrekturwerte von Referenzstationen und ist daher genauer. Die Angabe „95 %“ bedeutet: in 5 % der Fälle kann der Fehler größer sein."},{"id":"N91","cat":"Navigation","nr":91,"bogen":13,"q":"Wo muss man mit ungenauen Anzeigen des GPS rechnen?","a":"1. Bei Abschattung der GPS-Antenne.\n2. In der Nähe von Flughäfen und in der Nähe von Fernsehsendern.\n3. In der Nähe von Marineeinrichtungen.\n4. Bei Nutzung von UKW-Geräten und anderen elektronischen/elektrischen Geräten an Bord.","e":"Störsender, Abschattung und Reflexionen verfälschen GPS-Signale. Auch militärische Übungen können GPS gezielt stören (Jamming)."},{"id":"N92","cat":"Navigation","nr":92,"bogen":14,"q":"Was bedeutet die Abkürzung GPS?","a":"Global Positioning System.","e":"Reine Abkürzungsfrage – wichtig ist, dass es ein globales Satellitennavigationssystem der USA ist."},{"id":"N93","cat":"Navigation","nr":93,"bogen":9,"q":"Was ist das Grundprinzip von GPS?","a":"Durch Laufzeitmessungen von GPS-Signalen vom Satelliten zum Empfänger und damit durch Abstandsmessungen zu den Satelliten wird die Ortsbestimmung ermöglicht.","e":"Aus der Laufzeit des Signals ergibt sich der Abstand zu jedem Satelliten. Mit mindestens vier Satelliten kann der Empfänger Position und Uhrzeitfehler berechnen."},{"id":"N94","cat":"Navigation","nr":94,"bogen":5,"q":"Was bedeutet die Abkürzung DGPS und nach welchem Prinzip arbeitet DGPS?","a":"DGPS = Differential Global Positioning System. Hierbei handelt es sich um eine regionale Verbesserung der Ortsbestimmung. Dabei werden von Referenzstationen über Funk Korrekturwerte für die GPS-Messwerte an die Schiffe übertragen.","e":"Die Referenzstation kennt ihre exakte Position und berechnet so den aktuellen GPS-Fehler. Den sendet sie an die Schiffe, die ihre Position damit korrigieren."},{"id":"N95","cat":"Navigation","nr":95,"bogen":10,"q":"Was ist bei Anbringung einer GPS-Antenne zu beachten?","a":"1. Sie muss ringsum freie Sicht (ohne Abschattungen) haben.\n2. Einwandfreie Erdung.","e":"Freie Sicht zum Himmel ist die Grundbedingung; Mast, Segel oder Aufbauten stören den Empfang. Gute Erdung vermeidet Störungen."},{"id":"N96","cat":"Navigation","nr":96,"bogen":8,"q":"Was bewirkt die Bedienung der MOB-Taste bei GPS-Geräten?","a":"1. Aktuelle Position wird gespeichert.\n2. rwP und d zu diesem Punkt werden angezeigt (Rechtweisende Peilung (rwP) und Distanz)","e":"Die MOB-Taste speichert sofort die Unfallstelle. Das Gerät führt dich danach mit Peilung und Distanz zurück – wichtig, weil man eine Person im Wasser schnell aus den Augen verliert."},{"id":"N97","cat":"Navigation","nr":97,"bogen":6,"q":"Was bedeutet die Aussage: \"Die Ortsgenauigkeit beträgt 100 m mit einer Wahrscheinlichkeit von 95 %\"?","a":"5 % der Ortsbestimmungen sind ungenauer als ca. 100 m. Das Schiff befindet sich mit einer Wahrscheinlichkeit von 95 % in einem Fehlerkreis von 100 m Radius um den beobachteten Ort.","e":"Genauigkeitsangaben sind immer statistisch. Die Position ist ein Fehlerkreis, kein Punkt."},{"id":"N98","cat":"Navigation","nr":98,"bogen":4,"q":"Wie kann man feststellen, ob die GPS-Position genau bzw. zuverlässig ist?","a":"1. Verteilung der Satelliten / HDOP (horizontal dilution of precision).\n2. Anzahl der getrackten Satelliten\n3. Vergleich mit anderen Navigationssystemen und der Koppelposition.","e":"Stehen die Satelliten gut verteilt, ist der HDOP-Wert klein und die Position genau. Der Vergleich mit Koppelort oder Peilung ist die beste Plausibilitätsprüfung."},{"id":"N99","cat":"Navigation","nr":99,"bogen":7,"q":"Was ist bei Eintragung eines GPS-Ortes in eine Seekarte zu beachten?","a":"Das Bezugssystem muss übereinstimmen. Durch:\n1. Verwendung von Seekarten, die auf WGS 84 beruhen.\n2. Manuelle Verschiebung des GPS-Ortes um die N/S- und E/W-Korrektur.\n3. Auswahl des Kartenbezugssystems im Empfänger.","e":"Hier schließt sich der Kreis zu N2–N5: GPS rechnet in WGS 84, die Karte vielleicht nicht. Moderne Karten beruhen meist auf WGS 84, bei älteren muss korrigiert werden."},{"id":"N100","cat":"Navigation","nr":100,"bogen":15,"q":"Was ist ein Wegpunkt?","a":"Geographische Koordinaten eines anzusteuernden Punktes.","e":"Wegpunkte sind vorab eingegebene Koordinaten. Das GPS zeigt dann Kurs und Distanz dorthin an."},{"id":"N101","cat":"Navigation","nr":101,"bogen":1,"q":"Was bedeutet WGS 84 und was wird damit erreicht?","a":"1. Globales Bezugssystem \"World Geodetic System 1984\".\n2. Mit diesem System (= Referenzellipsoid bei GPS) wird weltweit eine optimale Anpassung an die reale Form des gesamten Erdkörpers erreicht.","e":"WGS 84 beschreibt die Erde als Ellipsoid, das global möglichst gut passt. Ältere Kartendaten (z. B. ED 50) passen regional besser, weichen aber von WGS 84 ab."},{"id":"N102","cat":"Navigation","nr":102,"bogen":7,"q":"Wodurch können Radarechos von kleinen Fahrzeugen und Tonnen auf den Sichtschirmen von Radargeräten \"verschwinden\"?","a":"1. Seegang und / oder Niederschlag,\n2. Falsche Bedienung,\n3. Zu große Entfernung,\n4. Gieren des eigenen Fahrzeugs bei (head up) Radarstellung.","e":"Kleine Ziele werden leicht von Seegangs- oder Regenechos überdeckt. Falsch eingestellte Enttrübung (Sea/Rain Clutter) kann sie auch wegfiltern."},{"id":"N103","cat":"Navigation","nr":103,"bogen":2,"q":"Wie kann man mit Radar den eigenen Schiffsort bestimmen?","a":"Peilstrahl als Standlinie durch Peilung des Objektes Abstandskreis als Standlinie durch Abstandsmessung mit dem VRM (Variable Range Marker)","e":"Radar liefert gleichzeitig Richtung und Entfernung. Der Abstand ist meist genauer als die Radarpeilung."},{"id":"N104","cat":"Navigation","nr":104,"bogen":9,"q":"Wie kann man gegebenenfalls verhindern, dass sich Echoanzeigen von Zielen (z. B. 2 Tonnen, 2 Molenköpfe) überlappen?","a":"1. Kurze Impulslänge wählen.\n2. Messbereich verkleinern.","e":"Kurze Impulse und ein kleiner Messbereich erhöhen die Auflösung. Dann erscheinen nahe beieinander liegende Ziele als getrennte Echos."},{"id":"N105","cat":"Navigation","nr":105,"bogen":11,"q":"Was bedeutet der Begriff AIS auf See?","a":"Automatic Identification System","e":"Automatisches Identifikationssystem – Schiffe senden per UKW ihre Daten, die andere auf Plotter oder Radar sehen."},{"id":"N106","cat":"Navigation","nr":106,"bogen":1,"q":"Welche Aufgaben hat AIS?","a":"Alle ausgerüsteten Schiffe senden automatisch in kurzen Abständen ihre Identität und einen schiffsbezogenen Datensatz. Bei Bedarf können sicherheitsrelevante Nachrichten von Bord oder von Landstationen gesendet werden.","e":"AIS dient vor allem der Kollisionsverhütung und Verkehrsüberwachung. Man sieht Name, Kurs und Geschwindigkeit anderer Schiffe und kann sie gezielt anfunken."},{"id":"N107","cat":"Navigation","nr":107,"bogen":2,"q":"Welche Reichweite hat ein AIS-Bordgerät und wovon ist sie abhängig?","a":"Die Reichweite entspricht der von UKW. Bei Handelsschiffen ca. 20 bis 30 sm. Sie ist abhängig von der Antennenhöhe.","e":"AIS nutzt UKW, deshalb reicht es etwa so weit wie die „Sicht“ zwischen den Antennen. Hohe Antennen bedeuten große Reichweite."},{"id":"N108","cat":"Navigation","nr":108,"bogen":3,"q":"Wie kann die Reichweite eines AIS-Bordgerätes landseitig erhöht werden und wie wirken sich dabei Hindernisse (z. B. Berge) aus?","a":"Mit Hilfe von \"Relaisstationen\", Hindernisse (abschattend) können damit umgangen werden.","e":"Landstationen empfangen und senden AIS-Daten weiter. So werden Schiffe auch hinter Inseln oder Bergen sichtbar."},{"id":"N109","cat":"Navigation","nr":109,"bogen":4,"q":"Welche AIS-Daten werden von Schiffen aus der Berufsschifffahrt gesendet?","a":"Statische Daten, z.B. ID, Rufzeichen, Länge und Breite des Schiffes.\nDynamische Daten, z.B. Position, Kurs und Fahrt über Grund, Fahrtstatus\nReisebezogene Daten, z.B. Tiefgang, Zielort, ETA","e":"Statische Daten ändern sich nie, dynamische laufend, reisebezogene werden manuell eingegeben. Die Einteilung hilft beim Einschätzen, wie verlässlich eine Angabe ist."},{"id":"N110","cat":"Navigation","nr":110,"bogen":5,"q":"Wann kann man sich auf die Verfügbarkeit und Anzeige von AIS-Signalen anderer Fahrzeuge verlassen? Nennen Sie die wesentlichen Voraussetzungen!","a":"Fahrzeuge werden nur angezeigt, wenn das Fahrzeug auch sendet. d.h.\n1. Es ist mit AIS ausgerüstet,\n2. AIS angeschaltet,\n3. GPS aktiv,\n4. Kein Target Overflow / aus Kapazitätsgründen keine Fahrzeuge ausgeschlossen (z. B. durch zu viele Schiffe in einem Seegebiet) .","e":"AIS zeigt nur Schiffe, die senden. Viele Sportboote und Fischer haben kein AIS – deshalb ersetzt es nie den Ausguck."},{"id":"N111","cat":"Navigation","nr":111,"bogen":7,"q":"Wie ist die Genauigkeit von AIS-Daten zu beurteilen (Position und manuell eingegebene Daten)?","a":"Position: Mit AIS wird zusätzlich zur GPS-Position die Information übertragen, ob es sich um einen GPS- oder DGPS Ort handelt. Ist die GPS- Position eines Schiffes falsch, wird diese falsche Position auf allen anderen Schiffen angezeigt.\nManuell eingegebene Daten: Es muss damit gerechnet werden, dass Daten (Zielort, Tiefgang, u. a). falsch sind, wenn sie nicht von der Schiffsführung aufdatiert werden","e":"AIS überträgt, was das sendende Schiff weiß. Falsche GPS-Positionen oder veraltete Handeingaben werden ungeprüft an alle weitergegeben."},{"id":"N112","cat":"Navigation","nr":112,"bogen":8,"q":"Welche besondere Bedeutung hat AIS für die Sportschifffahrt im Vergleich mit der Radaranzeige auf anderen Schiffen?","a":"Sportfahrzeuge werden häufig auf den Radargeräten anderer Schiffe nicht sicher angezeigt bzw. die Anzeigen gehen unter. Da AIS-Daten zusätzlich im Radar dargestellt werden, besteht die Gefahr, dass Sportfahrzeuge noch weniger auffällig sind, wenn sie nicht selbst mit AIS ausgerüstet sind.","e":"Wenn Radar und AIS gemeinsam angezeigt werden, fallen Schiffe ohne AIS kaum noch auf. Für Yachten spricht das stark dafür, selbst einen AIS-Transponder zu haben."},{"id":"N114","cat":"Navigation","nr":114,"bogen":1,"q":"Was gehört zur navigatorischen Mindestausrüstung einer Yacht in Küstengewässern? Nennen Sie mindestens 6 Beispiele.","a":"Steuerkompass, Peilkompass, Uhr, Log, Lot, Fernglas, Barometer, Seekarten für das zu befahrende Seegebiet, Weltempfänger für Rundfunk, Logbuch, Funknavigationsgerät","e":"Denke an: Kurs halten (Kompass), Position bestimmen (Peilkompass, Log, Lot, Karten), Wetter (Barometer, Empfänger) und Dokumentation (Logbuch). Sechs Beispiele reichen für volle Punkte."},{"id":"N115","cat":"Navigation","nr":115,"bogen":13,"q":"Welchen Vorteil hat ein Kugelkompass gegenüber einem Fernglaskompass?","a":"1. Lesbarkeit bei Krängung\n2. Vergrößerungseffekt: Die Kugelform verbessert die Ablesbarkeit der Kompassrose","e":"Der Kugelkompass ist kardanisch gelagert und bleibt auch bei Lage gut ablesbar. Die Kugel wirkt zudem wie eine Lupe."},{"id":"N116","cat":"Navigation","nr":116,"bogen":12,"q":"Was beeinflusst die Ablenkung eines Kompasses dauerhaft?","a":"Veränderung des magnetischen Zustandes an Bord, z. B. Einbauten und Lageänderung von Ausrüstungsgegenständen.","e":"Dauerhafte Änderungen entstehen, wenn Eisen oder Elektrik fest eingebaut oder umgelagert werden. Dann muss die Ablenkung neu bestimmt werden."},{"id":"N117","cat":"Navigation","nr":117,"bogen":4,"q":"Was beeinflusst die Ablenkung eines Kompasses vorübergehend?","a":"1. Elektronische Geräte (z. B. Radio, Handy),\n2. Magnetisierte Gegenstände (z. B. Werkzeug, Peilkompass) und\n3. Gleichstromleitungen in der Nähe des Kompasses.","e":"Vorübergehend stören alles, was man in die Nähe legt: Handy, Werkzeug, Lautsprecher. Solche Gegenstände gehören nicht neben den Kompass."},{"id":"N118","cat":"Navigation","nr":118,"bogen":14,"q":"Welchen Abstand muss magnetisierbares Material vom Magnetkompass haben?","a":"Mindestens 1 m","e":"Ein Meter ist die Faustregel. Beim Umbau oder Verstauen von Ausrüstung sollte man daran denken."},{"id":"R2","cat":"Recht","nr":2,"bogen":1,"q":"Die Verordnung zu den KVR verbietet die Führung eines Fahrzeugs, wenn man infolge des Genusses alkoholischer Getränke in der sicheren Führung des Fahrzeugs behindert ist. Welchen örtlichen Geltungsbereich hat die vorgenannte Verordnung?","a":"Die Verordnung gilt auf Seeschifffahrtsstraßen und für Schiffe, die die Bundesflagge führen, seewärts der Begrenzung des Küstenmeeres der Bundesrepublik Deutschland (also weltweit), soweit nicht in den Hoheitsgewässern anderer Staaten abweichende Regelungen gelten.","e":"Die Verordnung gilt überall dort, wo deutsches Recht auf See greift: auf den deutschen Seeschifffahrtsstraßen und auf allen Schiffen unter deutscher Flagge – auch weit draußen. In fremden Hoheitsgewässern gehen deren Regeln vor."},{"id":"R3","cat":"Recht","nr":3,"bogen":5,"q":"Wer darf laut Verordnung zu den KVR ein Fahrzeug nicht führen oder als Mitglied der Crew eine andere Tätigkeit des Brücken- oder Decksdienstes nicht ausüben (allgemein ohne Zahlen zu beantworten)?","a":"Wer infolge körperlicher oder geistiger Mängel oder des Genusses alkoholischer Getränke oder anderer berauschender Mittel in der sicheren Führung eines Fahrzeugs oder in der sicheren Ausübung einer anderen Tätigkeit des Brücken- oder Decksdienstes behindert ist.","e":"Es geht nicht nur um Alkohol, sondern um jede Einschränkung: Müdigkeit, Krankheit, Medikamente oder Drogen. Und es betrifft nicht nur den Skipper, sondern jeden, der Wache geht oder an Deck mitarbeitet."},{"id":"R4","cat":"Recht","nr":4,"bogen":9,"q":"Welche Atem- bzw. Blutalkoholkonzentration darf laut Verordnung zu den KVR nicht erreicht werden, damit kein Verbot für ein Führen eines Fahrzeugs oder als Mitglied der Crew für ein Ausüben des Brückendienstes besteht?","a":"0,25 mg/l oder mehr Alkohol in der Atemluft 0,5 Promille oder mehr Alkohol im Blut","e":"Die Grenzwerte entsprechen denen im Straßenverkehr. Wichtig: Auch darunter kann man „behindert“ und damit fahruntüchtig sein."},{"id":"R5","cat":"Recht","nr":5,"bogen":3,"q":"Die KVR regeln u. a. das Verhalten der Schiffsführungen bei Kollisionsgefahr. Was ist im Rahmen der Verantwortlichkeit bei der Auslegung und Befolgung der KVR zu berücksichtigen?","a":"Berücksichtigung aller Gefahren der Schifffahrt und des Zusammenstoßes sowie Umstände der betroffenen Fahrzeuge, die zum Abwenden unmittelbarer Gefahr ggf. auch ein Abweichen von diesen Regeln erfordern können (z. B. Abweichen von der Kurshaltepflicht).","e":"Die KVR sind kein starres Korsett. Wenn die Lage es erfordert, darfst und musst du von einer Regel abweichen, um eine unmittelbare Gefahr abzuwenden – etwa als Kurshalter doch auszuweichen."},{"id":"R6","cat":"Recht","nr":6,"bogen":4,"q":"Welche Grundregeln für das Verhalten im Verkehr verlangen die KVR, die ein Schiffsführer zu berücksichtigen hat, auch wenn keine konkrete Regel anwendbar ist?","a":"Die KVR befreien nicht von den Folgen, die durch unzureichende Einhaltung der KVR oder unzureichende Vorsichtsmaßnahmen entstehen, d. h. allgemeine seemännische Praxis oder besondere Umstände können über die Mindestanforderungen der KVR hinausgehende Maßnahmen erfordern.","e":"Wer sich stur auf die Regeln beruft, ist nicht aus der Verantwortung. Gute Seemannschaft verlangt, alle Umstände zu berücksichtigen und notfalls mehr zu tun, als die KVR vorschreiben."},{"id":"R7","cat":"Recht","nr":7,"bogen":7,"q":"Was sind Verkehrstrennungsgebiete? Wie sind sie zu befahren?","a":"1. Verkehrstrennungsgebiete sind Schifffahrtswege, die durch Trennlinien oder Trennzonen in Einbahnwege geteilt sind.\n2. Diese dürfen nur in Fahrtrichtung rechts der Trennlinie/Trennzone befahren werden, aber unter Nutzung der vollen Breite des Einbahnweges.","e":"Ein VTG ist wie eine Autobahn: getrennte Fahrspuren für jede Richtung. Man fährt rechts der Trennzone, darf aber die ganze Breite seiner Spur nutzen."},{"id":"R8","cat":"Recht","nr":8,"bogen":11,"q":"Was ist ein \"manövrierunfähiges Fahrzeug\"?","a":"Ein Fahrzeug, das wegen außergewöhnlicher Umstände (z. B. Ruderbruch) nicht regelgerecht manövrieren und daher einem anderen Fahrzeug nicht ausweichen kann.","e":"Manövrierunfähig ist ein Fahrzeug durch einen Defekt oder Ausfall. Es kann nicht ausweichen und steht deshalb in der Rangfolge ganz oben."},{"id":"R9","cat":"Recht","nr":9,"bogen":12,"q":"Was ist ein \"manövrierbehindertes Fahrzeug\"?","a":"Ein Fahrzeug, das durch die Art seines Einsatzes behindert ist (z. B. Bagger, Kabelleger), regelgerecht zu manövrieren, und daher einem anderen Fahrzeug nicht ausweichen kann.","e":"Manövrierbehindert ist ein Fahrzeug durch seine Arbeit, nicht durch einen Schaden. Es könnte technisch ausweichen, darf seine Tätigkeit aber nicht unterbrechen."},{"id":"R10","cat":"Recht","nr":10,"bogen":2,"q":"Nennen Sie mindestens 3 Beispiele für \"manövrierbehinderte Fahrzeuge\".","a":"1. Tonnenleger, Kabelleger, Rohrleger im Einsatz,\n2. Bagger, Vermessungsfahrzeuge im Einsatz,\n3. Flugzeugträger im Einsatz,\n4. Minenräumfahrzeuge im Einsatz,\n5. Versorger im Einsatz,\n6. Fahrzeuge während eines Schleppvorganges, bei dem das schleppende Fahrzeug und sein Anhang erheblich behindert sind, vom Kurs abzuweichen.","e":"Gemeinsam ist allen: Sie sind an eine Arbeit gebunden, die Kurs und Geschwindigkeit bestimmt. Drei Beispiele reichen in der Prüfung."},{"id":"R11","cat":"Recht","nr":11,"bogen":13,"q":"Was ist unter \"sicherer Geschwindigkeit\" zu verstehen?","a":"Das Fahrzeug muss jederzeit innerhalb einer solchen Entfernung zum Stehen gebracht werden können, dass ein Zusammenstoß vermieden wird","e":"Die sichere Geschwindigkeit hängt von Sicht, Verkehrsdichte, Manövrierfähigkeit, Seegang und Wassertiefe ab. Es gibt keine feste Zahl – sie ist situationsabhängig."},{"id":"R13","cat":"Recht","nr":13,"bogen":14,"q":"Sie sehen in der Dämmerung in der Nordsee in der Zufahrt zur Jade einen großen Tanker mit der üblichen Lichterführung, auf dem kurze Zeit später die Lichter rot-weiß-rot senkrecht übereinander zusätzlich zu den Fahrtlichtern gesetzt werden. Welche rechtliche Bedeutung hat die geänderte Signalgebung für Sie?","a":"Beim Erreichen des Geltungsbereiches der SeeSchStrO kennzeichnet sich der Tanker als Wegerechtschiff, das als manövrierbehindertes Fahrzeug gilt. Diesem so gekennzeichneten Fahrzeug muss im Falle einer Kollisionsgefahr ausgewichen werden.","e":"Rot-weiß-rot kennzeichnet ein manövrierbehindertes Fahrzeug. In der SeeSchStrO zeigen große Schiffe damit an, dass sie als Wegerechtschiff auf das Fahrwasser angewiesen sind – du musst ausweichen."},{"id":"R14","cat":"Recht","nr":14,"bogen":6,"q":"Welche Lichter müssen manövrierbehinderte Fahrzeuge (außer Minenräumfahrzeuge) führen\n1. ohne Fahrt durchs Wasser (FdW),\n2. mit FdW,\n3. vor Anker?","a":"1. Ohne FdW: rot-weiß-rot senkrecht übereinander.\n2. Mit FdW: 1. plus Lichter eines Maschinenfahrzeugs (Topplichter, Seitenlichter, Hecklicht.)\n3. Vor Anker: 1. plus Ankerlicht(er).","e":"Die Grundform ist immer rot-weiß-rot. Macht das Fahrzeug Fahrt, kommen die normalen Fahrtlichter dazu; ankert es, das Ankerlicht."},{"id":"R15","cat":"Recht","nr":15,"bogen":8,"q":"Wie sind manövrierbehinderte und manövrierunfähige Fahrzeuge am Tage bezeichnet?","a":"1. Manövrierbehindert: Ball-Rhombus-Ball senkrecht übereinander.\n2. Manövrierunfähig: zwei schwarze Bälle senkrecht übereinander.","e":"Merkhilfe: Die Tagsignale entsprechen den Lichtern – Ball = rot, Rhombus = weiß. Aus rot-weiß-rot wird Ball-Rhombus-Ball, aus rot-rot werden zwei Bälle."},{"id":"R16","cat":"Recht","nr":16,"bogen":15,"q":"Wie müssen Sie Ihr Fahrzeug unter Segel bei Tage und bei Nacht kennzeichnen, wenn Sie gleichzeitig mit Maschinenkraft fahren?","a":"1.\nNacht: Lichterführung eines Maschinenfahrzeugs entsprechender Größe,\n2.\nTag: Kegel - Spitze unten - im Vorschiff gut sichtbar.","e":"Sobald der Motor läuft, bist du rechtlich ein Maschinenfahrzeug – egal, ob die Segel stehen. Den Kegel mit Spitze nach unten vergessen viele Segler am Tag."},{"id":"R17","cat":"Recht","nr":17,"bogen":10,"q":"Was müssen Sie hinsichtlich der Zeiten der Lichterführung beachten?","a":"Die Lichter müssen geführt werden\n1. zwischen Sonnenuntergang und Sonnenaufgang,\n2. bei verminderter Sicht zwischen Sonnenaufgang und Sonnenuntergang.","e":"Auch am Tag bei Nebel oder starkem Regen müssen die Lichter an sein. Sie verbessern dann die Erkennbarkeit."},{"id":"R18","cat":"Recht","nr":18,"bogen":3,"q":"Sie sehen am Tage ein Fahrzeug, augenscheinlich kürzer als 50 m, mit dem Sichtzeichen \"schwarzer Rhombus\", dahinter in gleichbleibendem Abstand ein weiteres Fahrzeug mit dem gleichen Signalkörper.\n1. Worum handelt es sich?\n2. Wie sind die Fahrzeuge bei Nacht gekennzeichnet?","a":"1. Schleppverband > 200 m (Heck des Schleppers - Heck des Anhangs).\n2. Beide: Seitenlichter und Hecklicht,\nSchlepper zusätzlich: drei weiße Topplichter senkrecht übereinander, gelbes Schlepplicht über Hecklicht","e":"Ein Rhombus zeigt einen Schleppverband mit über 200 m Länge. Nachts erkennt man das an drei Topplichtern am Schlepper; unter 200 m wären es zwei."},{"id":"R19","cat":"Recht","nr":19,"bogen":4,"q":"Man hört bei Nebel folgendes Schallsignal mit der Pfeife (lang-kurz-kurz), unmittelbar gefolgt von (lang- kurz-kurz-kurz) etwa jede Minute. Worum handelt es sich dabei?","a":"Es ist das Schallsignal eines Schleppverbandes in Fahrt (schleppendes Fahrzeug lang-kurz-kurz; Anhang lang-kurz-kurz-kurz).","e":"Lang-kurz-kurz ist das Nebelsignal für Fahrzeuge mit eingeschränkter Manövrierfähigkeit, darunter Schlepper. Der besetzte Anhang antwortet mit lang-kurz-kurz-kurz."},{"id":"R20","cat":"Recht","nr":20,"bogen":5,"q":"Bei Nebel im Küstenbereich fahrend, hört man etwa jede Minute folgendes Signal: drei Glockenschläge, dann ca. 5 Sekunden lang rasches Läuten einer Glocke, dann drei Glockenschläge. Wer gibt dieses Signal?","a":"Fahrzeug auf Grund < 100 m Länge.","e":"Glockensignale kommen von Fahrzeugen, die festliegen (Anker oder Grund). Die drei Einzelschläge davor und danach unterscheiden das Grundsitzer- vom Ankersignal."},{"id":"R21","cat":"Recht","nr":21,"bogen":6,"q":"Sie sehen ein Fahrzeug mit folgender Lichterführung:\n1. Worum handelt es sich?\n2. Welches Schallsignal müsste dieses Fahrzeug bei unsichtigem Wetter geben?","a":"1. Treibnetzfischer (Fahrzeug, das nicht trawlt) in Fahrt oder vor Anker mit ausgebrachtem Fanggerät, das waagerecht weiter als 150 m ins Wasser reicht. (Das untere weiße Licht kann auch das Hecklicht sein).\n2. Schallsignal (lang-kurz-kurz) mindestens alle 2 Minuten.","e":"Rot über weiß heißt „Fischer, der nicht trawlt“. Das zusätzliche weiße Licht zeigt die Richtung des Fanggeräts – dort solltest du nicht durchfahren.","qs":"r21"},{"id":"R22","cat":"Recht","nr":22,"bogen":7,"q":"Sie sehen nachts auf See 2 rote Lichter senkrecht übereinander. Worum handelt es sich?","a":"Um ein manövrierunfähiges Fahrzeug in Fahrt ohne Fahrt durchs Wasser.","e":"Zwei rote Rundumlichter senkrecht heißen „manövrierunfähig“. Fehlen Seitenlichter und Hecklicht, treibt das Fahrzeug ohne Fahrt durchs Wasser – Tagsignal wären zwei schwarze Bälle."},{"id":"R23","cat":"Recht","nr":23,"bogen":4,"q":"Die Lichteranordnung eines Fahrzeugs ändert sich plötzlich von (Skizze 1) in (Skizze 2). Was schließen Sie daraus?","a":"Ein manövrierunfähiges Fahrzeug in Fahrt ohne Fahrt durchs Wasser (FdW) hat FdW aufgenommen, da man jetzt auch das Backbord-Seitenlicht sieht.","e":"Manövrierunfähige Fahrzeuge führen Seitenlichter und Hecklicht nur, wenn sie Fahrt durchs Wasser machen. Taucht plötzlich ein Seitenlicht auf, treibt das Fahrzeug also nicht mehr nur.","qs":"r23"},{"id":"R24","cat":"Recht","nr":24,"bogen":3,"q":"Was bestimmen die KVR über das Ausguckhalten?","a":"Es muss jederzeit durch Sehen und Hören sowie durch jedes andere verfügbare Mittel gehöriger Ausguck gehalten werden, der einen vollständigen Überblick über die Lage und die Möglichkeit der Gefahr eines Zusammenstoßes gibt.","e":"Ausguck ist die wichtigste Pflicht auf See. Er umfasst Augen, Ohren und alle Hilfsmittel (Radar, AIS, Funk) – rundum und ständig."},
